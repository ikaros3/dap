<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAP 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Gothic+A1:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F5F5;
  --grid:#E2E9E9;
  --surface:#FFFFFF;
  --surface-2:#F7FAFA;
  --ink:#101A1E;
  --ink-2:#3D4C53;
  --muted:#697C85;
  --line:#D9E1E2;
  --line-strong:#B9C7C9;
  --accent:#0B6B63;
  --accent-soft:#DCEDEA;
  --accent-ink:#07473F;
  --key:#A9700D;
  --key-soft:#F6EBD5;
  --ok:#0E7A5F;
  --ok-soft:#DBEFE7;
  --bad:#B4342B;
  --bad-soft:#F7E2DF;
  --warn:#8A6A12;
  --shadow:0 1px 2px rgba(16,26,30,.05), 0 8px 24px -14px rgba(16,26,30,.28);
  --radius:10px;
  --rail:264px;

  /* ---- 타이포그래피 (설정에서 변경) ---- */
  --fs:1;                       /* 전체 글자 크기 배율 */
  --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417;
    --grid:#141F23;
    --surface:#141E22;
    --surface-2:#18242A;
    --ink:#E7EEEF;
    --ink-2:#BFCDD1;
    --muted:#8FA3AA;
    --line:#243238;
    --line-strong:#33454C;
    --accent:#37B8A5;
    --accent-soft:#123632;
    --accent-ink:#8FE0D2;
    --key:#DCA548;
    --key-soft:#33280F;
    --ok:#41C094;
    --ok-soft:#0F3229;
    --bad:#E1685C;
    --bad-soft:#3A1E1B;
    --warn:#D6A93C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --grid:#141F23; --surface:#141E22; --surface-2:#18242A;
  --ink:#E7EEEF; --ink-2:#BFCDD1; --muted:#8FA3AA; --line:#243238; --line-strong:#33454C;
  --accent:#37B8A5; --accent-soft:#123632; --accent-ink:#8FE0D2;
  --key:#DCA548; --key-soft:#33280F;
  --ok:#41C094; --ok-soft:#0F3229; --bad:#E1685C; --bad-soft:#3A1E1B; --warn:#D6A93C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
  font-size:calc(15px * var(--fs)); line-height:1.62; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px; background-position:-1px -1px;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em; line-height:1.28}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono); font-size:calc(10.5px * var(--fs)); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ shell ============ */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}

/* ---- rail ---- */
.rail{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 14px 22px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 6px 16px}
.brand-mark{
  width:30px;height:30px;border-radius:7px;flex:none;
  background:var(--accent); color:#fff; display:grid; place-items:center;
  font-family:var(--font-mono); font-weight:600; font-size:calc(13px * var(--fs)); letter-spacing:-.03em;
}
:root[data-theme="dark"] .brand-mark, :root:not([data-theme="light"]) .brand-mark{color:#07231F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .brand-mark{color:#fff}}
.brand-name{font-weight:600; font-size:calc(15px * var(--fs)); letter-spacing:-.02em}
.brand-sub{font-size:calc(11px * var(--fs)); color:var(--muted); line-height:1.3}
.rail-group{padding:14px 6px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:7px; font-size:calc(13.5px * var(--fs)); color:var(--ink-2);
  border:1px solid transparent; transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 24%,transparent); font-weight:500}
.nav-ico{width:16px;flex:none;text-align:center;font-size:calc(12px * var(--fs));color:var(--muted)}
.nav-item[aria-current="true"] .nav-ico{color:var(--accent)}
.nav-count{margin-left:auto; font-family:var(--font-mono); font-size:calc(11px * var(--fs)); color:var(--muted); font-variant-numeric:tabular-nums}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));padding:1px 6px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:600}

.chap-row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;text-align:left;font-size:calc(13px * var(--fs));color:var(--ink-2)}
.chap-row:hover{background:var(--surface-2)}
.chap-num{font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);width:14px;flex:none}
.chap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-bar{width:38px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.chap-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.rail-foot{margin-top:auto;padding-top:14px;display:flex;gap:6px;align-items:center}
.ghost-btn{
  border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:5px 9px; font-size:calc(12px * var(--fs)); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px;
}
.ghost-btn:hover{border-color:var(--line-strong); background:var(--surface-2)}

/* ---- main ---- */
.main{min-width:0; padding:26px 30px 80px; max-width:1180px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.page-title{font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.028em}
.page-desc{color:var(--muted); font-size:calc(13.5px * var(--fs)); margin-top:3px; max-width:62ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:20px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; display:flex; flex-direction:column; gap:2px}
.tile-k{font-family:var(--font-mono); font-size:calc(10px * var(--fs)); letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.tile-v{font-family:var(--font-mono); font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.15}
.tile-s{font-size:calc(11.5px * var(--fs)); color:var(--muted)}
.tile-v small{font-size:calc(13px * var(--fs));font-weight:400;color:var(--muted);letter-spacing:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.sec-title{font-size:calc(14.5px * var(--fs));font-weight:600}

/* 이어풀기 */
.resume-list{display:flex;flex-direction:column}
.resume-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line)}
.resume-row:last-child{border-bottom:none}
.resume-row:hover{background:var(--surface-2)}
.resume-row .progress{min-width:120px;height:6px}
.resume-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 15px;margin-bottom:14px;
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);background:var(--accent-soft);border-radius:10px}
.resume-bar .progress{min-width:120px;height:6px;background:color-mix(in srgb,var(--accent) 22%,transparent)}

/* chapter meter table */
.meter-list{display:flex;flex-direction:column}
.meter-row{display:grid;grid-template-columns:20px minmax(0,1fr) 88px 46px;gap:10px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);font-size:calc(13.5px * var(--fs))}
.meter-row:last-child{border-bottom:none}
.meter-row:hover{background:var(--surface-2)}
.meter-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-fill{height:100%;border-radius:99px;background:var(--accent)}
.meter-fill.low{background:var(--bad)} .meter-fill.mid{background:var(--key)}
.meter-pct{font-family:var(--font-mono);font-size:calc(12.5px * var(--fs));text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:calc(11.5px * var(--fs));border:1px solid var(--line);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.chip.mono{font-size:calc(11px * var(--fs))}
.chip-accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent-ink)}
.chip-key{background:var(--key-soft);border-color:color-mix(in srgb,var(--key) 30%,transparent);color:var(--key)}
.chip-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.chip-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:calc(13.5px * var(--fs));font-weight:500;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#06231F}}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn-sm{padding:5px 11px;font-size:calc(12.5px * var(--fs))}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* mode launcher cards */
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.launch-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .14s,transform .14s}
.launch-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.launch-t{font-weight:600;font-size:calc(14.5px * var(--fs));display:flex;align-items:center;gap:7px}
.launch-d{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.5}

/* ============ quiz ============ */
.quizbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress{flex:1;min-width:200px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.timer{font-family:var(--font-mono);font-size:calc(14px * var(--fs));font-weight:500;padding:3px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.qhead .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1px solid transparent;color:var(--muted);font-size:calc(14px * var(--fs))}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}
.icon-btn.on{color:var(--key)}
.qbody{padding:20px 22px 6px}
.qtext{font-size:calc(16.5px * var(--fs));line-height:1.66;font-weight:500;white-space:pre-line;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;padding:14px 14px 18px;gap:6px}
.opt{
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start;
  width:100%;text-align:left;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font-size:calc(14.5px * var(--fs));line-height:1.55;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
.opt-n{font-family:var(--font-mono);font-size:calc(12px * var(--fs));font-weight:600;color:var(--muted);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .opt-n{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .opt.sel .opt-n{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.sel .opt-n{color:#06231F}}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt-txt{white-space:pre-line}

.explain{margin:0 14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:13px 15px;display:flex;flex-direction:column;gap:7px}
.explain-h{display:flex;align-items:center;gap:8px}
.explain-b{font-size:calc(13.5px * var(--fs));color:var(--ink-2);line-height:1.65}
/* 원천 자료 — 해설 아래에 옅게. 원문을 찾아볼 수 있도록 문서명과 장·절을 함께 적는다 */
.explain-s{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.55;
  padding-top:7px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:baseline}
.explain-s b{font-weight:600;color:var(--ink-2);white-space:nowrap}
/* 원천 바로 아래 오는 참고 파일 줄 — 같은 묶음으로 읽히도록 구분선을 한 번만 긋는다 */
.explain-s + .explain-s{border-top:0;padding-top:2px}
/* 참고 파일은 한 줄에 하나씩. 파일명은 띄어쓰기 없는 긴 토막이 섞여 있어 어디서든 접히게 둔다 */
.explain-s.file ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.explain-s.file li{overflow-wrap:anywhere}
/* 자료 종류(요약본·강의자료…) — 제목이 비슷한 다른 문서를 가려 준다 */
.explain-s.file i{font-style:normal;font-size:calc(10.5px * var(--fs));color:var(--ink-2);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.qfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.qfoot .spacer{flex:1}
.kbd{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}

/* question navigator */
.navgrid{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.navdot{width:29px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.navdot:hover{border-color:var(--line-strong)}
.navdot.answered{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent-ink)}
.navdot.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 34%,transparent);color:var(--ok)}
.navdot.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 34%,transparent);color:var(--bad)}
.navdot.cur{outline:2px solid var(--accent);outline-offset:1px}
.navdot.flag{border-color:var(--key);border-width:2px}

/* result */
.score-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:22px 22px}
.score-big{font-family:var(--font-mono);font-size:calc(52px * var(--fs));font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-size:calc(19px * var(--fs));color:var(--muted);font-weight:400}
.verdict{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;font-weight:600;font-size:calc(13.5px * var(--fs))}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}

table.tbl{width:100%;border-collapse:collapse;font-size:calc(13.5px * var(--fs))}
.tblwrap{overflow-x:auto}
table.tbl th{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.tbl tbody tr:hover{background:var(--surface-2)}

/* review list */
.rev{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:10px}
.rev-h{display:flex;gap:9px;align-items:center;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rev-b{padding:13px 16px;display:flex;flex-direction:column;gap:9px}
.rev-q{font-size:calc(14.5px * var(--fs));font-weight:500;white-space:pre-line}
.rev-a{font-size:calc(13px * var(--fs));color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.rev-a b{font-weight:600}
.tag-ok{color:var(--ok)} .tag-bad{color:var(--bad)}

/* filters / inputs */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text],input[type=number],select{
  font:inherit;font-size:calc(13.5px * var(--fs));padding:7px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);min-width:0;
}

@media (max-width:900px){

  .score-big{font-size:calc(42px * var(--fs))}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ============ 로딩 화면 ============ */
#boot{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:var(--bg); font-family:var(--font-ui);

/* ============ 폰트 설정 ============ */

  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

</head>
<body>

<div id="boot" role="status" aria-live="polite">
  <div class="boot-box">
    <div class="boot-mark">DA</div>
    <div class="boot-title">DAP 문제은행</div>
    <div class="boot-msg" id="bootMsg">문제은행을 불러오는 중…</div>
    <div class="boot-track"><i id="bootBar"></i></div>
    <div class="boot-err" id="bootErr" style="display:none"></div>
  </div>
</div>

<div class="mobile-top">
  <button class="ghost-btn" id="mnav">☰ 메뉴</button>
  <strong style="font-size:calc(14px * var(--fs))" id="brandTop">DAP 문제은행</strong>
</div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark">DA</div>
      <div>
        <div class="brand-name" id="brandName">DAP 문제은행</div>
        <div class="brand-sub mono" id="brandSub">로딩 중…</div>
      </div>
    </div>

    <div id="bankBox"></div>

    <nav class="nav" id="navMain"></nav>

    <div class="rail-group"><span class="eyebrow">과목</span></div>
    <div class="nav" id="navChap"></div>

    <div class="rail-foot">
      <button class="ghost-btn" id="themeBtn" title="테마 전환">◐ 테마</button>
      <button class="ghost-btn" id="resetHint" title="설정">⚙ 설정</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ 문제은행 로더 ═══════════
   data/manifest.js 를 읽고, 거기에 나열된 팩 파일을 순서대로 불러와
   window.DAP = { exam, chapters, questions, sets } 를 만든 뒤 앱을 시작한다.
   팩 파일은 DAP_BANK.add({chapter, pack, questions}) 를 호출한다.
   ─ 모든 파일은 UTF-8(BOM 없음)로 저장해야 한글이 깨지지 않는다. */
(function(){
"use strict";
var BASE = "data/";
var packs = [];

var blobs = [];
window.DAP_BANK = {
  _col: "core",                 /* 로더가 파일마다 바꿔 준다 */
  add: function(pack){
    if(!pack || !pack.questions || !pack.questions.length) return;
    pack.collection = pack.collection || window.DAP_BANK._col;
    packs.push(pack);
  },
  /* 암호화된 팩. 내용은 잠긴 채로 두고, 앱에서 암호를 받아 풀 때 문항이 된다.
     { collection, salt, iv, data } — data 는 AES-GCM 암호문(base64) */
  addEncrypted: function(blob){
    if(!blob || !blob.data) return;
    blob.collection = blob.collection || window.DAP_BANK._col;
    blobs.push(blob);
  }
};

/* ---- 로딩 화면 ---- */
var bootEl = document.getElementById("boot"),
    msgEl  = document.getElementById("bootMsg"),
    barEl  = document.getElementById("bootBar"),
    errEl  = document.getElementById("bootErr");
function progress(done, total, label){
  if(barEl) barEl.style.width = (total ? Math.round(done/total*100) : 5) + "%";
  if(msgEl && label) msgEl.textContent = label;
}
function fail(title, detail){
  if(msgEl) msgEl.textContent = "문제은행을 불러오지 못했습니다";
  if(barEl) barEl.style.background = "var(--bad)";
  if(errEl){ errEl.style.display = "block"; errEl.textContent = title + "\n\n" + detail; }
}

/* 저장해 둔 폰트 설정을 먼저 적용해서 로딩 화면부터 같은 글꼴로 보이게 한다 */
(function earlyFont(){
  try{
    var raw = localStorage.getItem("dap750:v1");
    if(!raw) return;
    var st = JSON.parse(raw).settings || {};
    if(st.theme && st.theme !== "auto") document.documentElement.setAttribute("data-theme", st.theme);
    if(st.fontStack) document.documentElement.style.setProperty("--font-ui", st.fontStack);
    if(st.fontScale) document.documentElement.style.setProperty("--fs", String(st.fontScale));
  }catch(e){}
})();

/* ---- 스크립트 순차 로딩 ---- */
function loadScript(src, ok, no){
  var el = document.createElement("script");
  el.src = src;
  el.charset = "UTF-8";          /* 한글 깨짐 방지 */
  el.async = false;
  el.onload = function(){ ok(); };
  el.onerror = function(){ no(src); };
  document.head.appendChild(el);
}
function loadSeq(list, onEach, done, no){
  var i = 0;
  (function step(){
    if(i >= list.length) return done();
    var it = list[i];
    window.DAP_BANK._col = it.col;
    loadScript(it.src,
      function(){ i++; onEach(i, list.length, it.src); step(); },
      function(src){
        /* optional 팩은 없어도 넘어간다 — 로컬 전용 묶음이 배포본에서 빠져도
           앱 전체가 멈추지 않도록 하기 위한 것이다. */
        if(it.optional){ i++; onEach(i, list.length, it.src); step(); return; }
        no(src);
      });
  })();
}

var HINT =
  "확인할 것\n" +
  "  1. dap.html 과 같은 폴더에 data 폴더가 있는지\n" +
  "  2. data/manifest.js 의 files 목록에 적힌 파일이 실제로 있는지\n" +
  "  3. 파일 이름의 대소문자가 정확한지\n" +
  "  4. 브라우저 콘솔(F12)에 구문 오류가 찍혀 있는지";

progress(0, 1, "매니페스트를 읽는 중…");
loadScript(BASE + "manifest.js", startPacks, function(){
  fail("data/manifest.js 를 찾을 수 없습니다.", HINT);
});

function startPacks(){
  var M = window.DAP_MANIFEST;
  if(!M || !M.chapters || !M.files){
    fail("data/manifest.js 의 형식이 올바르지 않습니다.",
         "window.DAP_MANIFEST = { exam, chapters, files } 형태여야 합니다.");
    return;
  }
  var files = M.files.map(function(f){
    if(typeof f === "string") return { src: BASE + f, col:"core", optional:false };
    return { src: BASE + (f.file || f.path || ""), col: f.collection || "core", optional: !!f.optional };
  });
  progress(0, files.length + 1, "문제은행 " + files.length + "개 파일을 읽는 중…");
  loadSeq(files,
    function(done, total, src){
      progress(done, total + 1, String(src).replace(BASE, "") + " (" + done + "/" + total + ")");
    },
    function(){ assemble(M); },
    function(src){
      fail(src + " 를 불러오지 못했습니다.", HINT);
    });
}

/* ---- 조립 ----
   묶음(collection)마다 독립된 문제은행을 만든다. 묶음이 다르면 문항도, 모의고사
   세트도 섞이지 않는다. manifest 에 collections 가 없으면 전체를 묶음 하나로 본다. */
function buildBank(M, def, myPacks){
  var chapters = M.chapters.map(function(c){
    return { id:c.id, name:c.name, perSet:c.perSet, score:c.score,
             blockSize: c.blockSize > 0 ? c.blockSize : c.perSet * 2,
             count:0, packs:[] };
  });
  var chMap = {};
  chapters.forEach(function(c){ chMap[c.id] = c; });

  var seen = {}, questions = [], dupes = 0, orphans = 0;
  var fixedSets = [];          /* 팩이 직접 지정한 세트 */
  myPacks.forEach(function(pk){
    if(pk.sets && pk.sets.length){
      pk.sets.forEach(function(st){
        if(st && st.ids && st.ids.length) fixedSets.push({ title:st.title || "", ids:st.ids.slice() });
      });
    }
    var ch = chMap[pk.chapter];
    if(!ch){ orphans += pk.questions.length; return; }
    var added = 0;
    pk.questions.forEach(function(q){
      if(!q || !q.id || !q.q || !q.c || q.c.length < 2 || typeof q.a !== "number") return;
      if(seen[q.id]){ dupes++; return; }
      seen[q.id] = true;
      questions.push({
        id:q.id, ch:ch.id, no:(q.no || 0),
        q:q.q, c:q.c, a:q.a, e:(q.e || ""), s:(q.s || (ch.id + "장")),
        /* 원천 자료. 문항에 r 이 있으면 그것을, 없으면 팩의 source 를 쓴다.
           해설과 함께 보여 주어 원문을 찾아볼 수 있게 한다. */
        r:(q.r || pk.source || ""),
        /* 출제할 때 실제로 펼쳐 본 data_source/ 의 파일. 문항에 rf 가 있으면
           그것을, 없으면 팩의 sourceFiles 를 쓴다. 배열이면 한 줄로 잇는다.
           앱 스크립트의 함수는 이 로더에서 부를 수 없으므로 여기서 직접 만든다. */
        f:(function(v){
            if(!v) return "";
            return Array.isArray(v)
              ? v.filter(function(x){ return x; }).join(" · ")
              : String(v);
          })(q.rf || pk.sourceFiles)
      });
      added++;
    });
    ch.packs.push({ pack:(pk.pack || "?"), count:added });
  });

  /* 과목별 정렬(no 순) · 표시 번호 재부여 · 문항 수 집계 */
  var byCh = {};
  questions.forEach(function(q){ (byCh[q.ch] = byCh[q.ch] || []).push(q); });
  var ordered = [];
  chapters.forEach(function(c){
    var pool = byCh[c.id] || [];
    pool.sort(function(a,b){ return (a.no||0) - (b.no||0); });
    pool.forEach(function(q, i){ q.no = i + 1; });
    c.count = pool.length;
    ordered = ordered.concat(pool);
  });

  /* 팩이 세트를 직접 지정했으면 그대로 쓴다. 원본 모의고사처럼 과목 비율이
     시험과 다른 자료를 원래 구성 그대로 보존하기 위한 것이다. */
  if(fixedSets.length){
    var have = {};
    questions.forEach(function(q){ have[q.id] = true; });
    var kept = fixedSets.map(function(st){
      return { title:st.title, ids:st.ids.filter(function(id){ return have[id]; }) };
    }).filter(function(st){ return st.ids.length; });
    if(kept.length){
      return {
        id: def.id, name: def.name || def.id, note: def.note || "",
        exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
        chapters: chapters, questions: ordered,
        sets: kept.map(function(st){ return st.ids; }),
        setTitles: kept.map(function(st){ return st.title; }),
        loaded: { packs:myPacks.length, dupes:dupes, orphans:orphans }
      };
    }
  }

  /* 모의고사 세트 = 과목별 문항을 perSet 단위로 순서대로 잘라 묶는다. */
  var setCount = Infinity;
  chapters.forEach(function(c){
    setCount = Math.min(setCount, c.perSet > 0 ? Math.floor(c.count / c.perSet) : 0);
  });
  if(!isFinite(setCount) || setCount < 0) setCount = 0;
  var sets = [];
  for(var sN = 0; sN < setCount; sN++){
    var ids = [];
    chapters.forEach(function(c){
      var pool = byCh[c.id] || [];
      pool.slice(sN * c.perSet, (sN + 1) * c.perSet).forEach(function(q){ ids.push(q.id); });
    });
    sets.push(ids);
  }

  if(dupes)   console.warn("[DAP] " + def.id + ": 중복 id 문항 " + dupes + "개를 건너뛰었습니다.");
  if(orphans) console.warn("[DAP] " + def.id + ": manifest.chapters 에 없는 과목의 문항 " + orphans + "개를 건너뛰었습니다.");

  return {
    id: def.id, name: def.name || def.id, note: def.note || "",
    exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
    chapters: chapters, questions: ordered, sets: sets,
    loaded: { packs:myPacks.length, dupes:dupes, orphans:orphans }
  };
}

function assemble(M){
  progress(1, 1, "문항을 정리하는 중…");

  var defs = (M.collections && M.collections.length)
    ? M.collections
    : [{ id:"core", name:"문제은행" }];

  var banks = [];
  defs.forEach(function(def){
    var mine  = packs.filter(function(p){ return (p.collection || "core") === def.id; });
    var mineE = blobs.filter(function(p){ return (p.collection || "core") === def.id; });
    if(mine.length){
      var b = buildBank(M, def, mine);
      if(b.questions.length){ banks.push(b); return; }
    }
    if(mineE.length){
      /* 잠긴 묶음 — 앱에서 암호를 넣으면 그때 문항이 채워진다 */
      banks.push({
        id: def.id, name: def.name || def.id, note: def.note || "",
        exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
        chapters: [], questions: [], sets: [],
        locked: true, blobs: mineE,
        loaded: { packs:0, dupes:0, orphans:0 }
      });
    }
  });

  if(!banks.filter(function(b){ return b.questions.length || b.locked; }).length){
    fail("문항이 하나도 없습니다.",
         "data/manifest.js 의 files 에 팩 파일이 나열되어 있는지, 팩 파일이 " +
         "DAP_BANK.add({chapter, pack, questions}) 를 호출하는지 확인하세요.");
    return;
  }

  window.DAP_BANKS = banks;
  window.DAP_BUILD = buildBank;      /* 잠긴 묶음을 나중에 조립할 때 쓴다 */
  window.DAP_MF    = M;
  window.DAP = banks[0];         /* 앱이 시작하면서 저장된 선택으로 바꾼다 */

  boot();
}

/* 앱 스크립트는 문서 뒤쪽에 있으므로, 아직 파싱되지 않았으면 기다렸다가 시작한다 */
function boot(){
  if(typeof window.DAP_APP_BOOT !== "function"){
    if(document.readyState !== "complete"){
      window.addEventListener("load", boot, { once:true });
      return;
    }
    fail("앱 스크립트가 로드되지 않았습니다.", "dap.html 이 손상되었을 수 있습니다.");
    return;
  }
  try{
    window.DAP_APP_BOOT();
  }catch(e){
    fail("앱을 시작하지 못했습니다.", String((e && e.stack) || e));
    return;
  }
  if(bootEl){
    bootEl.classList.add("gone");
    setTimeout(function(){ if(bootEl.parentNode) bootEl.parentNode.removeChild(bootEl); }, 320);
  }
}
})();
</script>
<script>
window.DAP_APP_BOOT = function(){
"use strict";
/* ─────────── 상수 ─────────── */
/* 문제은행 묶음 — 묶음을 바꾸면 문항·모의고사 세트·진행 중 세션이 통째로 바뀐다.
   풀이 기록(S.stats)은 문항 id 로 관리하므로 묶음이 달라도 그대로 유지된다. */
var BANKS = window.DAP_BANKS || [window.DAP];
var DAP, CH, CHLIST, QMAP, EXAM, PER_Q, TOTAL_SCORE, TOTAL_Q;

function bankById(id){
  for(var i=0;i<BANKS.length;i++) if(BANKS[i].id===id) return BANKS[i];
  return null;
}
function useBank(id){
  var b = bankById(id) || BANKS[0];
  DAP = window.DAP = b;
  CHLIST = DAP.chapters;
  CH = {}; CHLIST.forEach(function(c){ CH[c.id]=c; });
  QMAP = {}; DAP.questions.forEach(function(q){ QMAP[q.id]=q; });
  EXAM = DAP.exam;
  PER_Q = EXAM.perQuestion; TOTAL_SCORE = EXAM.totalScore; TOTAL_Q = EXAM.totalQuestions;
  return b.id;
}
useBank(BANKS[0].id);

/* 세션 키는 묶음별로 분리한다. 같은 "ch1:b0" 라도 묶음이 다르면 다른 세션이다. */
function skey(k){ return DAP.id + "/" + k; }
/* ─────────── 폰트 목록 ───────────
   웹앱에서 시인성이 좋은 한글 본문용 글꼴만 추렸다. 첫 항목이 기본값이다. */
var FONTS = [
  { id:"pretendard", name:"Pretendard", note:"기본 · 균형 잡힌 현대적 고딕",
    stack:'"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"plex", name:"IBM Plex Sans KR", note:"또렷한 획 · 문서형 화면에 적합",
    stack:'"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"noto", name:"Noto Sans KR", note:"표준적이고 무난한 본문 고딕",
    stack:'"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"gothica1", name:"Gothic A1", note:"넉넉한 자간 · 긴 지문 읽기 편함",
    stack:'"Gothic A1",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"system", name:"시스템 기본", note:"네트워크 없이도 즉시 표시",
    stack:'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Segoe UI",sans-serif' }
];
var FONT_MAP = {}; FONTS.forEach(function(f){ FONT_MAP[f.id] = f; });
var FS_MIN = 0.8, FS_MAX = 1.6, FS_STEP = 0.05;

var BOX_DAYS = [0, 1, 2, 4, 8, 16, 35];
var KEY = "dap750:v1";

/* ─────────── 저장소 ─────────── */
var S = load();
function blank(){
  return { stats:{}, bookmarks:{}, wrong:{}, exams:[], sessions:{}, epoch:0, rev:0, by:"",
           /* target = 필기 60점 만점 중 목표 점수. 합격은 필기+실기(40점) 합산 75점이므로
              실기에서 23점을 얻는다고 보면 필기 52점이 목표가 된다. */
           settings:{ timerMin:90, target:52, theme:"auto", bank:"",
                      fontId:FONTS[0].id, fontStack:FONTS[0].stack, fontScale:1 } };
}
function normalize(o){
  var b = blank();
  for(var k in b) if(!(k in o) || o[k]===null) o[k]=b[k];
  for(var k2 in b.settings) if(!(k2 in o.settings)) o.settings[k2]=b.settings[k2];
  /* 목표 점수 기본값을 45 → 52 로 올렸다. 옛 기본값을 그대로 쓰고 있던 기기만
     한 번 옮긴다. 직접 정한 값은 건드리지 않는다. */
  if(!o.settings.tgt2){ if(o.settings.target === 45) o.settings.target = 52; o.settings.tgt2 = 1; }
  /* v1 → v2 이관: 단일 session 슬롯을 키별 sessions 맵으로 */
  if(o.session && o.session.ids && !Object.keys(o.sessions).length){
    var key = o.session.key || "legacy";
    o.session.key = key; o.session.ts = o.session.ts || Date.now();
    o.sessions[key] = o.session;
  }
  delete o.session;
  /* 폰트 설정 보정 — 목록에 없는 id 는 기본값으로 되돌린다 */
  var f = FONT_MAP[o.settings.fontId] || FONTS[0];
  o.settings.fontId = f.id;
  o.settings.fontStack = f.stack;
  var sc = parseFloat(o.settings.fontScale);
  if(!isFinite(sc)) sc = 1;
  o.settings.fontScale = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, sc)) * 100) / 100;
  return o;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    return normalize(JSON.parse(raw));
  }catch(e){ return blank(); }
}
/* 묶음 기능 이전에 저장된 세션은 키에 묶음 접두사가 없어 지금 코드로는 찾지 못한다.
   기본 묶음 것으로 보고 이름만 옮긴다. 풀이 기록(S.stats)은 문항 id 기준이라
   영향이 없고, 여기서 되살아나는 것은 "몇 번까지 풀었는가" 하는 위치뿐이다. */
(function migrateSessionKeys(){
  var pre = BANKS[0].id + "/", moved = 0;
  Object.keys(S.sessions).forEach(function(k){
    if(k.indexOf("/") >= 0) return;
    var old = S.sessions[k];
    delete S.sessions[k];
    if(!old || !old.ids || !old.ids.length) return;
    var nk = pre + k, cur = S.sessions[nk];
    if(!cur || (old.ts||0) > (cur.ts||0)){ old.key = nk; S.sessions[nk] = old; }
    moved++;
  });
  if(moved) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
})();
/* 블록 크기를 바꾸면 예전 경계로 만들어진 블록 세션(ch1:b25 처럼)은 지금 화면의
   어느 블록과도 맞지 않는다. 이어풀기 목록에 유령으로 남으므로 지운다.
   풀이 기록(S.stats)은 문항 id 기준이라 그대로 남고, 사라지는 것은 "그 블록의
   몇 번째까지 풀었는가" 하는 위치뿐이다. */
(function migrateBlockSessions(){
  var dropped = 0;
  Object.keys(S.sessions).forEach(function(k){
    var raw = k.indexOf("/") >= 0 ? k.slice(k.indexOf("/")+1) : k;
    var m = /^ch(\d+):b(\d+)$/.exec(raw);
    if(!m) return;
    var c = CH[+m[1]];
    var bs = c ? (c.blockSize > 0 ? c.blockSize : c.perSet * 2) : 20;
    if(+m[2] % bs === 0) return;
    delete S.sessions[k]; dropped++;
  });
  if(dropped) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
})();

var saveT=null;

/* ─────────── 유틸 ─────────── */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
/* 해설 밑에 붙는 원천 자료 한 줄. 원문을 찾아볼 수 있게 문서명과 장·절을 함께 적는다.
   문서명(q.r)이 없는 옛 문항은 장·절만 보여 준다. */
function srcLine(q){
  var where = [q.r, q.s].filter(function(x){ return x; }).join(" · ");
  var out = where ? '<div class="explain-s"><b>원천</b><span>'+esc(where)+'</span></div>' : "";
  /* 원천 아래에 실제로 참고한 파일 이름을 덧붙인다. 원천이 "무엇을 근거로 했나"라면
     이쪽은 "어느 파일을 열면 되나"에 답한다. 옛 팩처럼 파일이 없으면 생략한다.
     파일마다 어떤 자료인지 함께 적는다. 「V. 데이터베이스 설계와 이용.hwpx」와
     「5과목. 데이터베이스 설계와 이용.pdf」처럼 제목만으로는 같은 문서로 보이지만
     각각 요약본과 강의자료인 경우가 있다. */
  if(q.f){
    var items = q.f.split(" · ").filter(function(x){ return x; }).map(function(name){
      var kind = srcKind(name);
      return '<li>'+esc(name)+(kind? ' <i>'+esc(kind)+'</i>' : '')+'</li>';
    }).join("");
    out += '<div class="explain-s file"><b>참고 파일</b><ul>'+items+'</ul></div>';
  }
  return out;
}
/* 파일 이름만 보고 어떤 자료인지 가려낸다. data_source/README.md 의 A~D 묶음이다. */
function srcKind(name){
  if(/^\[데이터 전문가 포럼\]/.test(name)) return "교재";
  if(/^[IVX]+\. /.test(name))              return "요약본";
  if(/^\d과목\./.test(name))               return "강의자료";
  if(/\.docx?$/.test(name))                return "워드 요약";
  return "";
}
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)
    +" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function shuffle(a, seed){
  var arr = a.slice(), s = seed || Date.now();
  function rnd(){ s = (s*1664525 + 1013904223) % 4294967296; return s/4294967296; }
  for(var i=arr.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* 학습용 [문항 블록] 하나의 문항 수. manifest 의 blockSize 를 쓰고, 없으면
   시험 출제 단위(perSet)의 2배로 본다. 시험 단위의 정수배여야 블록을 그대로
   모의고사 감각으로 풀 수 있다. */
function blockSize(ch){
  var c = CH[ch];
  if(c && c.blockSize > 0) return c.blockSize;
  if(c && c.perSet > 0) return c.perSet * 2;
  return 20;
}

/* ─────────── 통계 파생 ─────────── */
function st(id){ return S.stats[id] || null; }
function chStat(ch){
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  var seen=0, right=0, tries=0, ok=0;
  qs.forEach(function(q){
    var s = st(q.id); if(!s) return;
    seen++; tries += s.right+s.wrong; ok += s.right;
    if(s.right>0 && s.wrong===0) right++;
  });
  return { total:qs.length, seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,qs.length) };
}
function overall(){
  var seen=0,tries=0,ok=0;
  DAP.questions.forEach(function(q){ var s=st(q.id); if(!s) return; seen++; tries+=s.right+s.wrong; ok+=s.right; });
  return { seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,DAP.questions.length) };
}
function wrongIds(){ return Object.keys(S.wrong).filter(function(id){ return QMAP[id]; }); }
function bookmarkIds(){ return Object.keys(S.bookmarks).filter(function(id){ return S.bookmarks[id] && QMAP[id]; }); }
function dueIds(){
  var now = Date.now();
  return Object.keys(S.stats).filter(function(id){
    var s = S.stats[id];
    return QMAP[id] && s.due && s.due <= now && s.box < 6;
  }).sort(function(a,b){ return S.stats[a].due - S.stats[b].due; });
}
function weakSections(limit){
  var m = {};
  DAP.questions.forEach(function(q){
    var s = st(q.id); if(!s || s.wrong===0) return;
    var key = q.ch + "|" + q.s;
    if(!m[key]) m[key] = { ch:q.ch, sec:q.s, wrong:0, tries:0 };
    m[key].wrong += s.wrong; m[key].tries += s.wrong + s.right;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.wrong - a.wrong; }).slice(0, limit||8);
}

/* ─────────── 채점 기록 ─────────── */
/* pick = 마지막에 고른 보기 번호. 문항 id 로 관리되므로 묶음·기기와 무관하게 남고
   Gist 로 동기화된다. 정오답은 pick 과 q.a 를 비교하면 나오므로 따로 두지 않는다. */
function record(qid, correct, pick){
  var s = S.stats[qid] || (S.stats[qid] = { right:0, wrong:0, box:0, due:0, last:0 });
  s.last = Date.now();
  if(pick !== undefined && pick !== null) s.pick = pick;
  if(correct){
    s.right++;
    s.box = Math.min(6, (s.box||0) + 1);
    delete S.wrong[qid];
  }else{
    s.wrong++;
    s.box = 0;
    S.wrong[qid] = true;
  }
  s.due = Date.now() + BOX_DAYS[Math.min(s.box, BOX_DAYS.length-1)] * 864e5;
  save();
}

/* ═══════════ 잠긴 문제은행 묶음 ═══════════
   외부에서 가져온 문항은 평문으로 배포하지 않는다. AES-GCM 으로 암호화한
   파일만 저장소에 올리고, 앱에서 암호를 받아 그때 풀어서 쓴다.
   암호는 앱에서 직접 정한다 — 소스 어디에도 적혀 있지 않다.

   주의: WebCrypto 는 보안 컨텍스트에서만 동작한다. https 로 연 배포본과
   localhost 에서는 되고, file:// 로 연 로컬 파일에서는 되지 않는다. */
var LOCK_KEY = "dap750:lock";     /* 기억해 둔 암호 (묶음 id 별) */
var PBKDF2_ROUNDS = 200000;

function cryptoOK(){
  return !!(window.crypto && window.crypto.subtle && window.isSecureContext);
}
function b64enc(buf){
  var b = new Uint8Array(buf), s = "";
  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64dec(str){
  var s = atob(str), b = new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return b;
}
function loadLocks(){
  try{ return JSON.parse(localStorage.getItem(LOCK_KEY) || "{}"); }catch(e){ return {}; }
}
function saveLocks(o){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(o)); }catch(e){} }

/* 암호 → 키 */
function deriveKey(pw, salt){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:PBKDF2_ROUNDS, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
    });
}

function encryptPacks(packsArr, pw){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv   = crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw, salt).then(function(key){
    var body = new TextEncoder().encode(JSON.stringify(packsArr));
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, body);
  }).then(function(ct){
    return { salt:b64enc(salt), iv:b64enc(iv), data:b64enc(ct) };
  });
}

function decryptBlob(blob, pw){
  return deriveKey(pw, b64dec(blob.salt)).then(function(key){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64dec(blob.iv) }, key, b64dec(blob.data));
  }).then(function(pt){
    return JSON.parse(new TextDecoder().decode(pt));
  });
}

/* 잠긴 묶음을 풀어 실제 문제은행으로 바꾼다 */
function unlockBank(bank, pw, ok, err){
  if(!cryptoOK()){
    err("이 브라우저에서는 복호화를 쓸 수 없습니다. https 주소로 열어 주세요.");
    return;
  }
  var got = [];
  var i = 0;
  (function step(){
    if(i >= bank.blobs.length){
      var built = window.DAP_BUILD(window.DAP_MF,
        { id:bank.id, name:bank.name, note:bank.note }, got);
      if(!built.questions.length){ err("복호화는 됐지만 문항이 없습니다."); return; }
      built.wasLocked = true;
      for(var k=0;k<BANKS.length;k++) if(BANKS[k].id === bank.id) BANKS[k] = built;
      ok(built);
      return;
    }
    decryptBlob(bank.blobs[i], pw).then(function(arr){
      (Array.isArray(arr) ? arr : [arr]).forEach(function(p){ got.push(p); });
      i++; step();
    }, function(){ err("암호가 맞지 않습니다."); });
  })();
}

/* 묶음을 고를 때 잠겨 있으면 암호를 받는다 */
function openBank(id){
  var b = bankById(id);
  if(!b) return;
  if(!b.locked){ switchBank(id); return; }

  var locks = loadLocks();
  var pw = locks[id];
  if(pw){
    unlockBank(b, pw, function(){ switchBank(id); },
      function(m){ delete locks[id]; saveLocks(locks); toast(m + " 다시 입력하세요."); askPw(b); });
    return;
  }
  askPw(b);
}

function askPw(b){
  var pw = prompt(b.name + " 묶음은 암호로 잠겨 있습니다.\n암호를 입력하세요.");
  if(pw === null){ renderBankBox(); return; }   /* 취소 — 선택 상자를 원래대로 */
  if(!pw){ toast("암호를 입력하세요"); renderBankBox(); return; }
  toast("여는 중…");
  unlockBank(b, pw, function(){
    var locks = loadLocks(); locks[b.id] = pw; saveLocks(locks);
    switchBank(b.id);
  }, function(m){
    toast(m);
    renderBankBox();
  });
}

/* 평문 팩 → 암호화 파일 만들기 (설정 화면) */
function makeEncryptedPack(){
  if(!cryptoOK()){
    toast("https 주소로 열어야 암호화를 쓸 수 있습니다");
    return;
  }
  var fi = $("#packIn");
  if(fi){ fi.value = ""; fi.click(); }
}

function handlePackFile(file){
  var r = new FileReader();
  r.onerror = function(){ toast("파일을 읽지 못했습니다"); };
  r.onload = function(){
    var arr;
    try{
      arr = JSON.parse(String(r.result));
      if(!Array.isArray(arr)) arr = [arr];
      var n = 0;
      arr.forEach(function(p){
        if(!p || !p.questions || !p.questions.length) throw 0;
        n += p.questions.length;
      });
      if(!n) throw 0;
      var colId = ($("#packCol") && $("#packCol").value) || "practice";
      var pw  = prompt("이 팩을 잠글 암호를 정하세요.\n12자 이상을 권합니다. 잊으면 되살릴 수 없습니다.");
      if(!pw) { toast("취소했습니다"); return; }
      var pw2 = prompt("확인을 위해 한 번 더 입력하세요.");
      if(pw !== pw2){ toast("두 번 입력한 암호가 다릅니다"); return; }

      toast("암호화하는 중…");
      encryptPacks(arr, pw).then(function(blob){
        var js = "/*! 암호화된 문제은행 팩 — 평문이 아니므로 그대로 커밋해도 된다.\n" +
                 " *  묶음: " + colId + " · 문항 " + n + "개 · AES-GCM / PBKDF2-SHA256 " +
                 PBKDF2_ROUNDS + "회\n */\n" +
                 "DAP_BANK.addEncrypted(" + JSON.stringify({
                   collection: colId, salt: blob.salt, iv: blob.iv, data: blob.data
                 }) + ");\n";
        var bl = new Blob([js], { type:"application/javascript;charset=utf-8" });
        var url = URL.createObjectURL(bl);
        var a = document.createElement("a");
        a.href = url; a.download = colId + ".enc.js"; a.style.display = "none";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        var locks = loadLocks(); locks[colId] = pw; saveLocks(locks);
        toast(colId + ".enc.js 를 저장했습니다 · data/ 에 넣고 manifest 에 추가하세요");
      }, function(){ toast("암호화에 실패했습니다"); });
    }catch(e){ toast("팩 형식이 아닙니다 · [{chapter,pack,questions:[…]}] 이어야 합니다"); }
  };
  r.readAsText(file);
}

function forgetPw(id){
  var locks = loadLocks();
  if(!locks[id]){ toast("기억된 암호가 없습니다"); return; }
  delete locks[id]; saveLocks(locks);
  toast("기억된 암호를 지웠습니다 · 다음에 다시 물어봅니다");
  render();
}

    '</div>'+

    '</div></div>';
  return h;

function tile(k,v,s){ return '<div class="tile"><span class="tile-k">'+k+'</span><span class="tile-v mono">'+v+'</span><span class="tile-s">'+esc(s)+'</span></div>'; }
function launch(ico,t,d,go){ return '<button class="launch-card" data-go="'+go+'"><span class="launch-t"><span style="color:var(--accent)">'+ico+'</span>'+t+'</span><span class="launch-d">'+d+'</span></button>'; }
function verdictChip(e){
  var target = S.settings.target;
  var fail = e.byCh && CHLIST.some(function(c){ var b=e.byCh[c.id]; return b && pct(b.correct,b.count) < 40; });
  if(fail) return '<span class="chip chip-bad">과락</span>';
  return e.score >= target ? '<span class="chip chip-ok">합격권</span>' : '<span class="chip">미달</span>';
}
function sparkline(){
  var rows = S.exams.slice(-12);
  if(rows.length<2) return "";
  var w=100, hh=34, max=60;
  var pts = rows.map(function(e,i){
    var x = rows.length===1?0:(i/(rows.length-1))*w;
    var y = hh - (e.score/max)*hh;
    return x.toFixed(2)+","+y.toFixed(2);
  });
  var area = "0,"+hh+" "+pts.join(" ")+" "+w+","+hh;
  var lx = pts[pts.length-1].split(",");
  return '<div style="padding:12px 16px 4px"><svg viewBox="0 0 100 34" preserveAspectRatio="none" style="width:100%;height:56px;display:block" aria-label="최근 모의고사 점수 추이">'+
    '<line x1="0" y1="'+(hh-(S.settings.target/max)*hh).toFixed(2)+'" x2="100" y2="'+(hh-(S.settings.target/max)*hh).toFixed(2)+'" stroke="var(--line-strong)" stroke-width=".4" stroke-dasharray="1.6 1.6"/>'+
    '<polygon points="'+area+'" fill="var(--accent-soft)"/>'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="1.1" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+lx[0]+'" cy="'+lx[1]+'" r="1.6" fill="var(--accent)"/></svg>'+
    '<div class="eyebrow" style="display:flex;justify-content:space-between;padding-top:2px"><span>점수 추이 (60점 만점)</span><span>목표선 '+S.settings.target+'점</span></div></div>';
}

function viewChapter(ch){
  var c = CH[ch], s = chStat(ch), bs = blockSize(ch);
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  var h = '<div class="page-head"><div><div class="eyebrow">과목 '+ch+' · 모의고사 '+c.perSet+'문항 / '+c.score+'점</div>'+
    '<h1 class="page-title">'+esc(c.name)+'</h1>'+
    '<p class="page-desc">문제은행 '+c.count+'문항. 학습 모드는 선택 즉시 정답과 해설을 보여주고, 틀린 문항은 자동으로 오답노트와 복습 큐에 등록됩니다.</p></div></div>';

  h += '<div class="tiles">'+
    tile("진도", s.cover+'<small>%</small>', s.seen+" / "+s.total+" 문항")+
    tile("정답률", (s.tries? s.acc:0)+'<small>%</small>', s.ok+" / "+s.tries+" 시도")+
    tile("오답", qs.filter(function(q){return S.wrong[q.id];}).length, "이 과목의 미해결 오답")+
    tile("배점", c.score+'<small>점</small>', c.perSet+"문항 × "+PER_Q+"점")+
  '</div>';

  var saved = savedSession("ch"+ch+":all");
  h += '<div class="card pad" style="margin-bottom:16px">';
  if(saved){
    var sdone = solvedCount(saved), snx = firstUnsolved(saved)+1;
    h += '<div class="resume-bar"><span class="chip chip-accent mono">이어풀기</span>'+
      '<div style="flex:1;min-width:180px"><strong>'+snx+'번 문항부터 계속</strong>'+
      '<div class="note">'+sdone+' / '+saved.ids.length+' 문항 완료</div>'+
      '<span class="progress" style="margin-top:6px"><i style="width:'+pct(sdone,saved.ids.length)+'%"></i></span></div>'+
      '<div class="btn-row"><button class="btn btn-primary" data-act="startch" data-ch="'+ch+'" data-range="all">'+snx+'번부터 이어서 풀기</button>'+
      '<button class="btn" data-act="startch" data-ch="'+ch+'" data-range="all" data-fresh="1">처음부터 다시</button></div></div>';
  }
  h += '<div class="btn-row">'+
    (saved? '' : '<button class="btn btn-primary" data-act="startch" data-ch="'+ch+'" data-range="all">전체 '+c.count+'문항 풀기</button>')+
    '<button class="btn" data-act="startch" data-ch="'+ch+'" data-range="unseen">안 푼 문항만</button>'+
    '<button class="btn" data-act="startch" data-ch="'+ch+'" data-range="wrong">이 과목 오답만</button>'+
    '<button class="btn" data-act="startch" data-ch="'+ch+'" data-range="rand25">무작위 '+bs+'문항</button>'+
    '</div>'+
    '<p class="note" style="margin-top:10px">풀던 도중에 나가도 진도는 자동 저장됩니다. 같은 버튼으로 다시 들어오면 마지막에 푼 다음 문항부터 이어집니다.</p>'+
    '</div>';

  /* 블록 목록 — 블록 크기는 과목마다 다르다 (시험 출제 단위의 정수배) */
  h += '<div class="card"><div class="sec-head"><span class="sec-title">문항 블록</span><span class="eyebrow">'+bs+'문항 단위</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>블록</th><th>범위</th><th style="text-align:right">푼 문항</th><th style="text-align:right">정답률</th><th></th></tr></thead><tbody>';
  for(var i=0;i<qs.length;i+=bs){
    var blk = qs.slice(i, i+bs);
    var seen=0, ok=0, tr=0;
    blk.forEach(function(q){ var t=st(q.id); if(t){ seen++; ok+=t.right; tr+=t.right+t.wrong; } });
    h += '<tr><td class="mono">'+String(Math.floor(i/bs)+1).padStart(2,"0")+'</td>'+
      '<td class="mono" style="font-size:calc(12px * var(--fs));color:var(--muted)">'+blk[0].id+' – '+blk[blk.length-1].id+'</td>'+
      '<td class="num">'+seen+'/'+blk.length+'</td><td class="num">'+(tr?pct(ok,tr)+"%":"–")+'</td>'+
      '<td class="num"><button class="btn btn-sm" data-act="startblock" data-ch="'+ch+'" data-from="'+i+'">풀기</button></td></tr>';
  }

    '<span class="chip">'+q.ch+'. '+esc(CH[q.ch].name)+'</span>'+

    (focus? '<span class="chip chip-bad">집중 관리 · '+s.wrong+'회 오답</span>' : (s.wrong? '<span class="chip chip-bad">'+s.wrong+'회 오답</span>':''))+
