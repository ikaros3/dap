<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAPath</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230B6B63'/%3E%3Cpath d='M10 29H17V20H24V12H29' fill='none' stroke='%23fff' stroke-opacity='.55' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='7' y='26' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='14' y='17' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='9' width='6' height='6' rx='1.5' fill='%23fff'/%3E%3Ccircle cx='30' cy='12' r='4.5' fill='%23F0B33A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Gothic+A1:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F5F5;
  --grid:#E2E9E9;
  --surface:#FFFFFF;
  --surface-2:#F7FAFA;
  --ink:#101A1E;
  --ink-2:#3D4C53;
  --muted:#697C85;
  --line:#D9E1E2;
  --line-strong:#B9C7C9;
  --accent:#0B6B63;
  --accent-soft:#DCEDEA;
  --accent-ink:#07473F;
  --key:#A9700D;
  --key-soft:#F6EBD5;
  --ok:#0E7A5F;
  --ok-soft:#DBEFE7;
  --bad:#B4342B;
  --bad-soft:#F7E2DF;
  --warn:#8A6A12;
  /* 과목 6개를 구분하는 색. 대시보드 오답 비중 차트가 쓴다 */
  --c1:#0B6B63; --c2:#3D6FB4; --c3:#A9700D; --c4:#8A4FA8; --c5:#B4342B; --c6:#3F7A3A;
  --shadow:0 1px 2px rgba(16,26,30,.05), 0 8px 24px -14px rgba(16,26,30,.28);
  --radius:10px;
  --rail:284px;
  --hdr:56px;                   /* 웹 상단 헤더 높이. 모바일에서는 0 */

  /* ---- 타이포그래피 (설정에서 변경) ---- */
  --fs:1;                       /* 전체 글자 크기 배율 */
  --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417;
    --grid:#141F23;
    --surface:#141E22;
    --surface-2:#18242A;
    --ink:#E7EEEF;
    --ink-2:#BFCDD1;
    --muted:#8FA3AA;
    --line:#243238;
    --line-strong:#33454C;
    --accent:#37B8A5;
    --accent-soft:#123632;
    --accent-ink:#8FE0D2;
    --key:#DCA548;
    --key-soft:#33280F;
    --ok:#41C094;
    --ok-soft:#0F3229;
    --bad:#E1685C;
    --bad-soft:#3A1E1B;
    --warn:#D6A93C;
    --c1:#37B8A5; --c2:#6FA8E8; --c3:#DCA548; --c4:#B98AD6; --c5:#E1685C; --c6:#77C46B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --grid:#141F23; --surface:#141E22; --surface-2:#18242A;
  --ink:#E7EEEF; --ink-2:#BFCDD1; --muted:#8FA3AA; --line:#243238; --line-strong:#33454C;
  --accent:#37B8A5; --accent-soft:#123632; --accent-ink:#8FE0D2;
  --key:#DCA548; --key-soft:#33280F;
  --ok:#41C094; --ok-soft:#0F3229; --bad:#E1685C; --bad-soft:#3A1E1B; --warn:#D6A93C;
  --c1:#37B8A5; --c2:#6FA8E8; --c3:#DCA548; --c4:#B98AD6; --c5:#E1685C; --c6:#77C46B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
  font-size:calc(15px * var(--fs)); line-height:1.62; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px; background-position:-1px -1px;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em; line-height:1.28}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono); font-size:calc(10.5px * var(--fs)); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ shell ============ */
/* 웹: 맨 위 헤더(로고 · 카테고리 탭) + 왼쪽 사이드바 + 본문. 모바일(≤900px): 상단바 + 하단 탭바, 사이드바는 ☰ 메뉴로 */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:calc(100vh - var(--hdr))}

/* ---- 상단 헤더 ---- */
.topbar{
  position:sticky; top:0; z-index:50; height:var(--hdr);
  display:flex; align-items:center; gap:28px; padding:0 18px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.topbar .brand{flex:none; width:calc(var(--rail) - 18px - 28px); padding:0}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand-mark{width:30px;height:30px;flex:none;display:block}
.brand-name{font-weight:700; font-size:calc(16px * var(--fs)); letter-spacing:-.02em; line-height:1.15}
.brand-sub{font-size:calc(11px * var(--fs)); color:var(--muted); line-height:1.3; white-space:nowrap}
.top-tools{margin-left:auto; display:flex; gap:4px; flex:none}
.icon-btn{width:34px;height:34px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:calc(15px * var(--fs))}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* ---- 카테고리 (헤더 탭 · 하단 탭바 · 사이드바 머리가 같은 색을 쓴다) ---- */
[data-cat="video"]{--tc:var(--c5)} [data-cat="theory"]{--tc:var(--c2)} [data-cat="dm"]{--tc:var(--c3)} [data-cat="bank"]{--tc:var(--c1)}
.cat-tabs{display:flex; gap:2px; height:100%; min-width:0}
.cat-tab{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;color:var(--muted);font-weight:500;font-size:calc(14px * var(--fs));position:relative;white-space:nowrap}
.ct-ico{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);transition:background .15s,color .15s}
.ct-ico svg{width:15px;height:15px}
.cat-tab:hover{color:var(--ink)}
.cat-tab[aria-current="true"]{color:var(--ink);font-weight:600}
.cat-tab[aria-current="true"] .ct-ico, .mb-btn[aria-current="true"] .ct-ico{background:var(--tc);color:var(--surface)}
.cat-tab[aria-current="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--tc)}
.rail-head{display:flex;align-items:baseline;gap:8px;padding:2px 6px 10px}
.rail-head b{font-size:calc(15px * var(--fs));font-weight:600;letter-spacing:-.02em}
.rail-head small{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.08em;text-transform:uppercase;color:var(--tc);font-weight:500}
.rail-stat{font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);padding:0 6px 10px;margin-top:-6px}
/* 하위 묶음 고르기 (이론: 2020 · 2013 · 슬라이드) */
.cat-seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;margin:0 2px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.cat-seg:empty{display:none}
.seg-btn{padding:6px 4px 5px;border-radius:7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;min-width:0}
.seg-btn b{font-size:calc(13px * var(--fs));font-weight:600;white-space:nowrap}
.seg-btn small{font-size:calc(10px * var(--fs));opacity:.75;white-space:nowrap;letter-spacing:.02em}
.seg-btn:hover{color:var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg-btn[aria-pressed="true"] small{color:var(--tc);opacity:1}
.m-seg, .m-bar{display:none}

/* ---- rail ---- */
.rail{
  position:sticky; top:var(--hdr); align-self:start; height:calc(100vh - var(--hdr)); overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:16px 14px 22px;
  /* 스크롤은 되지만 막대는 보이지 않는다(휠·터치·키보드로 움직인다) */
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail-group{padding:14px 6px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:7px; font-size:calc(13.5px * var(--fs)); color:var(--ink-2);
  border:1px solid transparent; transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 24%,transparent); font-weight:500}
.nav-ico{width:16px;flex:none;text-align:center;font-size:calc(12px * var(--fs));color:var(--muted)}
.nav-item[aria-current="true"] .nav-ico{color:var(--accent)}
.nav-count{margin-left:auto; font-family:var(--font-mono); font-size:calc(11px * var(--fs)); color:var(--muted); font-variant-numeric:tabular-nums}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));padding:1px 6px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:600}

.chap-row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;text-align:left;font-size:calc(13px * var(--fs));color:var(--ink-2)}
.chap-row:hover{background:var(--surface-2)}
.chap-num{font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);width:14px;flex:none}
.chap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-bar{width:38px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.chap-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.rail-foot{margin-top:auto;padding-top:14px;display:none;gap:6px;align-items:center}   /* 모바일 메뉴에서만. 웹은 헤더에 있다 */
.ghost-btn{
  border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:5px 9px; font-size:calc(12px * var(--fs)); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px;
}
.ghost-btn:hover{border-color:var(--line-strong); background:var(--surface-2)}

/* ---- main ---- */
.main{min-width:0; padding:26px 30px 80px; max-width:1180px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.page-title{font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.028em}
.page-desc{color:var(--muted); font-size:calc(13.5px * var(--fs)); margin-top:3px; max-width:62ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:20px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; display:flex; flex-direction:column; gap:2px}
.tile-k{font-family:var(--font-mono); font-size:calc(10px * var(--fs)); letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.tile-v{font-family:var(--font-mono); font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.15}
.tile-s{font-size:calc(11.5px * var(--fs)); color:var(--muted)}
.tile-v small{font-size:calc(13px * var(--fs));font-weight:400;color:var(--muted);letter-spacing:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.sec-title{font-size:calc(14.5px * var(--fs));font-weight:600}

/* 이어풀기 */
.resume-list{display:flex;flex-direction:column}
.resume-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line)}
.resume-row:last-child{border-bottom:none}
.resume-row:hover{background:var(--surface-2)}
.resume-row .progress{min-width:120px;height:6px}
.resume-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 15px;margin-bottom:14px;
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);background:var(--accent-soft);border-radius:10px}
.resume-bar .progress{min-width:120px;height:6px;background:color-mix(in srgb,var(--accent) 22%,transparent)}

/* chapter meter table */
.meter-list{display:flex;flex-direction:column}
.meter-row{display:grid;grid-template-columns:20px minmax(0,1fr) 88px 46px;gap:10px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);font-size:calc(13.5px * var(--fs))}
.meter-row:last-child{border-bottom:none}
.meter-row:hover{background:var(--surface-2)}
.meter-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-fill{height:100%;border-radius:99px;background:var(--accent)}
.meter-fill.low{background:var(--bad)} .meter-fill.mid{background:var(--key)}
.pie-leg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:calc(13.5px * var(--fs))}
.pie-leg:last-child{border-bottom:none}
.pie-leg button{background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
.pie-leg button:hover{color:var(--accent)}
.meter-pct{font-family:var(--font-mono);font-size:calc(12.5px * var(--fs));text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:calc(11.5px * var(--fs));border:1px solid var(--line);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.chip.mono{font-size:calc(11px * var(--fs))}
.chip-accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent-ink)}
.chip-key{background:var(--key-soft);border-color:color-mix(in srgb,var(--key) 30%,transparent);color:var(--key)}
.chip-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.chip-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:calc(13.5px * var(--fs));font-weight:500;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#06231F}}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn-danger:hover{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 52%,transparent)}
.btn-sm{padding:5px 11px;font-size:calc(12.5px * var(--fs))}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* mode launcher cards */
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.launch-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .14s,transform .14s}
.launch-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.launch-t{font-weight:600;font-size:calc(14.5px * var(--fs));display:flex;align-items:center;gap:7px}
.launch-d{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.5}

/* ============ quiz ============ */
.quizbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress{flex:1;min-width:200px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.timer{font-family:var(--font-mono);font-size:calc(14px * var(--fs));font-weight:500;padding:3px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.qhead .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1px solid transparent;color:var(--muted);font-size:calc(14px * var(--fs))}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}
.icon-btn.on{color:var(--key)}
.qbody{padding:20px 22px 6px}
.qtext{font-size:calc(16.5px * var(--fs));line-height:1.66;font-weight:500;white-space:pre-line;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;padding:14px 14px 18px;gap:6px}
.opt{
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start;
  width:100%;text-align:left;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font-size:calc(14.5px * var(--fs));line-height:1.55;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
.opt-n{font-family:var(--font-mono);font-size:calc(12px * var(--fs));font-weight:600;color:var(--muted);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .opt-n{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .opt.sel .opt-n{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.sel .opt-n{color:#06231F}}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt-txt{white-space:pre-line}

/* 지문 서식 (rich) — 원본의 그림·표·「아 래」 상자·SQL. 버튼 안에도 들어가므로 span 으로 그린다 */
.rx-p{display:block;white-space:pre-line}
.rx-p + .rx-p{margin-top:.5em}
.rx-label{display:block;width:max-content;margin:10px auto 4px;padding:1px 14px;border-radius:4px;
  background:var(--ink);color:var(--surface);font-size:.78em;font-weight:600;letter-spacing:.3em}
.rx-box{display:block;margin:6px 0 10px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--surface);font-weight:400;font-size:.94em}
.rx-box > :first-child{margin-top:0}
.rx-box > :last-child{margin-bottom:0}
.rx-pre{display:block;margin:6px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);
  font-family:var(--font-mono);font-size:.8em;line-height:1.5;font-weight:400;white-space:pre;overflow-x:auto;letter-spacing:0}
.rx-tw{display:block;margin:6px 0 10px;overflow-x:auto}
.rx-tbl{border-collapse:collapse;font-size:.86em;font-weight:400;line-height:1.45;min-width:40%}
.rx-tbl th,.rx-tbl td{border:1px solid var(--line-strong);padding:4px 9px;text-align:left;vertical-align:top;white-space:normal}
.rx-tbl th{background:var(--surface-2);font-weight:600}
.rx-fig{display:block;margin:6px 0 10px;overflow-x:auto}
.rx-img{display:block;max-width:100%;height:auto;border-radius:4px;background:#fff;cursor:zoom-in}
.rx-fig.zoom .rx-img{max-width:none;cursor:zoom-out}
.rev-a .rx-tw,.rev-a .rx-pre{margin:4px 0}

.explain{margin:0 14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:13px 15px;display:flex;flex-direction:column;gap:7px}
.explain-h{display:flex;align-items:center;gap:8px}
.explain-b{font-size:calc(13.5px * var(--fs));color:var(--ink-2);line-height:1.65;white-space:pre-line}
/* 원천 자료 — 해설 아래에 옅게. 원문을 찾아볼 수 있도록 문서명과 장·절을 함께 적는다 */
.explain-s{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.55;
  padding-top:7px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:baseline}
.explain-s b{font-weight:600;color:var(--ink-2);white-space:nowrap}
/* 파트(장·절)를 먼저, 그 아래 파일을 한 줄에 하나씩 */
.explain-s .src-part{color:var(--ink-2)}
.explain-s ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
/* 파일명은 띄어쓰기 없는 긴 토막이 섞여 있어 어디서든 접히게 둔다 */
.explain-s li{overflow-wrap:anywhere}
/* 자료 종류(요약본·강의자료…) — 제목이 비슷한 다른 문서를 가려 준다 */
.explain-s i{font-style:normal;font-size:calc(10.5px * var(--fs));color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.qfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.qfoot .spacer{flex:1}
.kbd{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}

/* question navigator */
.navgrid{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.navdot{width:29px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.navdot:hover{border-color:var(--line-strong)}
.navdot.answered{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent-ink)}
.navdot.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 34%,transparent);color:var(--ok)}
.navdot.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 34%,transparent);color:var(--bad)}
.navdot.cur{outline:2px solid var(--accent);outline-offset:1px}
.navdot.flag{border-color:var(--key);border-width:2px}
.navdot.skip{border-style:dashed;color:var(--muted)}
.navdot.mark{position:relative}
.navdot.mark::after{content:"★";position:absolute;top:-4px;right:-2px;font-size:calc(9px * var(--fs));line-height:1;color:var(--key)}

/* result */
.score-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:22px 22px}
.score-big{font-family:var(--font-mono);font-size:calc(52px * var(--fs));font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-size:calc(19px * var(--fs));color:var(--muted);font-weight:400}
.verdict{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;font-weight:600;font-size:calc(13.5px * var(--fs))}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}

table.tbl{width:100%;border-collapse:collapse;font-size:calc(13.5px * var(--fs))}
.tblwrap{overflow-x:auto}
table.tbl th{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.tbl tbody tr:hover{background:var(--surface-2)}

/* review list */
.rev{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:10px}
.rev-h{display:flex;gap:9px;align-items:center;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rev-b{padding:13px 16px;display:flex;flex-direction:column;gap:9px}
.rev-q{font-size:calc(14.5px * var(--fs));font-weight:500;white-space:pre-line}
.rev-a{font-size:calc(13px * var(--fs));color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.rev-a b{font-weight:600}
.tag-ok{color:var(--ok)} .tag-bad{color:var(--bad)}

/* filters / inputs */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text],input[type=number],select{
  font:inherit;font-size:calc(13.5px * var(--fs));padding:7px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);min-width:0;
}
input[type=text]{min-width:220px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:calc(12.5px * var(--fs));color:var(--muted)}

.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:calc(13.5px * var(--fs))}
.empty b{display:block;color:var(--ink);font-size:calc(15px * var(--fs));font-weight:600;margin-bottom:5px}

.note{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.6}
.hr{height:1px;background:var(--line);border:none;margin:18px 0}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:calc(13px * var(--fs));
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-top{display:none}

@media (max-width:900px){
  :root{--hdr:0px}
  .topbar{display:none}
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:none}
  .rail.open{display:flex}
  .rail .cat-seg{display:none}
  .rail-foot{display:flex}
  .mobile-top{display:flex;align-items:center;gap:9px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .mobile-top .brand-mark{width:26px;height:26px}
  .mobile-top #mnav{margin-left:auto}
  .m-seg{display:block;padding:12px 16px 0}
  .m-seg .cat-seg{margin:0}
  .m-bar{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--surface);border-top:1px solid var(--line);padding:5px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .mb-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;color:var(--muted);font-size:11.5px;font-weight:600;position:relative;min-width:0;white-space:nowrap}
  .mb-btn .ct-ico{width:30px;height:28px;border-radius:8px}
  .mb-btn .ct-ico svg{width:17px;height:17px}
  .mb-btn[aria-current="true"]{color:var(--ink)}
  .mb-btn[aria-current="true"]::before{content:"";position:absolute;top:-5px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--tc)}
  .main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .score-big{font-size:calc(42px * var(--fs))}
  .qtext{font-size:calc(15.5px * var(--fs))}
}

/* ============ Data Modeling(실기) ============ */
.dm-prog{margin-bottom:16px}
.dm-id{font-family:var(--font-mono);color:var(--c3);font-size:.8em;font-weight:600}
.dm-stars{color:var(--c3);font-size:.78em;letter-spacing:1px;vertical-align:1px}
.dm-doc + .dm-doc{margin-top:16px}
.dm-p{line-height:1.85}
.dm-ans-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dm-ans-head .n-h3{margin-bottom:4px}
.dm-fig{margin:14px 0 16px;text-align:center}
.dm-fig figcaption{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600;margin-top:6px}
.dm-figbtn{position:relative;display:inline-block;max-width:100%;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;cursor:zoom-in;vertical-align:top}
.dm-figbtn img{display:block;max-width:100%;height:auto}
.dm-figbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dm-zoomhint{position:absolute;right:8px;bottom:8px;padding:3px 9px;border-radius:99px;font-size:calc(11.5px * var(--fs));font-weight:600;
  color:#fff;background:rgba(20,24,28,.72);opacity:.85;transition:opacity .15s;pointer-events:none}
.dm-figbtn:hover .dm-zoomhint{opacity:1}
.dm-tbl td,.dm-tbl th{white-space:normal}
.dm-cover{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin:12px 0 4px;padding:28px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface-2)}
.dm-hint{margin-top:10px;text-align:center}
.vd-player{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#000;border:1px solid var(--line)}
.vd-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vd-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vd-links a.btn{text-decoration:none}
.vd-hint{margin-top:8px}
.vd-player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.vd-rates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.vd-rates-l{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600;margin-right:4px}
.vd-rates button{min-width:52px;font-family:var(--font-mono)}
.vd-rates button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.vd-local{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius);font-size:calc(13px * var(--fs));color:var(--ink-2)}
.vd-no{color:var(--muted);white-space:nowrap;flex:none}
.vd-min{color:var(--muted);font-size:.88em;white-space:nowrap}
.vd-tag{color:var(--c5)}
.vd-docs{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.vd-docs a{font-size:calc(12.5px * var(--fs));color:var(--muted);text-decoration:none}
.vd-docs a:hover{color:var(--accent);text-decoration:underline}
/* 확대 보기 — 화면 가득, 그림은 transform 으로 움직인다 */
body.dmz-open{overflow:hidden}
.dmz{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#111418;color:#fff}
.dmz-bar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;background:rgba(0,0,0,.35);flex-wrap:wrap}
.dmz-title{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmz-pct{font-size:12px;opacity:.7;min-width:44px;text-align:right}
.dmz-btns{display:flex;gap:4px}
.dmz-btns button{min-width:38px;height:34px;padding:0 10px;border-radius:8px;color:#fff;background:rgba(255,255,255,.1);font-size:14px;font-weight:600}
.dmz-btns button:hover{background:rgba(255,255,255,.2)}
.dmz-btns button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.dmz-stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.dmz-stage.drag{cursor:grabbing}
.dmz-img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;background:#fff;border-radius:2px;user-select:none;-webkit-user-select:none;box-shadow:0 6px 30px rgba(0,0,0,.5)}
@media (max-width:600px){
  .dmz-bar{padding:6px 8px}
  .dmz-title{flex-basis:100%;font-size:13px}
  .dmz-pct{text-align:left}
  .dmz-btns button{min-width:34px;padding:0 8px}
}

/* ============ 내용정리 ============ */
/* 레일의 목차 트리: 과목 → 장 → 절 */
.nt-sub{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;text-align:left;font-size:calc(13px * var(--fs));color:var(--ink-2)}
.nt-sub:hover{background:var(--surface-2)}
.nt-sub[aria-expanded="true"]{color:var(--ink);font-weight:600}
.nt-sub:disabled{cursor:default;opacity:.55}
.nt-sub:disabled:hover{background:none}
.nt-caret{width:10px;flex:none;color:var(--muted);font-size:calc(9px * var(--fs));transition:transform .12s}
.nt-sub[aria-expanded="true"] .nt-caret{transform:rotate(90deg)}
.nt-rom{font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);width:22px;flex:none}
.nt-tree{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 14px;padding-left:8px;border-left:1px solid var(--line)}
.nt-ch{padding:7px 8px 3px;font-size:calc(11.5px * var(--fs));color:var(--muted);font-weight:600;line-height:1.35}
.nt-sec{display:flex;align-items:baseline;gap:7px;width:100%;padding:5px 8px;border-radius:6px;text-align:left;font-size:calc(12.5px * var(--fs));color:var(--ink-2);line-height:1.4}
.nt-sec:hover{background:var(--surface-2)}
.nt-sec[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nt-sec .nt-no{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));color:var(--muted);flex:none}
.nt-sec .nt-ok{margin-left:auto;color:var(--ok);font-size:calc(11px * var(--fs));flex:none}
.nt-soon{margin-left:auto;font-size:calc(11px * var(--fs));color:var(--muted);flex:none}

/* 절 화면 */
.note-crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:calc(12.5px * var(--fs));color:var(--muted);margin-bottom:6px}
.note-crumb button{color:var(--muted)} .note-crumb button:hover{color:var(--accent);text-decoration:underline}
.note-layout{display:grid;grid-template-columns:minmax(0,1fr) 228px;gap:22px;align-items:start}
.note-doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 30px 28px;line-height:1.75;min-width:0}
.note-toc{position:sticky;top:calc(var(--hdr) + 20px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - var(--hdr) - 40px);overflow-y:auto}
.note-toc .toc-h{padding:0 7px 6px;font-size:calc(11.5px * var(--fs));color:var(--muted);font-weight:600}
.note-toc button{text-align:left;padding:5px 7px;border-radius:6px;font-size:calc(12.5px * var(--fs));color:var(--ink-2);line-height:1.4}
.note-toc button:hover{background:var(--surface-2);color:var(--accent-ink)}
.note-toc .toc-sub{padding-left:18px;font-size:calc(11.5px * var(--fs));color:var(--muted)}
.note-toc-m{display:none;margin-bottom:12px}
.note-toc-m summary{cursor:pointer;font-size:calc(13px * var(--fs));color:var(--ink-2);padding:9px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.note-toc-m .note-toc{position:static;margin-top:6px;max-height:none}
.note-intro{margin-bottom:6px}
.n-item{scroll-margin-top:18px}
.n-item + .n-item, .note-intro + .n-item{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
.n-h3{font-size:calc(18.5px * var(--fs));font-weight:650;letter-spacing:-.02em;display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.n-no{font-family:var(--font-mono);color:var(--accent);font-size:.86em;flex:none}
.n-h4{font-size:calc(15.5px * var(--fs));font-weight:650;margin:18px 0 6px;scroll-margin-top:18px}
.n-h5{font-size:calc(14.5px * var(--fs));font-weight:600;color:var(--ink-2);margin:14px 0 4px;scroll-margin-top:18px}
.n-p{margin:6px 0;font-size:calc(14.5px * var(--fs))}
.n-ul{margin:4px 0 8px;padding-left:20px;font-size:calc(14.5px * var(--fs))}
.n-ul .n-ul{margin:2px 0 4px;font-size:1em}
.n-ul li{margin:3px 0}
.n-ul > li::marker{color:var(--accent)}
.n-ul .n-ul > li::marker{color:var(--muted)}
/* 원본 강조 색 — 원본은 빨강(#FF0000)·파랑(#0000FF). 다크 모드에서는 같은 계열의 밝은 색 */
.note-doc{--n-red:#D9100B; --n-blue:#1A3FD6}
:root[data-theme="dark"] .note-doc{--n-red:#FF6B5E; --n-blue:#7FA2FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note-doc{--n-red:#FF6B5E; --n-blue:#7FA2FF}}
.note-doc strong{font-weight:700}
.n-red{color:var(--n-red)}
.n-blue{color:var(--n-blue)}
.n-u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
/* 그림·표는 가운데. 제목줄([표 …] [그림 …])도 함께 가운데 둔다 */
.n-cap{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600;margin:16px 0 5px;text-align:center}
.n-tw{overflow-x:auto;margin:4px 0 14px}
.n-tbl{border-collapse:collapse;font-size:calc(13.5px * var(--fs));line-height:1.5;min-width:60%;margin:0 auto}
.n-tbl th,.n-tbl td{border:1px solid var(--line-strong);padding:6px 10px;vertical-align:top;text-align:left}
.n-tbl th{background:var(--surface-2);font-weight:600}
.n-fig{margin:10px 0 14px;text-align:center}
.n-fig .rx-img{display:inline-block;border:1px solid var(--line);height:auto;max-width:min(100%,680px)}
.n-fig.zoom{text-align:left}
.n-tip{margin:8px 0 12px;padding:9px 13px;border-left:3px solid var(--key);background:var(--key-soft);border-radius:0 6px 6px 0;font-size:calc(13.5px * var(--fs))}
.n-2013{display:inline-flex;align-items:center;gap:3px;vertical-align:1px;margin:0 2px;font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));font-weight:600;line-height:1.5;
  padding:0 7px;border-radius:99px;color:var(--c2);background:color-mix(in srgb,var(--c2) 13%,transparent);border:1px solid color-mix(in srgb,var(--c2) 35%,transparent);white-space:nowrap}
.n-2013::before{content:"◆";font-size:.8em}
.n-w{display:inline-flex;align-items:center;gap:3px;vertical-align:1px;margin:0 2px;font-size:calc(10.5px * var(--fs));font-weight:600;line-height:1.5;
  padding:0 7px;border-radius:99px;color:var(--c4);background:color-mix(in srgb,var(--c4) 12%,transparent);border:1px solid color-mix(in srgb,var(--c4) 35%,transparent);white-space:nowrap}
.n-w::before{content:"✎";font-size:.85em}
.n-empty{color:var(--muted);font-size:calc(13px * var(--fs));font-style:italic}
.n-flash{animation:nflash 1.8s ease}
@keyframes nflash{0%,40%{background:var(--key-soft)}100%{background:transparent}}
mark.n-hit{background:var(--key-soft);color:inherit;border-radius:2px;padding:0 1px}
.note-pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.note-pager button{text-align:left;padding:12px 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.note-pager button:hover{border-color:var(--accent)}
.note-pager .nx{text-align:right;grid-column:2}
.note-pager small{font-size:calc(11.5px * var(--fs));color:var(--muted)}
.note-pager span{font-size:calc(13.5px * var(--fs));font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-note{margin-top:4px;color:var(--accent);font-size:calc(12px * var(--fs));font-weight:500;padding:0}
.src-note:hover{text-decoration:underline}
/* 개요 */
/* 카드는 같은 행에서 가장 긴 카드의 높이에 맞춘다(그리드 기본 stretch). 한 줄에 하나씩이면 내용 높이 그대로다.
   분량이 많은 카드(.wide — 실기 특급)는 두 칸을 차지하고 목록을 2단으로 나눈다. 칸이 하나뿐일 만큼 좁으면
   넓히지 않는다 — 창 폭이 아니라 그리드 자신의 폭으로 판단한다(사이드바가 있어 둘이 다르다) */
.nh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;container-type:inline-size}
.nh-card.wide{grid-column:span 2}
.nh-cols{column-count:2;column-gap:24px}
.nh-cols .nh-secs{display:block}
.nh-cols .nh-secs button{width:100%;break-inside:avoid}
.nh-cols .nh-ch{break-after:avoid}
.nh-cols > :first-child{margin-top:0}
@container (max-width:613px){ .nh-card.wide{grid-column:auto} }
@container (max-width:479px){ .nh-cols{column-count:1} }
.nh-card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.nh-card.off{opacity:.62}
.nh-head{display:flex;align-items:center;gap:10px}
.nh-rom{font-family:var(--font-mono);font-weight:600;color:var(--accent);width:34px;flex:none}
.nh-title{font-weight:600;font-size:calc(15px * var(--fs));flex:1}
.nh-ch{font-size:calc(12px * var(--fs));color:var(--muted);font-weight:600;margin-top:4px}
.nh-secs{display:flex;flex-direction:column}
.nh-secs button{text-align:left;font-size:calc(13px * var(--fs));color:var(--ink-2);padding:3px 0;display:flex;gap:6px}
.nh-secs button:hover{color:var(--accent)}
.nh-secs .nt-ok{color:var(--ok);margin-left:auto}
.ns-hit{padding:12px 18px;border-bottom:1px solid var(--line);text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
.ns-hit:hover{background:var(--surface-2)}
.ns-hit:last-child{border-bottom:none}
.ns-path{font-size:calc(11.5px * var(--fs));color:var(--muted)}
.ns-snip{font-size:calc(13.5px * var(--fs));color:var(--ink-2)}
/* 형광펜 — 바탕은 반투명이라 원본의 빨강·파랑 글자색이 그대로 보인다. 가리기에는 같은 계열의 진한 색 */
:root{--hl-y:rgba(255,212,0,.42);--hl-g:rgba(52,199,110,.30);--hl-r:rgba(255,92,128,.30);
  --hl-y-solid:#F2C400;--hl-g-solid:#3FB873;--hl-r-solid:#F0668A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl-y:rgba(255,212,0,.28);--hl-g:rgba(60,210,120,.26);--hl-r:rgba(255,100,135,.28);
  --hl-y-solid:#A88A10;--hl-g-solid:#2C8A55;--hl-r-solid:#B04A68}}
:root[data-theme="dark"]{--hl-y:rgba(255,212,0,.28);--hl-g:rgba(60,210,120,.26);--hl-r:rgba(255,100,135,.28);
  --hl-y-solid:#A88A10;--hl-g-solid:#2C8A55;--hl-r-solid:#B04A68}
mark.hl{color:inherit;border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-y{background:var(--hl-y)} .hl-g{background:var(--hl-g)} .hl-r{background:var(--hl-r)}
.hl-hide mark.hl:not(.show){color:transparent}
.hl-hide mark.hl-y:not(.show){background:var(--hl-y-solid)}
.hl-hide mark.hl-g:not(.show){background:var(--hl-g-solid)}
.hl-hide mark.hl-r:not(.show){background:var(--hl-r-solid)}
mark.hl.n-flash{animation:hlflash 1.8s ease}
@keyframes hlflash{0%,45%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.hl-memo{color:var(--accent);font-size:.72em;margin:0 1px;cursor:pointer}
.hl-only .hl-off{display:none}
.hl-sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none;vertical-align:-1px}
.hl-sw.hl-y{background:var(--hl-y-solid)} .hl-sw.hl-g{background:var(--hl-g-solid)} .hl-sw.hl-r{background:var(--hl-r-solid)}
.hl-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-6px 0 12px}
.hl-tip{flex:1;min-width:200px;font-size:calc(12.5px * var(--fs));color:var(--muted)}
.hl-tip b{color:var(--ink-2);font-weight:600}
.hl-bar,.hl-pop{position:absolute;z-index:150;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
/* hidden 으로 감춘다. 아래 display:flex 가 hidden 의 기본 display:none 을 덮으므로 따로 못 박는다 */
.hl-bar[hidden],.hl-pop[hidden]{display:none}
.hl-bar{display:flex;gap:2px;padding:4px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hl-bar button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;font-size:calc(13px * var(--fs));color:var(--ink-2);white-space:nowrap}
.hl-bar button:hover{background:var(--surface-2)}
.hl-pop{width:min(320px,calc(100vw - 16px));padding:10px;display:flex;flex-direction:column;gap:8px}
.hl-pop-c{display:flex;gap:4px}
.hl-pick{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border:1px solid var(--line);border-radius:7px;font-size:calc(12.5px * var(--fs));color:var(--ink-2)}
.hl-pick.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.hl-pop textarea{width:100%;resize:vertical;font:inherit;font-size:calc(13px * var(--fs));padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.hl-pop-a{display:flex;gap:6px;align-items:center}
.hl-lost{margin-bottom:12px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius);display:flex;flex-direction:column;gap:6px;font-size:calc(13px * var(--fs))}
.hl-lost-row{display:flex;align-items:center;gap:8px}
.hl-lost-row > span{flex:1;min-width:0}
.nt-hl{margin-left:auto;flex:none;font-family:var(--font-mono);font-size:calc(10px * var(--fs));line-height:1.6;padding:0 6px;border-radius:99px;color:var(--ink-2);background:var(--hl-y)}
.nt-hl + .nt-ok{margin-left:4px !important}
.hl-filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.hl-filter .chip{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.hl-group{padding:4px 0;margin-bottom:12px}
.hl-gh{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 18px;font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.hl-row{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--line)}
.hl-row:last-child{border-bottom:none}
.hl-row-b{flex:1;min-width:0;font-size:calc(14px * var(--fs));line-height:1.7}
.hl-row-a{display:flex;flex-direction:column;gap:4px;flex:none}
mark.hl-card{padding:1px 3px}
.hl-m{margin-top:3px;font-size:calc(12.5px * var(--fs));color:var(--muted)}
@media (max-width:600px){ .hl-row{flex-direction:column;gap:6px} .hl-row-a{flex-direction:row} .hl-tip{flex-basis:100%} }
@media (max-width:1100px){
  .note-layout{grid-template-columns:minmax(0,1fr)}
  .note-layout > .note-toc{display:none}
  .note-toc-m{display:block}
}
@media (max-width:900px){
  .note-doc{padding:18px 16px 22px}
  .note-pager{grid-template-columns:1fr}
  .note-pager .nx{grid-column:1}
}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ============ 로딩 화면 ============ */
#boot{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:var(--bg); font-family:var(--font-ui);
}
#boot.gone{opacity:0; pointer-events:none; transition:opacity .28s ease}
.boot-box{width:min(420px,86vw); text-align:center}
.boot-mark{width:46px;height:46px;margin:0 auto 16px;display:block}
.boot-title{font-size:calc(16px * var(--fs)); font-weight:600; letter-spacing:-.02em; color:var(--ink)}
.boot-msg{margin-top:6px; font-size:calc(12.5px * var(--fs)); color:var(--muted); font-family:var(--font-mono); min-height:1.4em}
.boot-track{margin-top:16px; height:4px; border-radius:99px; background:var(--line); overflow:hidden}

  border-radius:var(--radius); padding:12px 14px; white-space:pre-wrap; word-break:break-word;
}

/* ============ 폰트 설정 ============ */
.font-opts{display:flex; flex-direction:column; gap:8px}
.font-opt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:10px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2); transition:border-color .12s, background .12s;
}
.font-opt:hover{border-color:var(--line-strong)}
.font-opt[aria-pressed="true"]{
  border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);
}
.font-opt-n{font-size:calc(13.5px * var(--fs)); font-weight:600; flex:none; width:112px}
.font-opt-s{font-size:calc(13.5px * var(--fs)); color:var(--muted); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.font-opt[aria-pressed="true"] .font-opt-s{color:var(--accent-ink)}
.fs-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fs-step{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:calc(16px * var(--fs));
  display:grid; place-items:center; flex:none;
}
.fs-step:hover{border-color:var(--line-strong)}
.fs-step:disabled{opacity:.4; cursor:default}
.fs-val{font-family:var(--font-mono); font-size:calc(13px * var(--fs)); min-width:52px; text-align:center;
  font-variant-numeric:tabular-nums; color:var(--ink)}
.fs-bar{flex:1; min-width:150px; accent-color:var(--accent)}
.font-sample{
  margin-top:12px; padding:12px 14px; border-radius:9px; border:1px dashed var(--line-strong);
  background:var(--surface-2); font-size:calc(14px * var(--fs)); line-height:1.7; color:var(--ink-2);
}
</style>

<body>

<!-- DAPath 로고 — 계단처럼 이어진 네 칸(이론 → 강의 → 실기 → 문제)과 마지막 합격 체크 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="dapathMark" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="10" fill="var(--accent)"/>
    <path d="M10 29H17V20H24V12H29" fill="none" stroke="var(--surface)" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
    <rect x="7" y="26" width="6" height="6" rx="1.5" fill="var(--surface)"/>
    <rect x="14" y="17" width="6" height="6" rx="1.5" fill="var(--surface)"/>
    <rect x="21" y="9" width="6" height="6" rx="1.5" fill="var(--surface)"/>
    <circle cx="30" cy="12" r="4.5" fill="#F0B33A"/>
    <path d="M28 12l1.5 1.5 3-3" fill="none" stroke="#0B3B36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div id="boot" role="status" aria-live="polite">

</div>

  <div class="brand">

    <div>
      <div class="brand-name">DAPath</div>
      <div class="brand-sub">데이터아키텍처 전문가 학습</div>
    </div>
  </div>
  <nav class="cat-tabs" id="catTabs" aria-label="카테고리"></nav>
  <div class="top-tools">
    <button class="icon-btn js-theme" title="테마 전환">◐</button>
    <button class="icon-btn" data-go="settings" title="설정">⚙</button>
  </div>
</header>

  <svg class="brand-mark" role="img" aria-label="DAPath"><use href="#dapathMark"/></svg>

      <button class="ghost-btn js-theme" title="테마 전환">◐ 테마</button>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ 문제은행 로더 ═══════════
   data/manifest.js 를 읽고, 거기에 나열된 팩 파일을 순서대로 불러와
   window.DAP = { exam, chapters, questions, sets } 를 만든 뒤 앱을 시작한다.
   팩 파일은 DAP_BANK.add({chapter, pack, questions}) 를 호출한다.
   ─ 모든 파일은 UTF-8(BOM 없음)로 저장해야 한글이 깨지지 않는다. */
(function(){
"use strict";
var BASE = "data/";
var packs = [];

var blobs = [];
window.DAP_BANK = {
  _col: "core",                 /* 로더가 파일마다 바꿔 준다 */
  add: function(pack){
    if(!pack || !pack.questions || !pack.questions.length) return;
    pack.collection = pack.collection || window.DAP_BANK._col;
    packs.push(pack);
  },
  /* 암호화된 팩. 내용은 잠긴 채로 두고, 앱에서 암호를 받아 풀 때 문항이 된다.
     { collection, salt, iv, data } — data 는 AES-GCM 암호문(base64) */
  addEncrypted: function(blob){
    if(!blob || !blob.data) return;
    blob.collection = blob.collection || window.DAP_BANK._col;
    blobs.push(blob);
  }
};

/* ---- 로딩 화면 ---- */
var bootEl = document.getElementById("boot"),
    msgEl  = document.getElementById("bootMsg"),
    barEl  = document.getElementById("bootBar"),
    errEl  = document.getElementById("bootErr");
function progress(done, total, label){
  if(barEl) barEl.style.width = (total ? Math.round(done/total*100) : 5) + "%";
  if(msgEl && label) msgEl.textContent = label;
}
function fail(title, detail){
  if(msgEl) msgEl.textContent = "문제은행을 불러오지 못했습니다";
  if(barEl) barEl.style.background = "var(--bad)";
  if(errEl){ errEl.style.display = "block"; errEl.textContent = title + "\n\n" + detail; }
}

/* 저장해 둔 폰트 설정을 먼저 적용해서 로딩 화면부터 같은 글꼴로 보이게 한다 */
(function earlyFont(){
  try{
    var raw = localStorage.getItem("dap750:v1");
    if(!raw) return;
    var st = JSON.parse(raw).settings || {};
    if(st.theme && st.theme !== "auto") document.documentElement.setAttribute("data-theme", st.theme);
    if(st.fontStack) document.documentElement.style.setProperty("--font-ui", st.fontStack);
    if(st.fontScale) document.documentElement.style.setProperty("--fs", String(st.fontScale));
  }catch(e){}
})();

/* ---- 스크립트 순차 로딩 ---- */
function loadScript(src, ok, no){
  var el = document.createElement("script");
  el.src = src;
  el.charset = "UTF-8";          /* 한글 깨짐 방지 */
  el.async = false;
  el.onload = function(){ ok(); };
  el.onerror = function(){ no(src); };
  document.head.appendChild(el);
}
function loadSeq(list, onEach, done, no){
  var i = 0;
  (function step(){
    if(i >= list.length) return done();
    var it = list[i];
    window.DAP_BANK._col = it.col;
    loadScript(it.src,
      function(){ i++; onEach(i, list.length, it.src); step(); },
      function(src){
        /* optional 팩은 없어도 넘어간다 — 로컬 전용 묶음이 배포본에서 빠져도
           앱 전체가 멈추지 않도록 하기 위한 것이다. */
        if(it.optional){ i++; onEach(i, list.length, it.src); step(); return; }
        no(src);
      });
  })();
}

var HINT =
  "확인할 것\n" +
  "  1. dap.html 과 같은 폴더에 data 폴더가 있는지\n" +
  "  2. data/manifest.js 의 files 목록에 적힌 파일이 실제로 있는지\n" +
  "  3. 파일 이름의 대소문자가 정확한지\n" +
  "  4. 브라우저 콘솔(F12)에 구문 오류가 찍혀 있는지";

progress(0, 1, "매니페스트를 읽는 중…");
loadScript(BASE + "manifest.js", startPacks, function(){
  fail("data/manifest.js 를 찾을 수 없습니다.", HINT);
});

function startPacks(){
  var M = window.DAP_MANIFEST;
  if(!M || !M.chapters || !M.files){
    fail("data/manifest.js 의 형식이 올바르지 않습니다.",
         "window.DAP_MANIFEST = { exam, chapters, files } 형태여야 합니다.");
    return;
  }
  var files = M.files.map(function(f){
    if(typeof f === "string") return { src: BASE + f, col:"core", optional:false };
    return { src: BASE + (f.file || f.path || ""), col: f.collection || "core", optional: !!f.optional };
  });
  progress(0, files.length + 1, "문제은행 " + files.length + "개 파일을 읽는 중…");
  loadSeq(files,
    function(done, total, src){
      progress(done, total + 1, String(src).replace(BASE, "") + " (" + done + "/" + total + ")");
    },
    function(){ assemble(M); },
    function(src){
      fail(src + " 를 불러오지 못했습니다.", HINT);
    });
}

/* ---- 조립 ----
   묶음(collection)마다 독립된 문제은행을 만든다. 묶음이 다르면 문항도, 모의고사
   세트도 섞이지 않는다. manifest 에 collections 가 없으면 전체를 묶음 하나로 본다. */
function buildBank(M, def, myPacks){
  var chapters = M.chapters.map(function(c){
    return { id:c.id, name:c.name, perSet:c.perSet, score:c.score,
             blockSize: c.blockSize > 0 ? c.blockSize : c.perSet * 2,
             count:0, packs:[] };
  });
  var chMap = {};
  chapters.forEach(function(c){ chMap[c.id] = c; });

  var seen = {}, questions = [], dupes = 0, orphans = 0;
  var fixedSets = [];          /* 팩이 직접 지정한 세트 */
  myPacks.forEach(function(pk){
    if(pk.sets && pk.sets.length){
      pk.sets.forEach(function(st){
        if(st && st.ids && st.ids.length) fixedSets.push({ title:st.title || "", ids:st.ids.slice() });
      });
    }
    var ch = chMap[pk.chapter];
    if(!ch){ orphans += pk.questions.length; return; }
    /* 팩에 딸린 그림. 지문·해설의 [[img:키]] 가 여기서 찾는다. 키는 전체에서 유일해야 한다. */
    if(pk.images){
      var IMG = window.DAP_IMG || (window.DAP_IMG = {});
      Object.keys(pk.images).forEach(function(k){ IMG[k] = pk.images[k]; });
    }
    var added = 0;
    pk.questions.forEach(function(q){
      /* a 는 보기 번호(0부터) 하나, 또는 번호 배열. 배열은 m 이 있으면 "모두 고르시오"
         (고른 것이 정답 집합과 같아야 정답), 없으면 그중 하나만 골라도 정답이다. */
      if(!q || !q.id || !q.q || !q.c || q.c.length < 2) return;
      if(!(typeof q.a === "number" ||
           (Array.isArray(q.a) && q.a.length && q.a.every(function(x){ return typeof x === "number"; })))) return;
      if(seen[q.id]){ dupes++; return; }
      seen[q.id] = true;
      questions.push({
        id:q.id, ch:ch.id, no:(q.no || 0),
        q:q.q, c:q.c, a:q.a, m:(q.m ? 1 : 0), e:(q.e || ""), s:(q.s || (ch.id + "장")),
        /* 원천 자료. 문항에 r 이 있으면 그것을, 없으면 팩의 source 를 쓴다.
           해설과 함께 보여 주어 원문을 찾아볼 수 있게 한다. */
        r:(q.r || pk.source || ""),
        /* 출제할 때 실제로 펼쳐 본 data_source/ 의 파일. 문항에 rf 가 있으면
           그것을, 없으면 팩의 sourceFiles 를 쓴다. 배열이면 한 줄로 잇는다.
           앱 스크립트의 함수는 이 로더에서 부를 수 없으므로 여기서 직접 만든다. */
        f:(function(v){
            if(!v) return "";
            return Array.isArray(v)
              ? v.filter(function(x){ return x; }).join(" · ")
              : String(v);
          })(q.rf || pk.sourceFiles)
      });
      added++;
    });
    ch.packs.push({ pack:(pk.pack || "?"), count:added });
  });

  /* 과목별 정렬(no 순) · 표시 번호 재부여 · 문항 수 집계 */
  var byCh = {};
  questions.forEach(function(q){ (byCh[q.ch] = byCh[q.ch] || []).push(q); });
  var ordered = [];
  chapters.forEach(function(c){
    var pool = byCh[c.id] || [];
    pool.sort(function(a,b){ return (a.no||0) - (b.no||0); });
    pool.forEach(function(q, i){ q.no = i + 1; });
    c.count = pool.length;
    ordered = ordered.concat(pool);
  });

  /* 팩이 세트를 직접 지정했으면 그대로 쓴다. 원본 모의고사처럼 과목 비율이
     시험과 다른 자료를 원래 구성 그대로 보존하기 위한 것이다. */
  if(fixedSets.length){
    var have = {};
    questions.forEach(function(q){ have[q.id] = true; });
    var kept = fixedSets.map(function(st){
      return { title:st.title, ids:st.ids.filter(function(id){ return have[id]; }) };
    }).filter(function(st){ return st.ids.length; });
    if(kept.length){
      return {
        id: def.id, name: def.name || def.id, note: def.note || "",
        exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
        chapters: chapters, questions: ordered,
        sets: kept.map(function(st){ return st.ids; }),
        setTitles: kept.map(function(st){ return st.title; }),
        loaded: { packs:myPacks.length, dupes:dupes, orphans:orphans }
      };
    }
  }

  /* 모의고사 세트 = 과목별 문항을 perSet 단위로 순서대로 잘라 묶는다. */
  var setCount = Infinity;
  chapters.forEach(function(c){
    setCount = Math.min(setCount, c.perSet > 0 ? Math.floor(c.count / c.perSet) : 0);
  });
  if(!isFinite(setCount) || setCount < 0) setCount = 0;
  var sets = [];
  for(var sN = 0; sN < setCount; sN++){
    var ids = [];
    chapters.forEach(function(c){
      var pool = byCh[c.id] || [];
      pool.slice(sN * c.perSet, (sN + 1) * c.perSet).forEach(function(q){ ids.push(q.id); });
    });
    sets.push(ids);
  }

  if(dupes)   console.warn("[DAP] " + def.id + ": 중복 id 문항 " + dupes + "개를 건너뛰었습니다.");
  if(orphans) console.warn("[DAP] " + def.id + ": manifest.chapters 에 없는 과목의 문항 " + orphans + "개를 건너뛰었습니다.");

  return {
    id: def.id, name: def.name || def.id, note: def.note || "",
    exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
    chapters: chapters, questions: ordered, sets: sets,
    loaded: { packs:myPacks.length, dupes:dupes, orphans:orphans }
  };
}

function assemble(M){
  progress(1, 1, "문항을 정리하는 중…");

  var defs = (M.collections && M.collections.length)
    ? M.collections
    : [{ id:"core", name:"문제은행" }];

  var banks = [];
  defs.forEach(function(def){
    var mine  = packs.filter(function(p){ return (p.collection || "core") === def.id; });
    var mineE = blobs.filter(function(p){ return (p.collection || "core") === def.id; });
    if(mine.length){
      var b = buildBank(M, def, mine);
      if(b.questions.length){ banks.push(b); return; }
    }
    if(mineE.length){
      /* 잠긴 묶음 — 앱에서 암호를 넣으면 그때 문항이 채워진다 */
      banks.push({
        id: def.id, name: def.name || def.id, note: def.note || "",
        exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
        chapters: [], questions: [], sets: [],
        locked: true, blobs: mineE,
        loaded: { packs:0, dupes:0, orphans:0 }
      });
    }
  });

  if(!banks.filter(function(b){ return b.questions.length || b.locked; }).length){
    fail("문항이 하나도 없습니다.",
         "data/manifest.js 의 files 에 팩 파일이 나열되어 있는지, 팩 파일이 " +
         "DAP_BANK.add({chapter, pack, questions}) 를 호출하는지 확인하세요.");
    return;
  }

  window.DAP_BANKS = banks;
  window.DAP_BUILD = buildBank;      /* 잠긴 묶음을 나중에 조립할 때 쓴다 */
  window.DAP_MF    = M;
  window.DAP = banks[0];         /* 앱이 시작하면서 저장된 선택으로 바꾼다 */

  boot();
}

/* 앱 스크립트는 문서 뒤쪽에 있으므로, 아직 파싱되지 않았으면 기다렸다가 시작한다 */
function boot(){
  if(typeof window.DAP_APP_BOOT !== "function"){
    if(document.readyState !== "complete"){
      window.addEventListener("load", boot, { once:true });
      return;
    }
    fail("앱 스크립트가 로드되지 않았습니다.", "dap.html 이 손상되었을 수 있습니다.");
    return;
  }
  try{
    window.DAP_APP_BOOT();
  }catch(e){
    fail("앱을 시작하지 못했습니다.", String((e && e.stack) || e));
    return;
  }
  if(bootEl){
    bootEl.classList.add("gone");
    setTimeout(function(){ if(bootEl.parentNode) bootEl.parentNode.removeChild(bootEl); }, 320);
  }
}
})();
</script>
<script>
window.DAP_APP_BOOT = function(){
"use strict";
/* ─────────── 상수 ─────────── */
/* 문제은행 묶음 — 묶음을 바꾸면 문항·모의고사 세트·진행 중 세션이 통째로 바뀐다.
   풀이 기록(S.stats)은 문항 id 로 관리하므로 묶음이 달라도 그대로 유지된다. */
var BANKS = window.DAP_BANKS || [window.DAP];
var DAP, CH, CHLIST, QMAP, EXAM, PER_Q, TOTAL_SCORE, TOTAL_Q;

function bankById(id){
  for(var i=0;i<BANKS.length;i++) if(BANKS[i].id===id) return BANKS[i];
  return null;
}
function useBank(id){
  var b = bankById(id) || BANKS[0];
  DAP = window.DAP = b;
  CHLIST = DAP.chapters;
  CH = {}; CHLIST.forEach(function(c){ CH[c.id]=c; });
  QMAP = {}; DAP.questions.forEach(function(q){ QMAP[q.id]=q; });
  EXAM = DAP.exam;
  PER_Q = EXAM.perQuestion; TOTAL_SCORE = EXAM.totalScore; TOTAL_Q = EXAM.totalQuestions;
  examPage = 0;                  /* 묶음이 바뀌면 응시 이력도 첫 쪽부터 */
  return b.id;
}
useBank(BANKS[0].id);

/* 세션 키는 묶음별로 분리한다. 같은 "ch1:b0" 라도 묶음이 다르면 다른 세션이다. */
function skey(k){ return DAP.id + "/" + k; }
/* ─────────── 폰트 목록 ───────────
   웹앱에서 시인성이 좋은 한글 본문용 글꼴만 추렸다. 첫 항목이 기본값이다. */
var FONTS = [
  { id:"pretendard", name:"Pretendard", note:"기본 · 균형 잡힌 현대적 고딕",
    stack:'"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"plex", name:"IBM Plex Sans KR", note:"또렷한 획 · 문서형 화면에 적합",
    stack:'"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"noto", name:"Noto Sans KR", note:"표준적이고 무난한 본문 고딕",
    stack:'"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"gothica1", name:"Gothic A1", note:"넉넉한 자간 · 긴 지문 읽기 편함",
    stack:'"Gothic A1",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"system", name:"시스템 기본", note:"네트워크 없이도 즉시 표시",
    stack:'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Segoe UI",sans-serif' }
];
var FONT_MAP = {}; FONTS.forEach(function(f){ FONT_MAP[f.id] = f; });
var FS_MIN = 0.8, FS_MAX = 1.6, FS_STEP = 0.05;

var BOX_DAYS = [0, 1, 2, 4, 8, 16, 35];
var KEY = "dap750:v1";

/* ─────────── 저장소 ─────────── */
var S = load();
function blank(){
  return { stats:{}, bookmarks:{}, wrong:{}, exams:[], sessions:{}, epoch:0, rev:0, by:"",
           notesRead:{},     /* 내용정리에서 읽음 표시한 절 { "3-2-2": 시각 } — 2013 판은 "13:1-2-3" */
           hl:{},            /* 내용정리 형광펜 { id: { k:절 키, c, q, pre, suf, o, m, t, u, del } } — 자세한 것은 「형광펜」 */
           /* target = 필기 60점 만점 중 목표 점수. 합격은 필기+실기(40점) 합산 75점이므로
              실기에서 23점을 얻는다고 보면 필기 52점이 목표가 된다. */
           settings:{ timerMin:90, target:52, theme:"auto", bank:"",
                      fontId:FONTS[0].id, fontStack:FONTS[0].stack, fontScale:1,
                      hlHide:false, hlOnly:false,      /* 형광펜 가리기 · 형광만 보기 */
                      dmHide:false,                     /* 실기 — 모범 답안 먼저 가리기 */
                      vdLast:"",                        /* 동영상 강의 — 마지막으로 연 강의 id ([이어 보기]) */
                      vdRate:1 } };                     /* 동영상 강의 — 재생 속도(로컬 재생) */
}
function normalize(o){
  var b = blank();
  for(var k in b) if(!(k in o) || o[k]===null) o[k]=b[k];
  for(var k2 in b.settings) if(!(k2 in o.settings)) o.settings[k2]=b.settings[k2];
  /* 목표 점수 기본값을 45 → 52 로 올렸다. 옛 기본값을 그대로 쓰고 있던 기기만
     한 번 옮긴다. 직접 정한 값은 건드리지 않는다. */
  if(!o.settings.tgt2){ if(o.settings.target === 45) o.settings.target = 52; o.settings.tgt2 = 1; }
  /* v1 → v2 이관: 단일 session 슬롯을 키별 sessions 맵으로 */
  if(o.session && o.session.ids && !Object.keys(o.sessions).length){
    var key = o.session.key || "legacy";
    o.session.key = key; o.session.ts = o.session.ts || Date.now();
    o.sessions[key] = o.session;
  }
  delete o.session;
  /* 폰트 설정 보정 — 목록에 없는 id 는 기본값으로 되돌린다 */
  var f = FONT_MAP[o.settings.fontId] || FONTS[0];
  o.settings.fontId = f.id;
  o.settings.fontStack = f.stack;
  var sc = parseFloat(o.settings.fontScale);
  if(!isFinite(sc)) sc = 1;
  o.settings.fontScale = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, sc)) * 100) / 100;
  /* 지운 형광펜 표시(del)는 반년이 지나면 버린다. 그만큼 동기화하지 않은 기기는 없다고 본다 */
  Object.keys(o.hl).forEach(function(id){
    var h = o.hl[id];
    if(!h || !h.k || (h.del && Date.now() - (h.u||0) > 180*864e5)) delete o.hl[id];
  });
  return o;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    return normalize(JSON.parse(raw));
  }catch(e){ return blank(); }
}
/* 묶음 기능 이전에 저장된 세션은 키에 묶음 접두사가 없어 지금 코드로는 찾지 못한다.
   기본 묶음 것으로 보고 이름만 옮긴다. 풀이 기록(S.stats)은 문항 id 기준이라
   영향이 없고, 여기서 되살아나는 것은 "몇 번까지 풀었는가" 하는 위치뿐이다. */
(function migrateSessionKeys(){
  var pre = BANKS[0].id + "/", moved = 0;
  Object.keys(S.sessions).forEach(function(k){
    if(k.indexOf("/") >= 0) return;
    var old = S.sessions[k];
    delete S.sessions[k];
    if(!old || !old.ids || !old.ids.length) return;
    var nkey = pre + k, cur = S.sessions[nkey];
    if(!cur || (old.ts||0) > (cur.ts||0)){ old.key = nkey; S.sessions[nkey] = old; }
    moved++;
  });
  if(moved) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
})();
/* 블록 크기를 바꾸면 예전 경계로 만들어진 블록 세션(ch1:b25 처럼)은 지금 화면의
   어느 블록과도 맞지 않는다. 이어풀기 목록에 유령으로 남으므로 지운다.
   풀이 기록(S.stats)은 문항 id 기준이라 그대로 남고, 사라지는 것은 "그 블록의
   몇 번째까지 풀었는가" 하는 위치뿐이다. */
(function migrateBlockSessions(){
  var dropped = 0;
  Object.keys(S.sessions).forEach(function(k){
    var raw = k.indexOf("/") >= 0 ? k.slice(k.indexOf("/")+1) : k;
    var m = /^ch(\d+):b(\d+)$/.exec(raw);
    if(!m) return;
    var c = CH[+m[1]];
    var bs = c ? (c.blockSize > 0 ? c.blockSize : c.perSet * 2) : 20;
    if(+m[2] % bs === 0) return;
    delete S.sessions[k]; dropped++;
  });
  if(dropped) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
})();

/* 응시 이력은 묶음마다 따로 봐야 한다. 세트 번호도 문항도 묶음이 다르면 남의
   것이고, 리포트를 열어도 지금 묶음의 QMAP 에 없는 문항이라 아무것도 못 그린다.
   문항 id 는 은행 전체에서 유일하므로 어느 묶음의 문항인지로 가려낼 수 있다. */
var BANK_OF_Q = null;
function bankOfQuestion(id){
  if(!BANK_OF_Q){
    BANK_OF_Q = {};
    BANKS.forEach(function(b){
      (b.questions||[]).forEach(function(q){ if(!(q.id in BANK_OF_Q)) BANK_OF_Q[q.id] = b.id; });
    });
  }
  return BANK_OF_Q[id];
}
/* 묶음 기능 이전 기록에는 bank 가 없다. 문항 id 로 되짚어 한 번만 적어 둔다.
   잠긴 묶음의 것은 아직 가려낼 수 없으므로 건드리지 않고, 묶음을 열 때 다시 부른다. */
function stampExamBanks(){
  var n = 0;
  S.exams.forEach(function(e){
    if(e.bank) return;
    /* examIds 는 세트 구성을 "지금 묶음"에서 찾으므로 여기서는 쓸 수 없다.
       응답 키는 그 응시가 실제로 낸 문항이라 묶음과 무관하게 믿을 수 있다. */
    var ids = (e.ids && e.ids.length) ? e.ids : Object.keys(e.answers||{});
    for(var i=0;i<ids.length;i++){
      var b = bankOfQuestion(ids[i]);
      if(b){ e.bank = b; n++; return; }
    }
  });
  if(n) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  return n;
}
stampExamBanks();

var saveT=null;
function save(){
  if(session && session.key){ session.ts = Date.now(); S.sessions[session.key] = session; }
  if(saveT) clearTimeout(saveT);
  markDirty();
  saveT = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    syncSchedule();
  }, 140);
}

/* ─────────── 유틸 ─────────── */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* ─────────── 정답 판정 ───────────
   q.a 는 보기 번호 하나이거나 번호 배열이다. 고른 답(pick)도 번호 하나이거나 배열이다.
   q.m 이 있으면 "모두 고르시오" — 여러 개를 골라 채점하고, 고른 것이 정답 집합과
   같아야 맞다. q.m 없이 a 가 배열이면 복수 정답 인정 — 그중 하나만 골라도 맞다. */
function ansList(q){ return Array.isArray(q.a) ? q.a : [q.a]; }
function pickList(p){ return (p === undefined || p === null) ? [] : (Array.isArray(p) ? p : [p]); }
function isAns(q, i){ return ansList(q).indexOf(i) >= 0; }
function hasPick(p, i){ return pickList(p).indexOf(i) >= 0; }
function isRight(q, p){
  var ps = pickList(p), a = ansList(q);
  if(!ps.length) return false;
  if(q.m) return ps.length === a.length && a.every(function(x){ return ps.indexOf(x) >= 0; });
  return ps.length === 1 && a.indexOf(ps[0]) >= 0;
}
function numText(list){ return pickList(list).map(function(i){ return (i+1) + "번"; }).join(", "); }

/* ─────────── 지문 서식 ───────────
   원본에 표·그림이 있는 문항(실전문제 2013 등)은 지문에 간단한 표기를 쓴다.
     [[img:키]]      그림 한 장 (window.DAP_IMG 에 팩이 등록한 것)
     ::: … :::       테두리 상자 (원본의 「아 래」 상자)
     ``` … ```       고정폭 (SQL · 실행계획)
     | a | b |       표 한 행. 첫 행이 ‖ 로 시작하면 머리행. 셀 안 줄바꿈은 ¶
   표기가 없는 문항은 esc() 와 똑같이 나온다. */
var RICH_RE = /\[\[img:|^:::|^```|^[|‖] |^아 ?래$/m;
function rich(s){
  s = String(s == null ? "" : s);
  if(!RICH_RE.test(s)) return esc(s);
  var lines = s.split("\n"), i = 0;
  function table(rows){
    var cells = rows.map(function(r){
      return r.replace(/\s+$/, "").slice(2, -2).split(" | ");   /* "| " + 셀.join(" | ") + " |" */
    });
    var w = Math.max.apply(null, cells.map(function(c){ return c.length; }));
    return '<span class="rx-tw"><table class="rx-tbl">'+ cells.map(function(c, ri){
      var th = ri === 0 && rows[0].charAt(0) === "‖";
      return '<tr>'+ c.map(function(x, ci){
        var span = (ci === c.length-1 && c.length < w) ? ' colspan="'+(w - c.length + 1)+'"' : '';
        var tag = th ? "th" : "td";
        return '<'+tag+span+'>'+ esc(x).replace(/¶/g, "<br>") +'</'+tag+'>';
      }).join("") +'</tr>';
    }).join("") +'</table></span>';
  }
  function block(stop){
    var out = "", text = [];
    function flush(){
      if(text.length){ out += '<span class="rx-p">'+ esc(text.join("\n")) +'</span>'; text = []; }
    }
    while(i < lines.length){
      var L = lines[i];
      if(stop && L === stop){ i++; break; }
      var m = /^\[\[img:([\w\-]+)\]\]$/.exec(L.trim());
      if(m){
        flush(); i++;
        var src = (window.DAP_IMG || {})[m[1]];
        out += src ? '<span class="rx-fig"><img class="rx-img" src="'+src+'" alt="그림" data-act="imgzoom"></span>'
                   : '<span class="rx-p note">[그림을 찾을 수 없습니다 · '+esc(m[1])+']</span>';
      }else if(L === ":::"){
        flush(); i++;
        out += '<span class="rx-box">'+ block(":::") +'</span>';
      }else if(L === "```"){
        flush(); i++;
        var code = [];
        while(i < lines.length && lines[i] !== "```") code.push(lines[i++]);
        i++;
        out += '<span class="rx-pre">'+ esc(code.join("\n")) +'</span>';
      }else if(/^[|‖] /.test(L)){
        flush();
        var rows = [];
        while(i < lines.length && /^[|‖] /.test(lines[i])) rows.push(lines[i++]);
        out += table(rows);
      }else if(/^아 ?래$/.test(L.trim())){
        flush(); i++;
        out += '<span class="rx-label">아 래</span>';
      }else if(!L.trim()){
        flush(); i++;
      }else{
        text.push(L); i++;
      }
    }
    flush();
    return out;
  }
  return block(null);
}
/* 목록 한 줄에 쓸 때 — 표기를 걷어내고 첫 줄만 */
function plain(s){
  return String(s == null ? "" : s).split("\n").filter(function(L){
    return L.trim() && !/^(\[\[img:|:::|```|[|‖] |아 ?래$)/.test(L.trim());
  })[0] || "";
}
/* 해설 밑에 붙는 원천 한 줄. 틀린 문항을 다시 볼 때 필요한 것은 두 가지뿐이다 —
   data_source/ 의 어느 파일이고, 그 안의 어느 파트인가. 그래서 한 줄로 합쳐 둔다.
   파일마다 어떤 자료인지 함께 적는다. 「V. 데이터베이스 설계와 이용.hwpx」와
   「5과목. 데이터베이스 설계와 이용.pdf」처럼 제목만으로는 같은 문서로 보이지만
   각각 요약본과 강의자료인 경우가 있다.
   문서명(q.r)은 파일명과 같은 것을 말로 옮긴 것이라 화면에는 쓰지 않는다. */
function srcLine(q){
  var files = String(q.f || "").split(" · ").filter(function(x){ return x; });
  if(!q.s && !files.length) return "";
  var body = q.s ? '<div class="src-part">'+esc(q.s)+'</div>' : "";
  var nl = noteLinkOf(q);
  if(nl) body += '<button class="src-note" data-go="note" data-ed="2020" data-ch="'+nl.ch+'" data-c="'+nl.c+'" data-s="'+nl.s+'" data-topic="'+esc(nl.topic)+'">'+
                   '📖 2020 Edition 에서 보기 →</button>';
  if(files.length){
    body += '<ul>'+files.map(function(name){
      var kind = srcKind(name);
      return '<li>'+esc(name)+(kind? ' <i>'+esc(kind)+'</i>' : '')+'</li>';
    }).join("")+'</ul>';
  }
  return '<div class="explain-s"><b>원천</b><div>'+body+'</div></div>';
}
/* 파일 이름만 보고 어떤 자료인지 가려낸다. data_source/README.md 의 A~D 묶음이다. */
function srcKind(name){
  if(/^\[데이터 전문가 포럼\]/.test(name)) return "교재";
  if(/^[IVX]+\. /.test(name))              return "요약본";
  if(/^\d과목\./.test(name))               return "강의자료";
  if(/실전문제/.test(name))                return "실전문제";
  if(/\.docx?$/.test(name))                return "워드 요약";
  return "";
}
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)
    +" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function shuffle(a, seed){
  var arr = a.slice(), s = seed || Date.now();
  function rnd(){ s = (s*1664525 + 1013904223) % 4294967296; return s/4294967296; }
  for(var i=arr.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* 학습용 [문항 블록] 하나의 문항 수. manifest 의 blockSize 를 쓰고, 없으면
   시험 출제 단위(perSet)의 2배로 본다. 시험 단위의 정수배여야 블록을 그대로
   모의고사 감각으로 풀 수 있다. */
function blockSize(ch){
  var c = CH[ch];
  if(c && c.blockSize > 0) return c.blockSize;
  if(c && c.perSet > 0) return c.perSet * 2;
  return 20;
}

/* ─────────── 통계 파생 ─────────── */
function st(id){ return S.stats[id] || null; }
function chStat(ch){
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  var seen=0, right=0, tries=0, ok=0;
  qs.forEach(function(q){
    var s = st(q.id); if(!s) return;
    seen++; tries += s.right+s.wrong; ok += s.right;
    if(s.right>0 && s.wrong===0) right++;
  });
  return { total:qs.length, seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,qs.length) };
}
function overall(){
  var seen=0,tries=0,ok=0;
  DAP.questions.forEach(function(q){ var s=st(q.id); if(!s) return; seen++; tries+=s.right+s.wrong; ok+=s.right; });
  return { seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,DAP.questions.length) };
}
function wrongIds(){ return Object.keys(S.wrong).filter(function(id){ return QMAP[id]; }); }
function bookmarkIds(){ return Object.keys(S.bookmarks).filter(function(id){ return S.bookmarks[id] && QMAP[id]; }); }
function dueIds(){
  var now = Date.now();
  return Object.keys(S.stats).filter(function(id){
    var s = S.stats[id];
    return QMAP[id] && s.due && s.due <= now && s.box < 6;
  }).sort(function(a,b){ return S.stats[a].due - S.stats[b].due; });
}
function weakSections(limit){
  var m = {};
  DAP.questions.forEach(function(q){
    var s = st(q.id); if(!s || s.wrong===0) return;
    var key = q.ch + "|" + q.s;
    if(!m[key]) m[key] = { ch:q.ch, sec:q.s, wrong:0, tries:0 };
    m[key].wrong += s.wrong; m[key].tries += s.wrong + s.right;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.wrong - a.wrong; }).slice(0, limit||8);
}

/* ─────────── 채점 기록 ─────────── */
/* pick = 마지막에 고른 보기 번호. 문항 id 로 관리되므로 묶음·기기와 무관하게 남고
   Gist 로 동기화된다. 정오답은 pick 과 q.a 를 비교하면 나오므로 따로 두지 않는다. */
function record(qid, correct, pick){
  var s = S.stats[qid] || (S.stats[qid] = { right:0, wrong:0, box:0, due:0, last:0 });
  s.last = Date.now();
  if(pick !== undefined && pick !== null) s.pick = pick;
  if(correct){
    s.right++;
    s.box = Math.min(6, (s.box||0) + 1);
    delete S.wrong[qid];
  }else{
    s.wrong++;
    s.box = 0;
    S.wrong[qid] = true;
  }
  s.due = Date.now() + BOX_DAYS[Math.min(s.box, BOX_DAYS.length-1)] * 864e5;
  save();
}

/* ─────────── 응시 기록 되돌리기 ─────────── */
/* 잘못된 응시를 지울 때 그 응시가 문항 통계에 남긴 자국까지 걷어낸다.
   right/wrong 카운트는 정확히 1씩 빼면 되지만, 복습 상자(box)·다음 복습일(due)·
   마지막 선택(pick)은 덮어쓰기라 이전 값이 남아 있지 않다. 그래서 이 응시가
   그 문항을 마지막으로 건드린 경우에만 손대고(그 뒤에 다시 푼 기록이 있으면
   그쪽이 주인이므로 그대로 둔다), 남은 이력으로 다시 세운다. */
function rollbackExam(e){
  var ids = examIds(e).filter(function(id){ return QMAP[id]; });
  var out = { touched:0, cleared:0, unwrong:0 };
  ids.forEach(function(id){
    var t = S.stats[id]; if(!t) return;
    var wasCorrect = isRight(QMAP[id], e.answers[id]);   /* 미응답은 오답으로 기록됐다 */
    if(wasCorrect) t.right = Math.max(0, (t.right||0) - 1);
    else           t.wrong = Math.max(0, (t.wrong||0) - 1);
    out.touched++;

    /* 이 응시가 유일한 이력이었다면 문항을 안 푼 상태로 되돌린다 */
    if(!t.right && !t.wrong){
      delete S.stats[id];
      if(S.wrong[id]){ delete S.wrong[id]; out.unwrong++; }
      out.cleared++;
      return;
    }
    /* 다른 데서도 틀린 적이 있는 문항은 오답노트에 그대로 둔다 */
    if(!t.wrong && S.wrong[id]){ delete S.wrong[id]; out.unwrong++; }

    /* 채점 시각과 기록 시각이 같으면 이 응시가 마지막으로 건드린 문항이다 */
    if(Math.abs((t.last||0) - e.ts) < 60000){
      delete t.pick;
      t.box = t.wrong ? 0 : Math.min(6, t.right);
      t.due = Date.now() + BOX_DAYS[Math.min(t.box, BOX_DAYS.length-1)] * 864e5;
      /* last 는 화면에 쓰이지 않고 동기화 병합의 순서 기준이다.
         이 되돌리기가 가장 최근 판단이므로 지금 시각으로 올려 둔다. */
      t.last = Date.now();
    }
  });
  return out;
}

/* ─────────── 라우팅 ─────────── */
var view = { name:"dash" }, session = null, timerH = null;
/* 화면(모드)은 여섯이다 — 내용정리 두 판(n2020 · n2013), 요약 슬라이드(slide), 동영상 강의(video), Data Modeling 실기(dm),
   문제은행(bank). 모드는 카테고리 넷(CATS)으로 묶여 웹은 상단 탭, 모바일은 하단 탭바로 고른다. 이론처럼 모드가 여럿인
   카테고리는 사이드바 위 세그먼트로 고른다. 설정은 모두가 함께 쓰므로 들어가도 지금 모드를 유지한다.
   모드를 오가면 그 모드에서 마지막으로 보던 화면으로, 카테고리를 오가면 그 카테고리에서 마지막으로 쓴 모드로 돌아간다.
   내용정리 화면은 view.ed 로 판을 안다. 판을 주지 않으면 지금 보던 판을 잇고, 문제은행에서 오면 2020 이다. */
var curMode = "bank", lastView = { bank:{ name:"dash" }, n2020:{ name:"notes", ed:"2020" }, n2013:{ name:"notes", ed:"2013" },
                                   slide:{ name:"slides" }, dm:{ name:"dm" }, video:{ name:"video" } };
var CATS = [
  { id:"theory", name:"기본 이론",   short:"이론",     en:"Theory",    modes:["n2020", "n2013", "slide"] },
  { id:"video",  name:"동영상 강의", short:"강의",     en:"Lectures",  modes:["video"] },
  { id:"dm",     name:"모델링 실기", short:"실기",     en:"Modeling",  modes:["dm"] },
  { id:"bank",   name:"문제은행",    short:"문제은행", en:"Questions", modes:["bank"] }
];
var catLast = {};   /* 카테고리 → 마지막으로 쓴 모드 */
function catOf(mode){ return CATS.filter(function(c){ return c.modes.indexOf(mode) >= 0; })[0] || CATS[3]; }
function isSoonView(name){ return name === "slides"; }
/* 화면이 속한 모드. 설정은 모드가 없다(null) */
function modeOf(v){
  if(isNoteView(v.name)) return "n" + (v.ed || "2020");
  if(isDmView(v.name)) return "dm";
  if(isVdView(v.name)) return "video";
  if(v.name === "slides") return "slide";
  return v.name === "settings" ? null : "bank";
}

function go(name, opt, fromHistory){
  if(view && !/^(quiz|result|settings)$/.test(view.name)) lastView[curMode] = view;
  var ed = isNoteView(name) ? ((opt && opt.ed) || (curMode === "n2013" ? "2013" : "2020")) : "";
  view = Object.assign({ name:name }, opt||{});
  if(ed) view.ed = ed;
  curMode = modeOf(view) || curMode;
  catLast[catOf(curMode).id] = curMode;
  if(name!=="quiz" && timerH){ clearInterval(timerH); timerH=null; }
  /* 퀴즈를 벗어나면 진도를 저장하고 세션 핸들만 놓는다 (기록은 남아 이어풀기 가능) */
  if(name!=="quiz" && session){ session.idx = firstUnsolved(session); save(); session = null; }
  if(!fromHistory) syncHash();
  render();
  if(window.innerWidth<=900) $("#rail").classList.remove("open");
  window.scrollTo(0,0);
  if(view.h) setTimeout(function(){ scrollToNote(view.h); }, 30);
}
