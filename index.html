<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAP 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Gothic+A1:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F5F5;
  --grid:#E2E9E9;
  --surface:#FFFFFF;
  --surface-2:#F7FAFA;
  --ink:#101A1E;
  --ink-2:#3D4C53;
  --muted:#697C85;
  --line:#D9E1E2;
  --line-strong:#B9C7C9;
  --accent:#0B6B63;
  --accent-soft:#DCEDEA;
  --accent-ink:#07473F;
  --key:#A9700D;
  --key-soft:#F6EBD5;
  --ok:#0E7A5F;
  --ok-soft:#DBEFE7;
  --bad:#B4342B;
  --bad-soft:#F7E2DF;
  --warn:#8A6A12;
  --shadow:0 1px 2px rgba(16,26,30,.05), 0 8px 24px -14px rgba(16,26,30,.28);
  --radius:10px;
  --rail:264px;

  /* ---- 타이포그래피 (설정에서 변경) ---- */
  --fs:1;                       /* 전체 글자 크기 배율 */
  --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417;
    --grid:#141F23;
    --surface:#141E22;
    --surface-2:#18242A;
    --ink:#E7EEEF;
    --ink-2:#BFCDD1;
    --muted:#8FA3AA;
    --line:#243238;
    --line-strong:#33454C;
    --accent:#37B8A5;
    --accent-soft:#123632;
    --accent-ink:#8FE0D2;
    --key:#DCA548;
    --key-soft:#33280F;
    --ok:#41C094;
    --ok-soft:#0F3229;
    --bad:#E1685C;
    --bad-soft:#3A1E1B;
    --warn:#D6A93C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --grid:#141F23; --surface:#141E22; --surface-2:#18242A;
  --ink:#E7EEEF; --ink-2:#BFCDD1; --muted:#8FA3AA; --line:#243238; --line-strong:#33454C;
  --accent:#37B8A5; --accent-soft:#123632; --accent-ink:#8FE0D2;
  --key:#DCA548; --key-soft:#33280F;
  --ok:#41C094; --ok-soft:#0F3229; --bad:#E1685C; --bad-soft:#3A1E1B; --warn:#D6A93C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
  font-size:calc(15px * var(--fs)); line-height:1.62; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px; background-position:-1px -1px;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em; line-height:1.28}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono); font-size:calc(10.5px * var(--fs)); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ shell ============ */
.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}

/* ---- rail ---- */
.rail{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 14px 22px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 6px 16px}
.brand-mark{
  width:30px;height:30px;border-radius:7px;flex:none;
  background:var(--accent); color:#fff; display:grid; place-items:center;
  font-family:var(--font-mono); font-weight:600; font-size:calc(13px * var(--fs)); letter-spacing:-.03em;
}
:root[data-theme="dark"] .brand-mark, :root:not([data-theme="light"]) .brand-mark{color:#07231F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .brand-mark{color:#fff}}
.brand-name{font-weight:600; font-size:calc(15px * var(--fs)); letter-spacing:-.02em}
.brand-sub{font-size:calc(11px * var(--fs)); color:var(--muted); line-height:1.3}
.rail-group{padding:14px 6px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:7px; font-size:calc(13.5px * var(--fs)); color:var(--ink-2);
  border:1px solid transparent; transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 24%,transparent); font-weight:500}
.nav-ico{width:16px;flex:none;text-align:center;font-size:calc(12px * var(--fs));color:var(--muted)}
.nav-item[aria-current="true"] .nav-ico{color:var(--accent)}
.nav-count{margin-left:auto; font-family:var(--font-mono); font-size:calc(11px * var(--fs)); color:var(--muted); font-variant-numeric:tabular-nums}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));padding:1px 6px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:600}

.chap-row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;text-align:left;font-size:calc(13px * var(--fs));color:var(--ink-2)}
.chap-row:hover{background:var(--surface-2)}
.chap-num{font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);width:14px;flex:none}
.chap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-bar{width:38px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.chap-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.rail-foot{margin-top:auto;padding-top:14px;display:flex;gap:6px;align-items:center}
.ghost-btn{
  border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:5px 9px; font-size:calc(12px * var(--fs)); color:var(--ink-2); display:inline-flex; align-items:center; gap:6px;
}
.ghost-btn:hover{border-color:var(--line-strong); background:var(--surface-2)}

/* ---- main ---- */
.main{min-width:0; padding:26px 30px 80px; max-width:1180px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.page-title{font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.028em}
.page-desc{color:var(--muted); font-size:calc(13.5px * var(--fs)); margin-top:3px; max-width:62ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:20px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; display:flex; flex-direction:column; gap:2px}
.tile-k{font-family:var(--font-mono); font-size:calc(10px * var(--fs)); letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.tile-v{font-family:var(--font-mono); font-size:calc(25px * var(--fs)); font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.15}
.tile-s{font-size:calc(11.5px * var(--fs)); color:var(--muted)}
.tile-v small{font-size:calc(13px * var(--fs));font-weight:400;color:var(--muted);letter-spacing:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.sec-title{font-size:calc(14.5px * var(--fs));font-weight:600}

/* 이어풀기 */
.resume-list{display:flex;flex-direction:column}
.resume-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line)}
.resume-row:last-child{border-bottom:none}
.resume-row:hover{background:var(--surface-2)}
.resume-row .progress{min-width:120px;height:6px}
.resume-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 15px;margin-bottom:14px;
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);background:var(--accent-soft);border-radius:10px}
.resume-bar .progress{min-width:120px;height:6px;background:color-mix(in srgb,var(--accent) 22%,transparent)}

/* chapter meter table */
.meter-list{display:flex;flex-direction:column}
.meter-row{display:grid;grid-template-columns:20px minmax(0,1fr) 88px 46px;gap:10px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);font-size:calc(13.5px * var(--fs))}
.meter-row:last-child{border-bottom:none}
.meter-row:hover{background:var(--surface-2)}
.meter-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-fill{height:100%;border-radius:99px;background:var(--accent)}
.meter-fill.low{background:var(--bad)} .meter-fill.mid{background:var(--key)}
.meter-pct{font-family:var(--font-mono);font-size:calc(12.5px * var(--fs));text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:calc(11.5px * var(--fs));border:1px solid var(--line);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.chip.mono{font-size:calc(11px * var(--fs))}
.chip-accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent-ink)}
.chip-key{background:var(--key-soft);border-color:color-mix(in srgb,var(--key) 30%,transparent);color:var(--key)}
.chip-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.chip-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:calc(13.5px * var(--fs));font-weight:500;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#06231F}}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn-sm{padding:5px 11px;font-size:calc(12.5px * var(--fs))}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* mode launcher cards */
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.launch-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .14s,transform .14s}
.launch-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.launch-t{font-weight:600;font-size:calc(14.5px * var(--fs));display:flex;align-items:center;gap:7px}
.launch-d{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.5}

/* ============ quiz ============ */
.quizbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.progress{flex:1;min-width:200px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.timer{font-family:var(--font-mono);font-size:calc(14px * var(--fs));font-weight:500;padding:3px 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.qhead .spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1px solid transparent;color:var(--muted);font-size:calc(14px * var(--fs))}
.icon-btn:hover{background:var(--surface);border-color:var(--line)}
.icon-btn.on{color:var(--key)}
.qbody{padding:20px 22px 6px}
.qtext{font-size:calc(16.5px * var(--fs));line-height:1.66;font-weight:500;white-space:pre-line;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;padding:14px 14px 18px;gap:6px}
.opt{
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start;
  width:100%;text-align:left;padding:11px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font-size:calc(14.5px * var(--fs));line-height:1.55;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
.opt-n{font-family:var(--font-mono);font-size:calc(12px * var(--fs));font-weight:600;color:var(--muted);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .opt-n{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .opt.sel .opt-n{color:#06231F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.sel .opt-n{color:#06231F}}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .opt-n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt-txt{white-space:pre-line}

.explain{margin:0 14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:13px 15px;display:flex;flex-direction:column;gap:7px}
.explain-h{display:flex;align-items:center;gap:8px}
.explain-b{font-size:calc(13.5px * var(--fs));color:var(--ink-2);line-height:1.65}
.qfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.qfoot .spacer{flex:1}
.kbd{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}

/* question navigator */
.navgrid{display:flex;flex-wrap:wrap;gap:4px;padding:14px 16px}
.navdot{width:29px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:calc(11px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.navdot:hover{border-color:var(--line-strong)}
.navdot.answered{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent-ink)}
.navdot.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 34%,transparent);color:var(--ok)}
.navdot.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 34%,transparent);color:var(--bad)}
.navdot.cur{outline:2px solid var(--accent);outline-offset:1px}
.navdot.flag{border-color:var(--key);border-width:2px}

/* result */
.score-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:22px 22px}
.score-big{font-family:var(--font-mono);font-size:calc(52px * var(--fs));font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-size:calc(19px * var(--fs));color:var(--muted);font-weight:400}
.verdict{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;font-weight:600;font-size:calc(13.5px * var(--fs))}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}

table.tbl{width:100%;border-collapse:collapse;font-size:calc(13.5px * var(--fs))}
.tblwrap{overflow-x:auto}
table.tbl th{font-family:var(--font-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.tbl tbody tr:hover{background:var(--surface-2)}

/* review list */
.rev{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:10px}
.rev-h{display:flex;gap:9px;align-items:center;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rev-b{padding:13px 16px;display:flex;flex-direction:column;gap:9px}
.rev-q{font-size:calc(14.5px * var(--fs));font-weight:500;white-space:pre-line}
.rev-a{font-size:calc(13px * var(--fs));color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.rev-a b{font-weight:600}
.tag-ok{color:var(--ok)} .tag-bad{color:var(--bad)}

/* filters / inputs */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text],input[type=number],select{
  font:inherit;font-size:calc(13.5px * var(--fs));padding:7px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);min-width:0;
}
input[type=text]{min-width:220px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:calc(12.5px * var(--fs));color:var(--muted)}

.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:calc(13.5px * var(--fs))}
.empty b{display:block;color:var(--ink);font-size:calc(15px * var(--fs));font-weight:600;margin-bottom:5px}

.note{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.6}
.hr{height:1px;background:var(--line);border:none;margin:18px 0}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:calc(13px * var(--fs));
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-top{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:none}
  .rail.open{display:flex}
  .mobile-top{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .main{padding:18px 16px 70px}

<body>

<div id="boot" role="status" aria-live="polite">

    <div class="boot-title">DAP 문제은행</div>

    <div class="boot-track"><i id="bootBar"></i></div>

  </div>
</div>

  <button class="ghost-btn" id="mnav">☰ 메뉴</button>
  <strong style="font-size:calc(14px * var(--fs))" id="brandTop">DAP 문제은행</strong>

  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark">DA</div>
      <div>
        <div class="brand-name" id="brandName">DAP 문제은행</div>

      </div>
    </div>

    <nav class="nav" id="navMain"></nav>

    <div class="nav" id="navChap"></div>

    <div class="rail-foot">
      <button class="ghost-btn" id="themeBtn" title="테마 전환">◐ 테마</button>
      <button class="ghost-btn" id="resetHint" title="설정">⚙ 설정</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ 문제은행 로더 ═══════════
   data/manifest.js 를 읽고, 거기에 나열된 팩 파일을 순서대로 불러와
   window.DAP = { exam, chapters, questions, sets } 를 만든 뒤 앱을 시작한다.
   팩 파일은 DAP_BANK.add({chapter, pack, questions}) 를 호출한다.
   ─ 모든 파일은 UTF-8(BOM 없음)로 저장해야 한글이 깨지지 않는다. */
(function(){
"use strict";
var BASE = "data/";
var packs = [];

window.DAP_BANK = {
  _col: "core",                 /* 로더가 파일마다 바꿔 준다 */
  add: function(pack){
    if(!pack || !pack.questions || !pack.questions.length) return;
    pack.collection = pack.collection || window.DAP_BANK._col;
    packs.push(pack);
  }
};

/* ---- 로딩 화면 ---- */
var bootEl = document.getElementById("boot"),
    msgEl  = document.getElementById("bootMsg"),
    barEl  = document.getElementById("bootBar"),
    errEl  = document.getElementById("bootErr");
function progress(done, total, label){
  if(barEl) barEl.style.width = (total ? Math.round(done/total*100) : 5) + "%";
  if(msgEl && label) msgEl.textContent = label;
}
function fail(title, detail){
  if(msgEl) msgEl.textContent = "문제은행을 불러오지 못했습니다";
  if(barEl) barEl.style.background = "var(--bad)";
  if(errEl){ errEl.style.display = "block"; errEl.textContent = title + "\n\n" + detail; }
}

/* 저장해 둔 폰트 설정을 먼저 적용해서 로딩 화면부터 같은 글꼴로 보이게 한다 */
(function earlyFont(){
  try{
    var raw = localStorage.getItem("dap750:v1");
    if(!raw) return;
    var st = JSON.parse(raw).settings || {};
    if(st.theme && st.theme !== "auto") document.documentElement.setAttribute("data-theme", st.theme);
    if(st.fontStack) document.documentElement.style.setProperty("--font-ui", st.fontStack);
    if(st.fontScale) document.documentElement.style.setProperty("--fs", String(st.fontScale));
  }catch(e){}
})();

/* ---- 스크립트 순차 로딩 ---- */
function loadScript(src, ok, no){
  var el = document.createElement("script");
  el.src = src;
  el.charset = "UTF-8";          /* 한글 깨짐 방지 */
  el.async = false;
  el.onload = function(){ ok(); };
  el.onerror = function(){ no(src); };
  document.head.appendChild(el);
}
function loadSeq(list, onEach, done, no){
  var i = 0;
  (function step(){
    if(i >= list.length) return done();
    var it = list[i];
    window.DAP_BANK._col = it.col;
    loadScript(it.src,
      function(){ i++; onEach(i, list.length, it.src); step(); },
      function(src){
        /* optional 팩은 없어도 넘어간다 — 로컬 전용 묶음이 배포본에서 빠져도
           앱 전체가 멈추지 않도록 하기 위한 것이다. */
        if(it.optional){ i++; onEach(i, list.length, it.src); step(); return; }
        no(src);
      });
  })();
}

var HINT =
  "확인할 것\n" +
  "  1. dap.html 과 같은 폴더에 data 폴더가 있는지\n" +
  "  2. data/manifest.js 의 files 목록에 적힌 파일이 실제로 있는지\n" +
  "  3. 파일 이름의 대소문자가 정확한지\n" +
  "  4. 브라우저 콘솔(F12)에 구문 오류가 찍혀 있는지";

progress(0, 1, "매니페스트를 읽는 중…");
loadScript(BASE + "manifest.js", startPacks, function(){
  fail("data/manifest.js 를 찾을 수 없습니다.", HINT);
});

function startPacks(){
  var M = window.DAP_MANIFEST;
  if(!M || !M.chapters || !M.files){
    fail("data/manifest.js 의 형식이 올바르지 않습니다.",
         "window.DAP_MANIFEST = { exam, chapters, files } 형태여야 합니다.");
    return;
  }
  var files = M.files.map(function(f){
    if(typeof f === "string") return { src: BASE + f, col:"core", optional:false };
    return { src: BASE + (f.file || f.path || ""), col: f.collection || "core", optional: !!f.optional };
  });
  progress(0, files.length + 1, "문제은행 " + files.length + "개 파일을 읽는 중…");
  loadSeq(files,
    function(done, total, src){
      progress(done, total + 1, String(src).replace(BASE, "") + " (" + done + "/" + total + ")");
    },
    function(){ assemble(M); },
    function(src){
      fail(src + " 를 불러오지 못했습니다.", HINT);
    });
}

/* ---- 조립 ----
   묶음(collection)마다 독립된 문제은행을 만든다. 묶음이 다르면 문항도, 모의고사
   세트도 섞이지 않는다. manifest 에 collections 가 없으면 전체를 묶음 하나로 본다. */
function buildBank(M, def, myPacks){
  var chapters = M.chapters.map(function(c){
    return { id:c.id, name:c.name, perSet:c.perSet, score:c.score, count:0, packs:[] };
  });
  var chMap = {};
  chapters.forEach(function(c){ chMap[c.id] = c; });

  var seen = {}, questions = [], dupes = 0, orphans = 0;
  myPacks.forEach(function(pk){
    var ch = chMap[pk.chapter];
    if(!ch){ orphans += pk.questions.length; return; }
    var added = 0;
    pk.questions.forEach(function(q){
      if(!q || !q.id || !q.q || !q.c || q.c.length < 2 || typeof q.a !== "number") return;
      if(seen[q.id]){ dupes++; return; }
      seen[q.id] = true;
      questions.push({
        id:q.id, ch:ch.id, no:(q.no || 0),
        q:q.q, c:q.c, a:q.a, e:(q.e || ""), s:(q.s || (ch.id + "장"))
      });
      added++;
    });
    ch.packs.push({ pack:(pk.pack || "?"), count:added });
  });

  /* 과목별 정렬(no 순) · 표시 번호 재부여 · 문항 수 집계 */
  var byCh = {};
  questions.forEach(function(q){ (byCh[q.ch] = byCh[q.ch] || []).push(q); });
  var ordered = [];
  chapters.forEach(function(c){
    var pool = byCh[c.id] || [];
    pool.sort(function(a,b){ return (a.no||0) - (b.no||0); });
    pool.forEach(function(q, i){ q.no = i + 1; });
    c.count = pool.length;
    ordered = ordered.concat(pool);
  });

  /* 모의고사 세트 = 과목별 문항을 perSet 단위로 순서대로 잘라 묶는다. */
  var setCount = Infinity;
  chapters.forEach(function(c){
    setCount = Math.min(setCount, c.perSet > 0 ? Math.floor(c.count / c.perSet) : 0);
  });
  if(!isFinite(setCount) || setCount < 0) setCount = 0;
  var sets = [];
  for(var sN = 0; sN < setCount; sN++){
    var ids = [];
    chapters.forEach(function(c){
      var pool = byCh[c.id] || [];
      pool.slice(sN * c.perSet, (sN + 1) * c.perSet).forEach(function(q){ ids.push(q.id); });
    });
    sets.push(ids);
  }

  if(dupes)   console.warn("[DAP] " + def.id + ": 중복 id 문항 " + dupes + "개를 건너뛰었습니다.");
  if(orphans) console.warn("[DAP] " + def.id + ": manifest.chapters 에 없는 과목의 문항 " + orphans + "개를 건너뛰었습니다.");

  return {
    id: def.id, name: def.name || def.id, note: def.note || "",
    exam: M.exam || { perQuestion:0.8, totalQuestions:75, totalScore:60 },
    chapters: chapters, questions: ordered, sets: sets,
    loaded: { packs:myPacks.length, dupes:dupes, orphans:orphans }
  };
}

function assemble(M){
  progress(1, 1, "문항을 정리하는 중…");

  var defs = (M.collections && M.collections.length)
    ? M.collections
    : [{ id:"core", name:"문제은행" }];

  var banks = [];
  defs.forEach(function(def){
    var mine = packs.filter(function(p){ return (p.collection || "core") === def.id; });
    if(!mine.length) return;                       /* 팩이 없는 묶음은 감춘다 */
    var b = buildBank(M, def, mine);
    if(b.questions.length) banks.push(b);
  });

  if(!banks.length){
    fail("문항이 하나도 없습니다.",
         "data/manifest.js 의 files 에 팩 파일이 나열되어 있는지, 팩 파일이 " +
         "DAP_BANK.add({chapter, pack, questions}) 를 호출하는지 확인하세요.");
    return;
  }

  window.DAP_BANKS = banks;
  window.DAP = banks[0];         /* 앱이 시작하면서 저장된 선택으로 바꾼다 */

  boot();
}

/* 앱 스크립트는 문서 뒤쪽에 있으므로, 아직 파싱되지 않았으면 기다렸다가 시작한다 */
function boot(){
  if(typeof window.DAP_APP_BOOT !== "function"){
    if(document.readyState !== "complete"){
      window.addEventListener("load", boot, { once:true });
      return;
    }
    fail("앱 스크립트가 로드되지 않았습니다.", "dap.html 이 손상되었을 수 있습니다.");
    return;
  }
  try{
    window.DAP_APP_BOOT();
  }catch(e){
    fail("앱을 시작하지 못했습니다.", String((e && e.stack) || e));
    return;
  }
  if(bootEl){
    bootEl.classList.add("gone");
    setTimeout(function(){ if(bootEl.parentNode) bootEl.parentNode.removeChild(bootEl); }, 320);
  }
}
})();
</script>
<script>
window.DAP_APP_BOOT = function(){
"use strict";
/* ─────────── 상수 ─────────── */
/* 문제은행 묶음 — 묶음을 바꾸면 문항·모의고사 세트·진행 중 세션이 통째로 바뀐다.
   풀이 기록(S.stats)은 문항 id 로 관리하므로 묶음이 달라도 그대로 유지된다. */
var BANKS = window.DAP_BANKS || [window.DAP];
var DAP, CH, CHLIST, QMAP, EXAM, PER_Q, TOTAL_SCORE, TOTAL_Q;

function bankById(id){
  for(var i=0;i<BANKS.length;i++) if(BANKS[i].id===id) return BANKS[i];
  return null;
}
function useBank(id){
  var b = bankById(id) || BANKS[0];
  DAP = window.DAP = b;
  CHLIST = DAP.chapters;
  CH = {}; CHLIST.forEach(function(c){ CH[c.id]=c; });
  QMAP = {}; DAP.questions.forEach(function(q){ QMAP[q.id]=q; });
  EXAM = DAP.exam;
  PER_Q = EXAM.perQuestion; TOTAL_SCORE = EXAM.totalScore; TOTAL_Q = EXAM.totalQuestions;
  return b.id;
}
useBank(BANKS[0].id);

/* 세션 키는 묶음별로 분리한다. 같은 "ch1:b0" 라도 묶음이 다르면 다른 세션이다. */
function skey(k){ return DAP.id + "/" + k; }
/* ─────────── 폰트 목록 ───────────
   웹앱에서 시인성이 좋은 한글 본문용 글꼴만 추렸다. 첫 항목이 기본값이다. */
var FONTS = [
  { id:"pretendard", name:"Pretendard", note:"기본 · 균형 잡힌 현대적 고딕",
    stack:'"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"plex", name:"IBM Plex Sans KR", note:"또렷한 획 · 문서형 화면에 적합",
    stack:'"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"noto", name:"Noto Sans KR", note:"표준적이고 무난한 본문 고딕",
    stack:'"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"gothica1", name:"Gothic A1", note:"넉넉한 자간 · 긴 지문 읽기 편함",
    stack:'"Gothic A1",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif' },
  { id:"system", name:"시스템 기본", note:"네트워크 없이도 즉시 표시",
    stack:'-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Segoe UI",sans-serif' }
];
var FONT_MAP = {}; FONTS.forEach(function(f){ FONT_MAP[f.id] = f; });
var FS_MIN = 0.8, FS_MAX = 1.6, FS_STEP = 0.05;

var BOX_DAYS = [0, 1, 2, 4, 8, 16, 35];
var KEY = "dap750:v1";

/* ─────────── 저장소 ─────────── */
var S = load();
function blank(){
  return { stats:{}, bookmarks:{}, wrong:{}, exams:[], sessions:{},
           settings:{ timerMin:90, target:45, theme:"auto", bank:"",
                      fontId:FONTS[0].id, fontStack:FONTS[0].stack, fontScale:1 } };
}
function normalize(o){
  var b = blank();
  for(var k in b) if(!(k in o) || o[k]===null) o[k]=b[k];
  for(var k2 in b.settings) if(!(k2 in o.settings)) o.settings[k2]=b.settings[k2];
  /* v1 → v2 이관: 단일 session 슬롯을 키별 sessions 맵으로 */
  if(o.session && o.session.ids && !Object.keys(o.sessions).length){
    var key = o.session.key || "legacy";
    o.session.key = key; o.session.ts = o.session.ts || Date.now();
    o.sessions[key] = o.session;
  }
  delete o.session;
  /* 폰트 설정 보정 — 목록에 없는 id 는 기본값으로 되돌린다 */
  var f = FONT_MAP[o.settings.fontId] || FONTS[0];
  o.settings.fontId = f.id;
  o.settings.fontStack = f.stack;
  var sc = parseFloat(o.settings.fontScale);
  if(!isFinite(sc)) sc = 1;
  o.settings.fontScale = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, sc)) * 100) / 100;
  return o;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    return normalize(JSON.parse(raw));
  }catch(e){ return blank(); }
}
var saveT=null;
function save(){
  if(session && session.key){ session.ts = Date.now(); S.sessions[session.key] = session; }
  if(saveT) clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    syncSchedule();
  }, 140);
}

/* ─────────── 유틸 ─────────── */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)
    +" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function shuffle(a, seed){
  var arr = a.slice(), s = seed || Date.now();
  function rnd(){ s = (s*1664525 + 1013904223) % 4294967296; return s/4294967296; }
  for(var i=arr.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* ─────────── 통계 파생 ─────────── */
function st(id){ return S.stats[id] || null; }
function chStat(ch){
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  var seen=0, right=0, tries=0, ok=0;
  qs.forEach(function(q){
    var s = st(q.id); if(!s) return;
    seen++; tries += s.right+s.wrong; ok += s.right;
    if(s.right>0 && s.wrong===0) right++;
  });
  return { total:qs.length, seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,qs.length) };
}
function overall(){
  var seen=0,tries=0,ok=0;
  DAP.questions.forEach(function(q){ var s=st(q.id); if(!s) return; seen++; tries+=s.right+s.wrong; ok+=s.right; });
  return { seen:seen, tries:tries, ok:ok, acc:pct(ok,tries), cover:pct(seen,DAP.questions.length) };
}
function wrongIds(){ return Object.keys(S.wrong).filter(function(id){ return QMAP[id]; }); }
function bookmarkIds(){ return Object.keys(S.bookmarks).filter(function(id){ return S.bookmarks[id] && QMAP[id]; }); }
function dueIds(){
  var now = Date.now();
  return Object.keys(S.stats).filter(function(id){
    var s = S.stats[id];
    return QMAP[id] && s.due && s.due <= now && s.box < 6;
  }).sort(function(a,b){ return S.stats[a].due - S.stats[b].due; });
}
function weakSections(limit){
  var m = {};
  DAP.questions.forEach(function(q){
    var s = st(q.id); if(!s || s.wrong===0) return;
    var key = q.ch + "|" + q.s;
    if(!m[key]) m[key] = { ch:q.ch, sec:q.s, wrong:0, tries:0 };
    m[key].wrong += s.wrong; m[key].tries += s.wrong + s.right;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.wrong - a.wrong; }).slice(0, limit||8);
}

/* ─────────── 채점 기록 ─────────── */
function record(qid, correct){
  var s = S.stats[qid] || (S.stats[qid] = { right:0, wrong:0, box:0, due:0, last:0 });
  s.last = Date.now();
  if(correct){
    s.right++;
    s.box = Math.min(6, (s.box||0) + 1);
    delete S.wrong[qid];
  }else{
    s.wrong++;
    s.box = 0;
    S.wrong[qid] = true;
  }
  s.due = Date.now() + BOX_DAYS[Math.min(s.box, BOX_DAYS.length-1)] * 864e5;
  save();
}

/* ─────────── 세션 ─────────── */
/* 세션은 키별로 따로 저장된다. 같은 키로 다시 들어오면 마지막에 멈춘 다음 문항부터 이어진다. */
function solvedCount(s){
  var done = s.mode==="exam" ? s.ans : s.revealed;
  return s.ids.filter(function(id){ return done[id]!==undefined; }).length;
}
function firstUnsolved(s){
  var done = s.mode==="exam" ? s.ans : s.revealed;
  for(var i=0;i<s.ids.length;i++) if(done[s.ids[i]]===undefined) return i;
  return Math.min(s.idx, s.ids.length-1);
}
function liveSessions(){
  var pre = DAP.id + "/";
  return Object.keys(S.sessions)
    .filter(function(k){ return k.indexOf(pre) === 0; })
    .map(function(k){ return S.sessions[k]; })
    .filter(function(s){ return s && s.ids && s.ids.length && !s.submitted && solvedCount(s) < s.ids.length; })
    .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
}
function savedSession(key){
  var s = S.sessions[skey(key)];
  if(!s || !s.ids || !s.ids.length || s.submitted) return null;
  return solvedCount(s) < s.ids.length ? s : null;
}
function touch(){ if(session){ session.ts = Date.now(); S.sessions[session.key] = session; } save(); }

function startSession(cfg){
  var raw = cfg.key || ("adhoc:"+Date.now());
  var key = skey(raw);
  var prev = cfg.fresh ? null : savedSession(raw);
  if(prev){
    session = prev;
    session.title = cfg.title || session.title;
    session.idx = firstUnsolved(session);
    session.start = Date.now() - (session.spent||0)*1000;
    touch(); go("quiz");
    toast("이어서 풀기 · "+(session.idx+1)+"번 문항부터");
    return;
  }
  session = {
    key: key, mode: cfg.mode, title: cfg.title, ids: cfg.ids, idx: 0,
    ans: {}, revealed: {}, flags: {}, start: Date.now(), ts: Date.now(),
    limitSec: cfg.limitSec || 0, setNo: cfg.setNo || 0, submitted: false, spent: 0
  };
  S.sessions[key] = session; save();
  go("quiz");
}
function resumeSession(key){
  var s = savedSession(key); if(!s) return;
  session = s;
  session.idx = firstUnsolved(session);
  session.start = Date.now() - (session.spent||0)*1000;
  touch(); go("quiz");
}
function endSession(){
  if(session) delete S.sessions[session.key];
  session=null; save();
}
/* 세션 전체를 다 푼 뒤에도 기록은 남기지 않고 정리한다 */
function dropSession(key){ delete S.sessions[key]; save(); }
/* 나가기 — 진도는 그대로 두고 화면만 벗어난다 */
function leaveSession(){
  if(!session) return go("dash");
  var done = solvedCount(session), tot = session.ids.length, nx = firstUnsolved(session)+1;
  session.idx = nx-1; save();
  session = null; go("dash");
  toast(done<tot ? done+"/"+tot+" 문항까지 저장 · 다음에 "+nx+"번부터 이어집니다" : "저장했습니다");
}

function chapterIds(ch, range){
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  if(range==="unseen") qs = qs.filter(function(q){ return !st(q.id); });
  if(range==="wrong")  qs = qs.filter(function(q){ return S.wrong[q.id]; });
  if(range==="rand25") qs = shuffle(qs).slice(0,25);
  return qs.map(function(q){ return q.id; });
}
function randomExamIds(){
  var ids=[];
  CHLIST.forEach(function(c){
    var pool = DAP.questions.filter(function(q){ return q.ch===c.id; });
    ids = ids.concat(shuffle(pool).slice(0,c.perSet).map(function(q){ return q.id; }));
  });
  return ids;
}

/* ─────────── 뷰: 퀴즈 ─────────── */
function viewQuiz(){
  var q = QMAP[session.ids[session.idx]];
  var isExam = session.mode==="exam";
  var picked = session.ans[q.id];
  var revealed = !isExam && session.revealed[q.id];
  var answered = Object.keys(session.ans).length;

  var h = '<div class="page-head" style="margin-bottom:14px"><div>'+
    '<div class="eyebrow">'+(isExam?"실전 모드 · 제출 후 채점":"학습 모드 · 즉시 해설")+'</div>'+
    '<h1 class="page-title" style="font-size:calc(20px * var(--fs))">'+esc(session.title)+'</h1></div>'+
    '<div class="btn-row"><button class="btn btn-sm" data-act="quit">나가기</button>'+
    (isExam? '<button class="btn btn-sm btn-primary" data-act="submit">제출하고 채점</button>':'')+'</div></div>';

  h += '<div class="quizbar">'+
    '<span class="chip mono">'+(session.idx+1)+' / '+session.ids.length+'</span>'+
    '<span class="progress"><i style="width:'+pct(answered, session.ids.length)+'%"></i></span>'+
    '<span class="chip mono">응답 '+answered+'</span>'+
    (session.limitSec? '<span class="timer mono" id="timer">--:--</span>' : '')+
  '</div>';

  h += '<div class="qcard"><div class="qhead">'+
    '<span class="chip mono">'+q.id+'</span>'+
    '<span class="chip chip-accent">'+q.ch+'. '+esc(CH[q.ch].name)+'</span>'+
    '<span class="chip">'+esc(q.s)+'</span>'+
    (st(q.id)&&st(q.id).wrong>=3? '<span class="chip chip-bad">집중 관리</span>':'')+
    '<span class="spacer"></span>'+
    '<button class="icon-btn'+(S.bookmarks[q.id]?" on":"")+'" data-act="mark" title="북마크 (B)">'+(S.bookmarks[q.id]?"★":"☆")+'</button>'+
    (isExam? '<button class="icon-btn'+(session.flags[q.id]?" on":"")+'" data-act="flag" title="나중에 다시 보기">⚑</button>':'')+
  '</div>';

  h += '<div class="qbody"><p class="qtext">'+esc(q.q)+'</p></div>';

  h += '<div class="opts">';
  q.c.forEach(function(txt,i){
    var cls = "opt";
    if(revealed){
      if(i===q.a) cls += " correct";
      else if(i===picked) cls += " wrong";
    }else if(picked===i) cls += " sel";
    h += '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(revealed?" disabled":"")+'>'+
      '<span class="opt-n">'+(i+1)+'</span><span class="opt-txt">'+esc(txt)+'</span></button>';
  });
  h += '</div>';

  if(revealed){
    var ok = picked===q.a;
    h += '<div class="explain"><div class="explain-h">'+
      (ok? '<span class="chip chip-ok">정답</span>' : '<span class="chip chip-bad">오답</span>')+
      '<span class="eyebrow">해설 · '+esc(q.s)+'</span></div>'+
      '<div class="explain-b">'+esc(q.e)+'</div></div>';
  }

  h += '<div class="qfoot">'+
    '<button class="btn btn-sm" data-act="prev"'+(session.idx===0?" disabled":"")+'>← 이전</button>'+
    '<button class="btn btn-sm" data-act="next">'+(session.idx===session.ids.length-1?"마지막 문항":"다음 →")+'</button>'+
    (!isExam && picked!==undefined && !revealed? '<button class="btn btn-sm btn-primary" data-act="reveal">채점 (Enter)</button>':'')+
    '<span class="spacer"></span>'+
    '<span class="note"><span class="kbd">1</span>–<span class="kbd">4</span> 선택 · <span class="kbd">Enter</span> 진행</span>'+
  '</div></div>';

  /* 네비게이터 */
  h += '<div class="card" style="margin-top:16px"><div class="sec-head"><span class="sec-title">문항 이동</span>'+
    '<span class="eyebrow">'+(isExam?"응답 / 표시":"정답 / 오답")+'</span></div><div class="navgrid">';
  session.ids.forEach(function(id,i){
    var cls = "navdot";
    if(i===session.idx) cls += " cur";
    if(session.flags[id]) cls += " flag";
    if(isExam){ if(session.ans[id]!==undefined) cls += " answered"; }
    else if(session.revealed[id]) cls += (session.ans[id]===QMAP[id].a ? " ok" : " no");
    else if(session.ans[id]!==undefined) cls += " answered";
    h += '<button class="'+cls+'" data-act="jump" data-i="'+i+'">'+(i+1)+'</button>';
  });
  h += '</div></div>';
  return h;
}

/* ─────────── 채점 ─────────── */
function submitExam(){
  if(session.submitted) return;
  var byCh = {}, correct = 0;
  CHLIST.forEach(function(c){ byCh[c.id] = { count:0, correct:0 }; });
  session.ids.forEach(function(id){
    var q = QMAP[id], picked = session.ans[id];
    var ok = picked === q.a;
    byCh[q.ch].count++;
    if(ok){ byCh[q.ch].correct++; correct++; }
    record(id, ok);
  });
  var dur = Math.round((Date.now()-session.start)/1000);
  var rec = {
    id: "E"+Date.now(), ts: Date.now(), title: session.title, setNo: session.setNo,
    count: session.ids.length, correct: correct,
    score: Math.round(correct*PER_Q*10)/10, dur: dur, byCh: byCh,
    answers: session.ans
  };
  S.exams.push(rec);
  if(S.exams.length>60) S.exams = S.exams.slice(-60);
  session.submitted = true;
  endSession();
  save();
  go("result", { examId: rec.id });
}

function viewResult(){
  var e = S.exams.filter(function(x){ return x.id===view.examId; })[0];
  if(!e) return '<div class="card"><div class="empty"><b>리포트를 찾을 수 없습니다</b></div></div>';
  var target = S.settings.target;

  var pass = e.score>=target && !failCh.length;

  var h = '<div class="page-head"><div><div class="eyebrow">Result Report</div><h1 class="page-title">'+esc(e.title)+' 결과</h1>'+
    '<p class="page-desc">'+fmtDate(e.ts)+' · 소요 '+fmtTime(e.dur)+' · 문항당 '+PER_Q+'점</p></div>'+
    '<div class="btn-row"><button class="btn" data-go="exams">모의고사 목록</button>'+
    '<button class="btn btn-primary" data-act="retrywrong" data-id="'+e.id+'">틀린 문항만 다시 풀기</button></div></div>';

  h += '<div class="card" style="margin-bottom:16px"><div class="score-hero">'+
    '<div><div class="eyebrow">총점</div><div class="score-big">'+e.score.toFixed(1)+'<small> / 60</small></div></div>'+
    '<div><div class="eyebrow">정답</div><div class="score-big" style="font-size:calc(32px * var(--fs))">'+e.correct+'<small> / '+e.count+'</small></div></div>'+
    '<div><div class="eyebrow">정답률</div><div class="score-big" style="font-size:calc(32px * var(--fs))">'+pct(e.correct,e.count)+'<small>%</small></div></div>'+
    '<div style="flex:1;min-width:160px;text-align:right">'+
      (pass? '<span class="verdict pass">✔ 합격권 (목표 '+target+'점)</span>'
           : '<span class="verdict fail">✕ '+(failCh.length? "과목 과락 발생" : "목표 미달")+'</span>')+
      (failCh.length? '<div class="note" style="margin-top:6px">과락 과목: '+failCh.map(function(c){return c.id+". "+esc(c.name);}).join(", ")+'</div>':'')+
    '</div></div></div>';

  h += '<div class="card" style="margin-bottom:16px"><div class="sec-head"><span class="sec-title">과목별 결과</span>'+
    '<span class="eyebrow">40% 미만 과락</span></div><div class="tblwrap"><table class="tbl">'+
    '<thead><tr><th>No.</th><th>과목명</th><th style="text-align:right">정답</th><th style="text-align:right">배점</th><th style="text-align:right">득점</th><th style="text-align:right">정답률</th><th>판정</th></tr></thead><tbody>';
  CHLIST.forEach(function(c){
    var b = e.byCh[c.id] || {count:0,correct:0};
    var p = pct(b.correct, b.count);
    h += '<tr><td class="mono">'+c.id+'</td><td>'+esc(c.name)+'</td>'+
      '<td class="num">'+b.correct+'/'+b.count+'</td>'+
      '<td class="num">'+ (Math.round(b.count*PER_Q*10)/10) +'</td>'+
      '<td class="num"><strong>'+(Math.round(b.correct*PER_Q*10)/10)+'</strong></td>'+
      '<td class="num">'+p+'%</td>'+
      '<td>'+(b.count===0?'–':(p<40? '<span class="chip chip-bad">과락</span>' : (p>=75? '<span class="chip chip-ok">양호</span>':'<span class="chip">보통</span>')))+'</td></tr>';
  });
  h += '</tbody></table></div></div>';

  var wrongs = Object.keys(e.answers||{}).filter(function(id){ return e.answers[id]!==QMAP[id].a; })
    .concat(e.answers? [] : []);
  var missed = [];
  CHLIST.forEach(function(){});
  (function(){
    var ids = DAP.sets[e.setNo-1] || Object.keys(e.answers||{});
    ids.forEach(function(id){ if(QMAP[id] && e.answers[id]!==QMAP[id].a) missed.push(id); });
  })();

  h += '<div class="card"><div class="sec-head"><span class="sec-title">틀린 문항 해설</span>'+
    '<span class="eyebrow">'+missed.length+'문항</span></div>'+
    (missed.length? '<div style="padding:14px 16px">'+missed.map(function(id){
        var q = QMAP[id], picked = e.answers[id];
        return '<div class="rev"><div class="rev-h"><span class="chip mono">'+q.id+'</span>'+
          '<span class="chip">'+q.ch+'. '+esc(CH[q.ch].name)+'</span><span class="chip">'+esc(q.s)+'</span>'+
          '<span style="flex:1"></span><button class="btn btn-sm" data-act="solveone" data-id="'+q.id+'">다시 풀기</button></div>'+
          '<div class="rev-b"><div class="rev-q">'+esc(q.q)+'</div>'+
          '<div class="rev-a">'+q.c.map(function(c,i){
            var mk = i===q.a ? '<span class="tag-ok">✔ 정답</span> ' : (i===picked? '<span class="tag-bad">✕ 내 답</span> ':'　　　　 ');
            return '<div>'+mk+esc(c)+'</div>'; }).join("")+'</div>'+
          '<div class="explain" style="margin:4px 0 0"><div class="explain-h"><span class="eyebrow">해설</span></div>'+
          '<div class="explain-b">'+esc(q.e)+'</div></div></div></div>';
      }).join("")+'</div>'
      : '<div class="empty"><b>만점입니다</b>틀린 문항이 없습니다.</div>')+
    '</div>';
  return h;
}

/* ─────────── 렌더 ─────────── */
function render(){
  renderRail();
  var m = $("#main"), h="";
  switch(view.name){
    case "dash": h = viewDash(); break;
    case "chapter": h = viewChapter(view.ch); break;
    case "exams": h = viewExams(); break;
    case "wrong": h = viewWrong(); break;
    case "review": h = viewReview(); break;
    case "marks": h = viewMarks(); break;
    case "search": h = viewSearch(); break;
    case "settings": h = viewSettings(); break;
    case "quiz": h = session ? viewQuiz() : viewDash(); break;
    case "result": h = viewResult(); break;
    default: h = viewDash();
  }
  m.innerHTML = h;
  if(view.name==="quiz" && session && session.limitSec) startTimer();
  if(view.name==="search"){ var i=$("#q"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
}
function startTimer(){
  if(timerH) clearInterval(timerH);
  function tick(){
    if(!session) return;
    var spent = Math.round((Date.now()-session.start)/1000);
    session.spent = spent; S.sessions[session.key] = session;
    var left = session.limitSec - spent;
    var el = $("#timer"); if(!el) return;
    el.textContent = fmtTime(Math.abs(left)) + (left<0?" 초과":"");
    el.classList.toggle("warn", left <= 300);
    if(left<=0 && left>-2){ toast("제한 시간이 종료되었습니다"); }
  }
  tick(); timerH = setInterval(tick, 1000);
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-go],[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act"), dest = t.getAttribute("data-go");

  if(dest){
    if(dest==="chapter") return go("chapter", { ch:+t.getAttribute("data-ch") });
    if(dest==="randomexam"){
      return startSession({ key:"rand", mode:"exam", title:"랜덤 모의고사", ids:randomExamIds(),
                            limitSec:S.settings.timerMin*60, setNo:0 });
    }
    return go(dest);
  }

  switch(act){
    case "resume": resumeSession(t.getAttribute("data-key")); break;
    case "dropsession":
      dropSession(t.getAttribute("data-key")); render();
      toast("진행 중이던 세션을 삭제했습니다"); break;
    case "startch": {
      var ch = +t.getAttribute("data-ch"), range = t.getAttribute("data-range");
      var ids = chapterIds(ch, range);
      if(!ids.length){ toast("해당 조건의 문항이 없습니다"); break; }
      var lbl = { all:"전체", unseen:"안 푼 문항", wrong:"오답", rand25:"무작위 25문항" }[range];
      startSession({ key:"ch"+ch+":"+range, fresh:!!t.getAttribute("data-fresh"),
                     mode:"study", title:ch+". "+CH[ch].name+" · "+lbl, ids:ids });
      break;
    }
    case "startblock": {
      var ch2 = +t.getAttribute("data-ch"), from = +t.getAttribute("data-from");
      var qs = DAP.questions.filter(function(q){ return q.ch===ch2; }).slice(from, from+25);
      startSession({ key:"ch"+ch2+":b"+from, mode:"study",
                     title:ch2+". "+CH[ch2].name+" · 블록 "+(from/25+1), ids:qs.map(function(q){return q.id;}) });
      break;
    }
    case "startset": {
      var n = +t.getAttribute("data-set");
      startSession({ key:"set"+n, mode:"exam", title:"모의고사 SET "+String(n+1).padStart(2,"0"),
                     ids:DAP.sets[n].slice(), limitSec:S.settings.timerMin*60, setNo:n+1 });
      break;
    }
    case "startwrong": {
      var f = +t.getAttribute("data-filter");
      var ids2 = wrongIds().filter(function(id){ return !f || QMAP[id].ch===f; });
      if(!ids2.length){ toast("오답이 없습니다"); break; }
      startSession({ key:"wrong:"+f, mode:"study",
                     title:"오답 재시험"+(f?" · "+CH[f].name:""), ids:shuffle(ids2) });
      break;
    }
    case "startdue": {
      var d = dueIds(); if(!d.length){ toast("복습 대상이 없습니다"); break; }
      startSession({ key:"due", mode:"study", title:"복습 큐 "+d.length+"문항", ids:d });
      break;
    }
    case "startmarks": {
      var b = bookmarkIds(); if(!b.length) break;
      startSession({ key:"marks", mode:"study", title:"북마크 "+b.length+"문항", ids:b });
      break;
    }
    case "startsearch": {
      var k = (view.kw||"").toLowerCase();
      var hits = DAP.questions.filter(function(q){ return (q.q+" "+q.c.join(" ")+" "+q.e+" "+q.s).toLowerCase().indexOf(k)>=0; })
                  .slice(0,75).map(function(q){ return q.id; });
      startSession({ key:"search:"+k, mode:"study", title:'검색 "'+(view.kw||"")+'"', ids:hits });
      break;
    }
    case "solveone": startSession({ key:"one:"+t.getAttribute("data-id"), fresh:true, mode:"study",
                                    title:"단일 문항 · "+t.getAttribute("data-id"), ids:[t.getAttribute("data-id")] }); break;
    case "retrywrong": {
      var e = S.exams.filter(function(x){ return x.id===t.getAttribute("data-id"); })[0];
      if(!e) break;
      var ms = Object.keys(e.answers).filter(function(id){ return QMAP[id] && e.answers[id]!==QMAP[id].a; });
      if(!ms.length){ toast("틀린 문항이 없습니다"); break; }
      startSession({ key:"retry:"+e.id, mode:"study", title:e.title+" 오답 "+ms.length+"문항", ids:ms });
      break;
    }
    case "openexam": go("result", { examId: t.getAttribute("data-id") }); break;
    case "wfilter": go("wrong", { filter:+t.getAttribute("data-ch") }); break;
    case "unwrong": delete S.wrong[t.getAttribute("data-id")]; save(); render(); break;
    case "clearwrong":
      if(confirm("오답노트를 모두 비울까요? 통계 기록은 유지됩니다.")){ S.wrong={}; save(); render(); toast("오답노트를 비웠습니다"); }
      break;
    case "togglemark": {
      var id = t.getAttribute("data-id");
      if(S.bookmarks[id]) delete S.bookmarks[id]; else S.bookmarks[id]=true;
      save(); render(); break;
    }
    case "dosearch": go("search", { kw: $("#q").value }); break;

    /* 퀴즈 */
    case "pick": pick(+t.getAttribute("data-i")); break;
    case "reveal": reveal(); break;
    case "next": nextQ(); break;
    case "prev": if(session.idx>0){ session.idx--; save(); render(); } break;
    case "jump": session.idx = +t.getAttribute("data-i"); save(); render(); break;
    case "mark": {
      var qid = session.ids[session.idx];
      if(S.bookmarks[qid]) delete S.bookmarks[qid]; else S.bookmarks[qid]=true;
      save(); render(); break;
    }
    case "flag": {
      var fid = session.ids[session.idx];
      if(session.flags[fid]) delete session.flags[fid]; else session.flags[fid]=true;
      save(); render(); break;
    }
    case "submit": {
      var un = session.ids.length - Object.keys(session.ans).length;
      if(un>0 && !confirm(un+"문항이 미응답입니다. 그대로 제출할까요?")) break;
      submitExam(); break;
    }
    case "quit": {
      if(!session) break;
      if(session.mode==="exam" && !confirm("나가면 이번 응시는 채점되지 않습니다. 진행 상황은 저장되므로 나중에 이어서 풀 수 있습니다. 계속할까요?")) break;
      leaveSession(); break;
    }

    /* 설정 */
    case "savesettings": {
      var tm = Math.max(10, Math.min(240, +$("#setTimer").value||90));
      var tg = Math.max(1, Math.min(60, +$("#setTarget").value||45));
      S.settings.timerMin = tm; S.settings.target = Math.round(tg*10)/10; save(); render();
      toast("설정을 저장했습니다"); break;
    }
    /* 폰트 */
    case "setfont": setFont(t.getAttribute("data-font")); render(); toast("글꼴: "+(FONT_MAP[S.settings.fontId]||FONTS[0]).name); break;
    case "fsup":    render_fs(setFontScale(S.settings.fontScale + FS_STEP)); break;
    case "fsdown":  render_fs(setFontScale(S.settings.fontScale - FS_STEP)); break;
    case "fsset":   render_fs(setFontScale(parseFloat(t.getAttribute("data-v")))); break;

    case "export": exportProgress(); break;
    case "unlinkfile": unlinkFile(); break;
    case "syncnow":    syncNow(false); break;
    case "synclink":   syncLink(); break;
    case "syncunlink": syncUnlink(); break;
    case "import": { var fi = $("#fileIn"); if(fi){ fi.value=""; fi.click(); } break; }
    case "wipe":
      if(confirm("모든 학습 기록을 삭제합니다. 되돌릴 수 없습니다.")){
        S = blank(); session = null; try{ localStorage.removeItem(KEY); }catch(e){}
        go("dash"); toast("초기화했습니다");
      }
      break;
  }
});

/* ─────────── 진도 파일 내보내기 / 가져오기 ─────────── */
/* ═══════════ 진도 파일 ═══════════
   파일은 하나만 쓴다. 처음 저장할 때 위치를 한 번 고르면 그 파일 핸들을
   IndexedDB 에 보관해 두고, 이후 저장은 같은 파일을 조용히 덮어쓴다.
   (File System Access API 미지원 브라우저는 같은 이름으로 내려받기 — 이 경우
    브라우저가 "dap-progress (1).json" 처럼 번호를 붙일 수 있다.) */
var PROGRESS_FILE = "dap-progress.json";
var fileHandle = null;          /* 연결된 저장 위치 */

/* ---- 핸들 보관용 초경량 IndexedDB ---- */
var HDB = "dap750-fs", HSTORE = "handles", HKEY = "progress";
function idb(cb){
  try{
    if(!window.indexedDB) return cb(null);
    var rq = indexedDB.open(HDB, 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore(HSTORE); };
    rq.onsuccess = function(){ cb(rq.result); };
    rq.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbPut(val){
  idb(function(db){
    if(!db) return;
    try{ db.transaction(HSTORE, "readwrite").objectStore(HSTORE).put(val, HKEY); }catch(e){}
  });
}
function idbGet(cb){
  idb(function(db){
    if(!db) return cb(null);
    try{
      var rq = db.transaction(HSTORE, "readonly").objectStore(HSTORE).get(HKEY);
      rq.onsuccess = function(){ cb(rq.result || null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function idbDel(){
  idb(function(db){
    if(!db) return;
    try{ db.transaction(HSTORE, "readwrite").objectStore(HSTORE).delete(HKEY); }catch(e){}
  });
}

function fsSupported(){ return typeof window.showSaveFilePicker === "function"; }
function fileLinked(){ return !!fileHandle; }

/* 시작할 때 지난번 저장 위치를 되살린다 */
function restoreFileHandle(){
  if(!fsSupported()) return;
  idbGet(function(h){
    if(!h || typeof h.createWritable !== "function") return;
    fileHandle = h;
    if(view.name === "settings") render();
  });
}

function payloadText(){
  if(session && session.key){ session.idx = firstUnsolved(session); S.sessions[session.key] = session; }
  return JSON.stringify({
    app:"dap750", ver:2, savedAt:Date.now(), savedAtText:fmtDate(Date.now()),
    summary:{ solved:overall().seen, wrong:wrongIds().length,
              bookmarks:bookmarkIds().length, exams:S.exams.length,
              openSessions:liveSessions().length },
    data:S
  }, null, 0);
}

function exportProgress(){
  var text = payloadText();
  if(fsSupported()){ saveViaPicker(text); return; }
  downloadFallback(text);
}

/* 연결된 핸들이 있으면 그대로 덮어쓰고, 없으면 한 번만 위치를 묻는다 */
function saveViaPicker(text){
  if(fileHandle){ writeHandle(fileHandle, text, false); return; }
  var opts = {
    suggestedName: PROGRESS_FILE,
    types:[{ description:"DAP 진도 파일", accept:{ "application/json":[".json"] } }]
  };
  window.showSaveFilePicker(opts).then(function(h){
    fileHandle = h; idbPut(h);
    writeHandle(h, text, true);
  }, function(err){
    if(err && err.name === "AbortError"){ toast("저장을 취소했습니다"); return; }
    downloadFallback(text);
  });
}

function writeHandle(h, text, isNew){
  function run(){
    h.createWritable().then(function(w){
      /* UTF-8 로 기록 — Blob 의 기본 인코딩이 UTF-8 이라 한글이 깨지지 않는다 */
      return w.write(new Blob([text], { type:"application/json;charset=utf-8" }))
              .then(function(){ return w.close(); });
    }).then(function(){
      toast((isNew ? "저장 위치를 연결했습니다 · " : "") + (h.name || PROGRESS_FILE) + " 에 덮어썼습니다");
      if(view.name === "settings") render();
    }, function(){
      fileHandle = null; idbDel();
      toast("저장에 실패했습니다 · 위치를 다시 지정해 주세요");
      downloadFallback(text);
    });
  }
  /* 권한이 끊겼으면 다시 요청 */
  if(typeof h.queryPermission === "function"){
    h.queryPermission({ mode:"readwrite" }).then(function(p){
      if(p === "granted") return run();
      if(typeof h.requestPermission !== "function"){ return run(); }
      h.requestPermission({ mode:"readwrite" }).then(function(p2){
        if(p2 === "granted") run();
        else toast("파일 쓰기 권한이 없습니다");
      }, run);
    }, run);
  }else run();
}

function unlinkFile(){
  fileHandle = null; idbDel();
  toast("저장 위치 연결을 해제했습니다 · 다음 저장 때 다시 고릅니다");
  render();
}

/* File System Access API 가 없을 때: 같은 이름으로 내려받기 */
function downloadFallback(text){
  try{
    var blob = new Blob([text], { type:"application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = PROGRESS_FILE; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast(PROGRESS_FILE + " 저장됨 · 기존 파일을 덮어쓰세요");
  }catch(e){
    var box = $("#ioBox");
    if(box){ box.style.display = "block"; box.value = text; box.select(); }
    toast("파일 저장이 막혀 있습니다 · 아래 내용을 복사해 두세요");
  }
}
/* 파일 선택 → 읽기 → 교체 또는 병합 */
document.addEventListener("input", function(ev){
  if(!ev.target || ev.target.id!=="fsBar") return;
  render_fs(setFontScale(parseFloat(ev.target.value)));
});
document.addEventListener("change", function(ev){
  if(ev.target && ev.target.id==="syncAuto"){
    sync.auto = !!ev.target.checked; saveSync();
    toast(sync.auto ? "자동 동기화 켬" : "자동 동기화 끔");
    if(!sync.auto && syncT){ clearTimeout(syncT); syncT = null; }
    return;
  }
  if(!ev.target || ev.target.id!=="fileIn") return;
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onerror = function(){ toast("파일을 읽지 못했습니다"); };
  r.onload = function(){
    var inc;
    try{
      var o = JSON.parse(String(r.result));
      inc = (o && o.data && o.data.stats) ? o.data : o;   /* 래핑 형식과 예전 원본 형식 모두 허용 */
      if(!inc || typeof inc !== "object" || !inc.stats) throw 0;
      inc = normalize(inc);
    }catch(err){ toast("DAP 진도 파일이 아닙니다"); return; }

    var incSolved = Object.keys(inc.stats).length, curSolved = Object.keys(S.stats).length;
    var replace = confirm(
      "불러온 파일: "+incSolved+"문항 기록\n현재 기기: "+curSolved+"문항 기록\n\n"+
      "[확인] 파일 내용으로 전체 교체\n[취소] 현재 기록과 병합");
    S = replace ? inc : mergeState(S, inc);
    session = null; save();
    go("dash");
    toast((replace?"불러왔습니다 · ":"병합했습니다 · ")+Object.keys(S.stats).length+"문항 기록 · 진행 중 "+liveSessions().length+"건");
  };
  r.readAsText(f);
});
function mergeState(cur, inc){
  var out = normalize(JSON.parse(JSON.stringify(cur)));
  /* 문항 통계: 시도 횟수가 많은 쪽을 채택하고, 복습 일정은 더 최근 기록을 따른다 */
  Object.keys(inc.stats).forEach(function(id){
    var a = out.stats[id], b = inc.stats[id];
    if(!a){ out.stats[id] = b; return; }
    var newer = (b.last||0) > (a.last||0) ? b : a;
    out.stats[id] = {
      right: Math.max(a.right||0, b.right||0),
      wrong: Math.max(a.wrong||0, b.wrong||0),
      box: newer.box, due: newer.due,
      last: Math.max(a.last||0, b.last||0)
    };
  });
  Object.keys(inc.bookmarks).forEach(function(id){ out.bookmarks[id] = true; });
  Object.keys(inc.wrong).forEach(function(id){ if(!(id in out.wrong)) out.wrong[id] = inc.wrong[id]; });
  /* 모의고사 이력: id 기준 중복 제거 후 최신순 */
  var seen = {}, all = out.exams.concat(inc.exams);
  out.exams = all.filter(function(e){ if(!e||!e.id||seen[e.id]) return false; seen[e.id]=1; return true; })
                 .sort(function(a,b){ return b.ts-a.ts; }).slice(0,60);
  /* 진행 중 세션: 같은 키면 더 최근에 손댄 쪽 */
  Object.keys(inc.sessions).forEach(function(k){
    var a = out.sessions[k], b = inc.sessions[k];
    if(!a || (b.ts||0) > (a.ts||0)) out.sessions[k] = b;
  });
  return out;
}

/* ═══════════ 진도 동기화 (비공개 GitHub Gist) ═══════════
   Gist 하나를 원본으로 삼아 기기마다 가져와 병합하고 다시 올린다.
   충돌 처리는 mergeState() 를 그대로 쓴다 — 문항별 last 타임스탬프 기준.

   토큰은 S 와 분리된 키에 보관한다. S 는 진도 파일로 내보내지므로
   여기에 토큰을 넣으면 파일을 공유할 때 같이 새어 나간다. */
var SYNC_KEY  = "dap750:sync";
var SYNC_FILE = PROGRESS_FILE;            /* Gist 안의 파일 이름 */
var SYNC_WAIT = 20000;                    /* 기록이 바뀐 뒤 올리기까지 대기 */
var syncBusy = false, syncT = null, syncMsg = "";

function loadSync(){
  try{
    var o = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}");
    return { token:o.token||"", gistId:o.gistId||"", last:o.last||0, auto:o.auto!==false };
  }catch(e){ return { token:"", gistId:"", last:0, auto:true }; }
}
var sync = loadSync();
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){} }
function syncOn(){ return !!(sync.token && sync.gistId); }
function syncStatus(m){
  syncMsg = m || "";
  var el = $("#syncMsg");
  if(el) el.textContent = syncMsg;
}

function ghReq(method, path, body, ok, err){
  var x = new XMLHttpRequest();
  x.open(method, "https://api.github.com" + path, true);
  x.setRequestHeader("Accept", "application/vnd.github+json");
  x.setRequestHeader("Authorization", "Bearer " + sync.token);
  if(body) x.setRequestHeader("Content-Type", "application/json");
  x.onload = function(){
    if(x.status >= 200 && x.status < 300){
      var j = null;
      try{ j = JSON.parse(x.responseText || "{}"); }catch(e){ err("응답을 해석하지 못했습니다"); return; }
      ok(j);
    }
    else if(x.status === 401) err("토큰이 거부되었습니다 (401) · gist 권한을 확인하세요");
    else if(x.status === 403) err("요청이 거부되었습니다 (403) · 잠시 후 다시 시도하세요");
    else if(x.status === 404) err("Gist 를 찾을 수 없습니다 (404) · ID 와 토큰 주인을 확인하세요");
    else err("GitHub 오류 " + x.status);
  };
  x.onerror = function(){ err("네트워크에 연결하지 못했습니다"); };
  x.send(body ? JSON.stringify(body) : null);
}

/* Gist 에서 진도 본문을 읽는다. 아직 비어 있으면 null 을 넘긴다. */
function gistRead(cb, err){
  ghReq("GET", "/gists/" + encodeURIComponent(sync.gistId), null, function(g){
    var f = g.files && g.files[SYNC_FILE];
    if(!f){ cb(null); return; }
    /* 1MB 를 넘으면 content 가 잘려 오므로 원본 URL 로 다시 받는다 */
    if(f.truncated && f.raw_url){
      var x = new XMLHttpRequest();
      x.open("GET", f.raw_url, true);
      x.onload  = function(){ cb(x.status < 300 ? x.responseText : null); };
      x.onerror = function(){ err("Gist 원본을 내려받지 못했습니다"); };
      x.send(null);
      return;
    }
    cb(f.content || null);
  }, err);
}

/* 진도 파일 본문 → 정규화된 상태. 형식이 아니면 null */
function parsePayload(text){
  try{
    var o = JSON.parse(String(text));
    var inc = (o && o.data && o.data.stats) ? o.data : o;
    if(!inc || typeof inc !== "object" || !inc.stats) return null;
    return normalize(inc);
  }catch(e){ return null; }
}

/* 가져오기 → 병합 → 올리기. quiet 면 토스트를 띄우지 않는다. */
function syncNow(quiet){
  if(!syncOn()){ if(!quiet) toast("먼저 GitHub 토큰을 연결하세요"); return; }
  if(syncBusy) return;
  if(syncT){ clearTimeout(syncT); syncT = null; }
  syncBusy = true;
  syncStatus("동기화 중…");

  function fail(m){
    syncBusy = false;
    syncStatus("실패: " + m);
    if(!quiet) toast("동기화 실패 · " + m);
  }

  gistRead(function(text){
    var inc = text ? parsePayload(text) : null;
    if(text && !inc){ fail("Gist 내용이 DAP 진도 파일 형식이 아닙니다"); return; }

    if(inc){
      /* 지금 풀고 있는 세션은 화면이 튀지 않도록 로컬 것을 그대로 둔다.
         나머지 세션과 통계·오답·북마크·모의고사 이력은 정상 병합된다. */
      var liveKey = (session && session.key) ? session.key : null;
      var live = liveKey ? session : null;
      if(liveKey){ session.ts = Date.now(); S.sessions[liveKey] = session; }
      S = mergeState(S, inc);
      if(liveKey){ S.sessions[liveKey] = live; session = live; }
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    }

    var body = { files:{} };
    body.files[SYNC_FILE] = { content: payloadText() };
    ghReq("PATCH", "/gists/" + encodeURIComponent(sync.gistId), body, function(){
      syncBusy = false;
      sync.last = Date.now(); saveSync();
      syncStatus("");
      if(!quiet) toast("동기화 완료 · " + Object.keys(S.stats).length + "문항 기록");
      if(view.name === "settings" || view.name === "dash") render();
    }, fail);
  }, fail);
}

/* 기록이 바뀌면 잠시 뒤 한 번만 올린다 */
function syncSchedule(){
  if(typeof sync === "undefined" || !syncOn() || !sync.auto || syncBusy) return;
  if(syncT) clearTimeout(syncT);
  syncT = setTimeout(function(){ syncT = null; syncNow(true); }, SYNC_WAIT);
}

/* 탭을 덮거나 앱을 벗어나면 예약된 것을 바로 올린다 */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden" && syncT) syncNow(true);
});

function syncLink(){
  var tokEl = $("#syncTok"), gidEl = $("#syncGist");
  var tk  = (tokEl ? tokEl.value : "").trim();
  var gid = (gidEl ? gidEl.value : "").trim();
  if(!tk){ toast("GitHub 토큰을 입력하세요"); return; }
  sync.token = tk;

  if(gid){
    /* Gist 주소를 통째로 붙여 넣어도 ID 만 뽑아 쓴다 */
    var m = gid.match(/[0-9a-f]{20,}/i) || gid.match(/[0-9a-f]{7,}/i);
    sync.gistId = m ? m[0] : gid;
    sync.last = 0; saveSync(); render();
    syncNow(false);
    return;
  }

  /* ID 를 비워 두고 연결하면, 무턱대고 새로 만들지 않고 계정에 이미 있는
     진도 Gist 를 먼저 찾는다. 기기마다 새 Gist 가 생겨 서로 다른 곳을
     바라보는 사고를 막기 위한 것이다. */
  syncStatus("이미 있는 Gist 를 찾는 중…");
  ghReq("GET", "/gists?per_page=100", null, function(list){
    var hits = [];
    if(list && list.length){
      for(var i=0;i<list.length;i++){
        var g = list[i];
        if(g && g.files && g.files[SYNC_FILE]) hits.push(g);
      }
    }
    if(hits.length){
      hits.sort(function(a,b){ return (b.updated_at||"") < (a.updated_at||"") ? -1 : 1; });
      sync.gistId = hits[0].id; sync.last = 0; saveSync(); render();
      toast(hits.length > 1
        ? "진도 Gist 가 " + hits.length + "개 있습니다 · 가장 최근 것에 연결했습니다"
        : "이미 있는 Gist 에 연결했습니다");
      syncNow(false);
      return;
    }
    syncCreate();
  }, function(m){
    syncStatus("실패: " + m);
    toast("연결 실패 · " + m);
  });
}

function syncCreate(){
  syncStatus("Gist 를 만드는 중…");
  var body = { description:"DAP 문제은행 진도", public:false, files:{} };
  body.files[SYNC_FILE] = { content: payloadText() };
  ghReq("POST", "/gists", body, function(g){
    sync.gistId = g.id || "";
    sync.last = Date.now(); saveSync();
    syncStatus(""); render();
    toast("Gist 를 새로 만들었습니다 · 다른 기기에 이 ID 를 넣으세요");
  }, function(m){
    syncStatus("실패: " + m);
    toast("연결 실패 · " + m);
  });
}

function syncUnlink(){
  if(!confirm("이 브라우저에 저장된 토큰과 Gist 연결을 지웁니다.\n" +
              "Gist 자체와 학습 기록은 그대로 남습니다.\n\nGist ID: " + sync.gistId)) return;
  sync = { token:"", gistId:"", last:0, auto:true };
  saveSync();
  if(syncT){ clearTimeout(syncT); syncT = null; }
  render();
  toast("동기화 연결을 해제했습니다");
}

/* 설정 화면의 동기화 카드 */

        '<input type="checkbox" id="syncAuto"'+(sync.auto ? ' checked' : '')+'>'+
        '앱을 열 때, 그리고 기록이 바뀌고 '+Math.round(SYNC_WAIT/1000)+'초 뒤에 자동으로 동기화</label>'+
      '<p class="note" style="margin-top:12px">다른 기기에서는 같은 토큰과 위 Gist ID 를 넣어 연결하세요.</p>';
  }else{
    h += '<div style="display:flex;gap:14px;flex-wrap:wrap">'+
      '<label class="field" style="flex:2 1 260px">GitHub 토큰 (gist 권한)'+
        '<input type="password" id="syncTok" placeholder="ghp_..." autocomplete="off" spellcheck="false"></label>'+
      '<label class="field" style="flex:1 1 200px">Gist ID (비우면 자동으로 찾음)'+
        '<input type="text" id="syncGist" placeholder="비워 두면 기존 것을 찾아 연결" autocomplete="off" spellcheck="false"></label>'+
      '</div>'+
      '<p class="note" id="syncMsg" style="margin-top:8px;min-height:1.2em">'+esc(syncMsg)+'</p>'+
      '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-act="synclink">연결</button></div>'+
      '<p class="note" style="margin-top:12px"><strong>토큰 만들기</strong> — <span class="mono">github.com/settings/tokens</span> 에서 classic 토큰을 만들고 <span class="mono">gist</span> 권한 하나만 체크하세요. 만료일을 함께 지정하는 것을 권합니다.</p>'+
      '<p class="note" style="margin-top:6px"><strong>Gist ID 는 비워 두어도 됩니다.</strong> 계정에 이미 만들어 둔 진도 Gist 가 있으면 그것을 찾아 연결하고, 없을 때만 새로 만듭니다. 두 기기가 서로 다른 Gist 를 보게 되는 것을 막으려면, 다른 기기에 표시된 ID 를 그대로 넣는 것이 가장 확실합니다.</p>'+
      '<p class="note" style="margin-top:6px">토큰은 이 브라우저에만 저장되며 진도 파일에는 포함되지 않습니다. 공용 PC 에서는 연결하지 마세요.</p>';
  }
  return h + '</div>';
}

function pick(i){
  var q = QMAP[session.ids[session.idx]];
  if(!session) return;
  if(session.mode==="study" && session.revealed[q.id]) return;
  session.ans[q.id] = i; save();
  if(session.mode==="study") reveal(); else render();
}
function reveal(){
  var q = QMAP[session.ids[session.idx]];
  if(session.ans[q.id]===undefined || session.revealed[q.id]) return;
  session.revealed[q.id] = true;
  record(q.id, session.ans[q.id]===q.a);
  save(); render();
}
function nextQ(){
  if(session.idx < session.ids.length-1){ session.idx++; save(); render(); }
  else if(session.mode==="exam"){ toast("마지막 문항입니다 · 제출 버튼으로 채점하세요"); }
  else {
    var n = session.ids.filter(function(id){ return session.revealed[id]; }).length;
    var ok = session.ids.filter(function(id){ return session.revealed[id] && session.ans[id]===QMAP[id].a; }).length;
    endSession();
    toast("학습 완료 · "+ok+"/"+n+" 정답");
    go("dash");
  }
}

document.addEventListener("keydown", function(e){
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.tagName==="SELECT") return;
  if(view.name!=="quiz" || !session) return;
  var q = QMAP[session.ids[session.idx]];
  if(e.key>="1" && e.key<="4"){ e.preventDefault(); pick(+e.key-1); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); if(session.idx<session.ids.length-1){session.idx++;save();render();} return; }
  if(e.key==="ArrowLeft"){ e.preventDefault(); if(session.idx>0){session.idx--;save();render();} return; }
  if(e.key==="Enter"){
    e.preventDefault();
    if(session.mode==="study" && session.ans[q.id]!==undefined && !session.revealed[q.id]) reveal();
    else nextQ();
    return;
  }
  if(e.key==="b"||e.key==="B"){ e.preventDefault();
    if(S.bookmarks[q.id]) delete S.bookmarks[q.id]; else S.bookmarks[q.id]=true; save(); render(); return; }
  if(e.key==="e"||e.key==="E"){ e.preventDefault();
    if(session.mode==="study" && session.ans[q.id]!==undefined) reveal(); return; }
});

/* ─────────── 타이포그래피 ─────────── */
function applyTypography(){
  var f = FONT_MAP[S.settings.fontId] || FONTS[0];
  var r = document.documentElement;
  r.style.setProperty("--font-ui", f.stack);
  r.style.setProperty("--fs", String(S.settings.fontScale));
}
function setFont(id){
  var f = FONT_MAP[id]; if(!f) return;
  S.settings.fontId = f.id; S.settings.fontStack = f.stack;
  applyTypography(); save();
}
/* 글자 크기 변경 후 설정 화면만 살짝 갱신 (스크롤 위치 유지) */
function render_fs(v){
  var lbl = $("#fsVal"), bar = $("#fsBar");
  if(lbl) lbl.textContent = Math.round(v*100)+"%";
  if(bar) bar.value = v;
  $$('[data-act="fsup"]').forEach(function(b){ b.disabled = v >= FS_MAX; });
  $$('[data-act="fsdown"]').forEach(function(b){ b.disabled = v <= FS_MIN; });
}
function setFontScale(v){
  v = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, v)) * 100) / 100;
  S.settings.fontScale = v;
  applyTypography(); save();
  return v;
}

/* ─────────── 상단 브랜드 라벨 ─────────── */
function applyBrand(){
  var n = DAP.questions.length,
      sub = n + " Q · " + DAP.sets.length + " SETS · " + CHLIST.length + " CH";
  var el;
  if((el = $("#brandSub"))) el.textContent = sub;
  if((el = $("#brandName"))) el.textContent = "DAP 문제은행";
  if((el = $("#brandTop")))  el.textContent = "DAP 문제은행 " + n;
  document.title = "DAP 문제은행 " + n;
}

/* 테마 */
function applyTheme(){
  var t = S.settings.theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
$("#themeBtn").addEventListener("click", function(){
  var order = ["auto","light","dark"];
  S.settings.theme = order[(order.indexOf(S.settings.theme)+1)%3];
  applyTheme(); save();
  toast("테마: "+({auto:"시스템 설정",light:"라이트",dark:"다크"})[S.settings.theme]);
});
$("#resetHint").addEventListener("click", function(){ go("settings"); });
$("#mnav").addEventListener("click", function(){ $("#rail").classList.toggle("open"); });

window.addEventListener("beforeunload", function(){
  if(session && session.key){ session.ts = Date.now(); S.sessions[session.key] = session; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
});

if(S.settings.bank && bankById(S.settings.bank)) useBank(S.settings.bank);
applyTheme();
applyTypography();
applyBrand();
restoreFileHandle();
render();
if(syncOn() && sync.auto) syncNow(true);
};
</script>
