/* ═══════════ 잠긴 문제은행 묶음 ═══════════
   외부에서 가져온 문항은 평문으로 배포하지 않는다. AES-GCM 으로 암호화한
   파일만 저장소에 올리고, 앱에서 암호를 받아 그때 풀어서 쓴다.
   암호는 앱에서 직접 정한다 — 소스 어디에도 적혀 있지 않다.

   주의: WebCrypto 는 보안 컨텍스트에서만 동작한다. https 로 연 배포본과
   localhost 에서는 되고, file:// 로 연 로컬 파일에서는 되지 않는다. */
var LOCK_KEY = "dap750:lock";     /* 기억해 둔 암호 (묶음 id 별) */
var PBKDF2_ROUNDS = 200000;

function cryptoOK(){
  return !!(window.crypto && window.crypto.subtle && window.isSecureContext);
}
function b64enc(buf){
  var b = new Uint8Array(buf), s = "";
  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64dec(str){
  var s = atob(str), b = new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return b;
}
function loadLocks(){
  try{ return JSON.parse(localStorage.getItem(LOCK_KEY) || "{}"); }catch(e){ return {}; }
}
function saveLocks(o){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(o)); }catch(e){} }

/* 암호 → 키 */
function deriveKey(pw, salt){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:PBKDF2_ROUNDS, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
    });
}

function encryptPacks(packsArr, pw){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv   = crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw, salt).then(function(key){
    var body = new TextEncoder().encode(JSON.stringify(packsArr));
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, body);
  }).then(function(ct){
    return { salt:b64enc(salt), iv:b64enc(iv), data:b64enc(ct) };
  });
}

function decryptBlob(blob, pw){
  return deriveKey(pw, b64dec(blob.salt)).then(function(key){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64dec(blob.iv) }, key, b64dec(blob.data));
  }).then(function(pt){
    return JSON.parse(new TextDecoder().decode(pt));
  });
}

/* 잠긴 묶음을 풀어 실제 문제은행으로 바꾼다 */
function unlockBank(bank, pw, ok, err){
  if(!cryptoOK()){
    err("이 브라우저에서는 복호화를 쓸 수 없습니다. https 주소로 열어 주세요.");
    return;
  }
  var got = [];
  var i = 0;
  (function step(){
    if(i >= bank.blobs.length){
      var built = window.DAP_BUILD(window.DAP_MF,
        { id:bank.id, name:bank.name, note:bank.note }, got);
      if(!built.questions.length){ err("복호화는 됐지만 문항이 없습니다."); return; }
      built.wasLocked = true;
      for(var k=0;k<BANKS.length;k++) if(BANKS[k].id === bank.id) BANKS[k] = built;
      BANK_OF_Q = null; stampExamBanks();   /* 이제 이 묶음의 응시 기록을 가려낼 수 있다 */
      ok(built);
      return;
    }
    decryptBlob(bank.blobs[i], pw).then(function(arr){
      (Array.isArray(arr) ? arr : [arr]).forEach(function(p){ got.push(p); });
      i++; step();
    }, function(){ err("암호가 맞지 않습니다."); });
  })();
}

/* 묶음을 고를 때 잠겨 있으면 암호를 받는다 */
function openBank(id){
  var b = bankById(id);
  if(!b) return;
  if(!b.locked){ switchBank(id); return; }

  var locks = loadLocks();
  var pw = locks[id];
  if(pw){
    unlockBank(b, pw, function(){ switchBank(id); },
      function(m){ delete locks[id]; saveLocks(locks); toast(m + " 다시 입력하세요."); askPw(b); });
    return;
  }
  askPw(b);
}

function askPw(b){
  var pw = prompt(b.name + " 묶음은 암호로 잠겨 있습니다.\n암호를 입력하세요.");
  if(pw === null){ renderBankBox(); return; }   /* 취소 — 선택 상자를 원래대로 */
  if(!pw){ toast("암호를 입력하세요"); renderBankBox(); return; }
  toast("여는 중…");
  unlockBank(b, pw, function(){
    var locks = loadLocks(); locks[b.id] = pw; saveLocks(locks);
    switchBank(b.id);
  }, function(m){
    toast(m);
    renderBankBox();
  });
}

/* 평문 팩 → 암호화 파일 만들기 (설정 화면) */
function makeEncryptedPack(){
  if(!cryptoOK()){
    toast("https 주소로 열어야 암호화를 쓸 수 있습니다");
    return;
  }
  var fi = $("#packIn");
  if(fi){ fi.value = ""; fi.click(); }
}

function handlePackFile(file){
  var r = new FileReader();
  r.onerror = function(){ toast("파일을 읽지 못했습니다"); };
  r.onload = function(){
    var arr;
    try{
      arr = JSON.parse(String(r.result));
      if(!Array.isArray(arr)) arr = [arr];
      var n = 0;
      arr.forEach(function(p){
        if(!p || !p.questions || !p.questions.length) throw 0;
        n += p.questions.length;
      });
      if(!n) throw 0;
      var colId = ($("#packCol") && $("#packCol").value) || "practice";
      var pw  = prompt("이 팩을 잠글 암호를 정하세요.\n12자 이상을 권합니다. 잊으면 되살릴 수 없습니다.");
      if(!pw) { toast("취소했습니다"); return; }
      var pw2 = prompt("확인을 위해 한 번 더 입력하세요.");
      if(pw !== pw2){ toast("두 번 입력한 암호가 다릅니다"); return; }

      toast("암호화하는 중…");
      encryptPacks(arr, pw).then(function(blob){
        var js = "/*! 암호화된 문제은행 팩 — 평문이 아니므로 그대로 커밋해도 된다.\n" +
                 " *  묶음: " + colId + " · 문항 " + n + "개 · AES-GCM / PBKDF2-SHA256 " +
                 PBKDF2_ROUNDS + "회\n */\n" +
                 "DAP_BANK.addEncrypted(" + JSON.stringify({
                   collection: colId, salt: blob.salt, iv: blob.iv, data: blob.data
                 }) + ");\n";
        var bl = new Blob([js], { type:"application/javascript;charset=utf-8" });
        var url = URL.createObjectURL(bl);
        var a = document.createElement("a");
        a.href = url; a.download = colId + ".enc.js"; a.style.display = "none";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        var locks = loadLocks(); locks[colId] = pw; saveLocks(locks);
        toast(colId + ".enc.js 를 저장했습니다 · data/ 에 넣고 manifest 에 추가하세요");
      }, function(){ toast("암호화에 실패했습니다"); });
    }catch(e){ toast("팩 형식이 아닙니다 · [{chapter,pack,questions:[…]}] 이어야 합니다"); }
  };
  r.readAsText(file);
}

function forgetPw(id){
  var locks = loadLocks();
  if(!locks[id]){ toast("기억된 암호가 없습니다"); return; }
  delete locks[id]; saveLocks(locks);
  toast("기억된 암호를 지웠습니다 · 다음에 다시 물어봅니다");
  render();
}

        '<td class="num"><button class="btn btn-sm" data-act="openexam" data-id="'+e.id+'">리포트</button></td>'+
        '<td class="num"><button class="btn btn-sm btn-danger" data-act="delexam" data-id="'+e.id+'" title="이 응시 기록을 삭제">삭제</button></td></tr>';
    });
    h += '</tbody></table></div>';
    if(pages>1){
      h += '<div class="btn-row" style="padding:12px 16px;justify-content:space-between;align-items:center">'+
           '<button class="btn btn-sm" data-act="exampage" data-p="'+(examPage-1)+'"'+(examPage===0?' disabled':'')+'>← 이전</button>'+
           '<span class="eyebrow">'+(examPage+1)+' / '+pages+' 쪽</span>'+
           '<button class="btn btn-sm" data-act="exampage" data-p="'+(examPage+1)+'"'+(examPage===pages-1?' disabled':'')+'>다음 →</button></div>';
    }
    h += '</div>';
  }

  h += '<p class="note" style="margin-top:18px">배점 구성은 시험 구성표('+TOTAL_Q+'문항 · '+TOTAL_SCORE+'점 · 문항당 '+PER_Q+'점)를 그대로 따릅니다. '+
       '실제 DAP 자격시험의 합격 기준은 필기·실기 총 100점 만점에 75점 이상, 과목별 40% 미만 과락입니다(한국데이터산업진흥원 기준). '+
       '앱의 목표 점수는 설정에서 바꿀 수 있습니다.</p>';
  return h;
}
function tile(k,v,s){ return '<div class="tile"><span class="tile-k">'+k+'</span><span class="tile-v mono">'+v+'</span><span class="tile-s">'+esc(s)+'</span></div>'; }
function launch(ico,t,d,go){ return '<button class="launch-card" data-go="'+go+'"><span class="launch-t"><span style="color:var(--accent)">'+ico+'</span>'+t+'</span><span class="launch-d">'+d+'</span></button>'; }
function verdictChip(e){
  var target = S.settings.target;
  var fail = e.byCh && CHLIST.some(function(c){ var b=e.byCh[c.id]; return b && pct(b.correct,b.count) < 40; });
  if(fail) return '<span class="chip chip-bad">과락</span>';
  return e.score >= target ? '<span class="chip chip-ok">합격권</span>' : '<span class="chip">미달</span>';
}
/* 과목별 오답 비중 — 누적 오답이 어느 과목에 몰려 있는지 한눈에 본다.
   조각 크기는 "전체 오답 중 이 과목의 몫"이지, 과목 안의 오답률이 아니다.
   문항 수가 과목마다 다르므로 범례에 과목 내 오답률도 함께 적는다. */
function wrongMix(){
  var rows = CHLIST.map(function(c, i){
    return { ch:c.id, name:c.name, wrong:0, tries:0, color:"var(--c"+((i%6)+1)+")" };
  });
  var by = {}; rows.forEach(function(r){ by[r.ch] = r; });
  DAP.questions.forEach(function(q){
    var s = st(q.id), r = by[q.ch];
    if(!s || !r) return;
    r.wrong += s.wrong; r.tries += s.wrong + s.right;
  });
  return rows;
}
function wrongPie(){
  var rows = wrongMix(), total = rows.reduce(function(a,r){ return a + r.wrong; }, 0);
  var h = '<div class="card"><div class="sec-head"><span class="sec-title">과목별 오답 비중</span>'+
          '<span class="eyebrow">누적 오답 '+total+'건</span></div>';
  if(!total){
    return h + '<div class="empty"><b>아직 오답 데이터가 없습니다</b>문항을 풀면 과목별 오답 비중이 그려집니다.</div></div>';
  }
  var r = 54, cx = 70, cy = 70, C = 2*Math.PI*r, off = 0, seg = "";
  rows.forEach(function(row){
    if(!row.wrong) return;
    var len = C * row.wrong / total;
    seg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+row.color+'" stroke-width="26"'+
           ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'">'+
           '<title>'+esc(row.ch+". "+row.name)+' · '+row.wrong+'건 ('+pct(row.wrong,total)+'%)</title></circle>';
    off += len;
  });
  var top = rows.slice().sort(function(a,b){ return b.wrong - a.wrong; })[0];
  h += '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:14px 16px">'+
    '<svg viewBox="0 0 140 140" style="width:150px;height:150px;flex:none;transform:rotate(-90deg)" role="img" aria-label="과목별 오답 비중">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="26"/>'+ seg +
    '</svg>'+
    '<div style="flex:1;min-width:200px">';
  rows.slice().sort(function(a,b){ return b.wrong - a.wrong; }).forEach(function(row){
    h += '<div class="pie-leg">'+
      '<span style="width:10px;height:10px;border-radius:2px;flex:none;background:'+(row.wrong?row.color:"var(--line)")+'"></span>'+
      '<button data-go="chapter" data-ch="'+row.ch+'" style="text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
        '<span class="mono" style="color:var(--muted)">'+row.ch+'</span> '+esc(row.name)+'</button>'+
      '<span class="meter-pct" title="과목 내 오답률 '+(row.tries? pct(row.wrong,row.tries)+"%" : "–")+'">'+
        pct(row.wrong,total)+'% <span style="color:var(--muted)">('+row.wrong+'건)</span></span></div>';
  });
  h += '</div></div>';
  if(top && top.wrong) h += '<p class="note" style="padding:0 16px 14px">오답이 가장 많이 쌓인 과목은 <strong>'+top.ch+'. '+esc(top.name)+
       '</strong>입니다 — 전체 오답의 '+pct(top.wrong,total)+'%. 백분율은 전체 오답 대비 몫이고, 괄호 안은 누적 오답 건수입니다.</p>';
  return h + '</div>';
}
function sparkline(){
  var rows = examsAsc().slice(-12);
  if(rows.length<2) return "";
  var w=100, hh=34, max=60;
  var pts = rows.map(function(e,i){
    var x = rows.length===1?0:(i/(rows.length-1))*w;
    var y = hh - (e.score/max)*hh;
    return x.toFixed(2)+","+y.toFixed(2);
  });
  var area = "0,"+hh+" "+pts.join(" ")+" "+w+","+hh;
  var lx = pts[pts.length-1].split(",");
  return '<div style="padding:12px 16px 4px"><svg viewBox="0 0 100 34" preserveAspectRatio="none" style="width:100%;height:56px;display:block" aria-label="최근 모의고사 점수 추이">'+
    '<line x1="0" y1="'+(hh-(S.settings.target/max)*hh).toFixed(2)+'" x2="100" y2="'+(hh-(S.settings.target/max)*hh).toFixed(2)+'" stroke="var(--line-strong)" stroke-width=".4" stroke-dasharray="1.6 1.6"/>'+
    '<polygon points="'+area+'" fill="var(--accent-soft)"/>'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="1.1" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+lx[0]+'" cy="'+lx[1]+'" r="1.6" fill="var(--accent)"/></svg>'+
    '<div class="eyebrow" style="display:flex;justify-content:space-between;padding-top:2px"><span>점수 추이 (60점 만점)</span><span>목표선 '+S.settings.target+'점</span></div></div>';
}

/* 아직 가려내지 못한 예전 기록은 기본 묶음 것으로 본다. 묶음 기능이 생기기
   전에는 묶음이 하나뿐이었다. 잠긴 묶음을 열면 stampExamBanks 가 제자리를 찾아 준다. */
function examBank(e){ return e.bank || BANKS[0].id; }
/* 응시 기록은 지금 묶음 것만, 저장 순서가 아니라 실제 응시 시각 순으로 본다 */
function examsAsc(){
  return S.exams.filter(function(e){ return examBank(e)===DAP.id; })
                .sort(function(a,b){ return a.ts-b.ts; });
}
function examsRecent(n){ var a = examsAsc().reverse(); return n ? a.slice(0,n) : a; }
/* 응시 이력 표는 한 쪽에 12회씩 끊어 보여 준다. 이력이 쌓여도 예전 회차를 찾아갈 수 있어야 한다. */
var EXAM_PAGE = 12, examPage = 0;
/* 리포트에서 문항 번호를 매기려면 출제 순서가 필요하다.
   예전 기록에는 ids 가 없으므로 세트 구성 → 응답 키 순으로 되짚는다. */
function examIds(e){
  if(e.ids && e.ids.length) return e.ids;
  if(e.setNo && (!e.bank || e.bank===DAP.id) && DAP.sets[e.setNo-1]) return DAP.sets[e.setNo-1];
  return Object.keys(e.answers||{});
}

  }
  h += '<div class="btn-row">'+
    (saved? '' : '<button class="btn btn-primary" data-act="startch" data-ch="'+ch+'" data-range="all">전체 '+c.count+'문항 풀기</button>')+

  /* 블록 목록 — 블록 크기는 과목마다 다르다 (시험 출제 단위의 정수배) */

}

function reviewCard(id, showRemove){

    (focus? '<span class="chip chip-bad">집중 관리 · '+s.wrong+'회 오답</span>' : (s.wrong? '<span class="chip chip-bad">'+s.wrong+'회 오답</span>':''))+

/* ─────────── 뷰: 복습 큐 ─────────── */
function viewReview(){
  var due = dueIds();
  var upcoming = Object.keys(S.stats).filter(function(id){ return QMAP[id] && S.stats[id].due > Date.now(); })
    .sort(function(a,b){ return S.stats[a].due - S.stats[b].due; });
  var h = '<div class="page-head"><div><div class="eyebrow">Spaced Repetition</div><h1 class="page-title">복습 큐</h1>'+
    '<p class="page-desc">맞히면 복습 간격이 1 → 2 → 4 → 8 → 16 → 35일로 늘어나고, 틀리면 즉시 처음으로 돌아옵니다. 시험 직전까지 잊을 만할 때만 다시 만나도록 배치합니다.</p></div>'+
    (due.length? '<div class="btn-row"><button class="btn btn-primary" data-act="startdue">'+due.length+'문항 복습 시작</button></div>':'')+'</div>';

  h += '<div class="tiles">'+
    tile("오늘 복습", due.length, "지금 풀 문항")+
    tile("예정", upcoming.length, "간격 대기 중")+
    tile("정착 단계", Object.keys(S.stats).filter(function(id){return S.stats[id].box>=5;}).length, "박스 5단계 이상")+

/* ─────────── 세션 ─────────── */
/* 세션은 키별로 따로 저장된다. 같은 키로 다시 들어오면 마지막에 멈춘 다음 문항부터 이어진다. */
function solvedCount(s){
  var done = s.mode==="exam" ? s.ans : s.revealed;
  return s.ids.filter(function(id){ return done[id]!==undefined; }).length;
}
/* 순차 학습 세션(과목 전체·블록)은 세션 안의 응답이 아니라 전체 풀이 기록(S.stats)
   을 기준으로 위치를 잡는다. S.stats 는 문항 id 로 관리되고 Gist 로 동기화되므로,
   어느 기기에서 어느 버튼으로 들어와도 마지막에 푼 다음 문항에서 이어진다.
   오답노트·복습 큐·모의고사처럼 이미 푼 문항을 일부러 다시 푸는 세션은 제외한다. */
function firstUnsolved(s){
  var done = s.mode==="exam" ? s.ans : s.revealed;
  var seq  = !!s.seq;
  for(var i=0;i<s.ids.length;i++){
    var id = s.ids[i];
    if(done[id]===undefined && !(seq && st(id))) return i;
  }
  return Math.min(s.idx, s.ids.length-1);
}
/* 이미 푼 문항의 선택지를 세션에 채워 넣는다. 다른 기기에서 고른 보기도
   S.stats.pick 으로 동기화되므로 그대로 보인다.
   순차 학습 세션에만 적용한다 — 오답노트·복습 큐·모의고사는 다시 풀려고
   들어가는 곳이라 답을 미리 채워 넣으면 안 된다. */
function hydrate(s){
  if(!s || !s.seq || s.mode==="exam") return 0;
  var n = 0;
  s.ids.forEach(function(id){
    if(s.ans[id] !== undefined) return;
    var t = S.stats[id];
    if(!t || t.pick === undefined || t.pick === null) return;
    s.ans[id] = t.pick; s.revealed[id] = true; n++;
  });
  return n;
}
function liveSessions(){
  var pre = DAP.id + "/";
  return Object.keys(S.sessions)
    .filter(function(k){ return k.indexOf(pre) === 0; })
    .map(function(k){ return S.sessions[k]; })
    .filter(function(s){ return s && s.ids && s.ids.length && !s.submitted && solvedCount(s) < s.ids.length; })
    .sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
}
function savedSession(key){
  var s = S.sessions[skey(key)];
  if(!s || !s.ids || !s.ids.length || s.submitted) return null;
  return solvedCount(s) < s.ids.length ? s : null;
}
function touch(){ if(session){ session.ts = Date.now(); S.sessions[session.key] = session; } save(); }

function startSession(cfg){
  var raw = cfg.key || ("adhoc:"+Date.now());
  var key = skey(raw);
  var prev = cfg.fresh ? null : savedSession(raw);
  if(prev){
    session = prev;
    session.title = cfg.title || session.title;
    session.seq = !!cfg.seq;
    hydrate(session);
    session.idx = firstUnsolved(session);
    session.start = Date.now() - (session.spent||0)*1000;
    touch(); go("quiz");
    toast("이어서 풀기 · "+(session.idx+1)+"번 문항부터");
    return;
  }
  session = {
    key: key, mode: cfg.mode, title: cfg.title, ids: cfg.ids, idx: 0,
    ans: {}, revealed: {}, flags: {}, start: Date.now(), ts: Date.now(),
    limitSec: cfg.limitSec || 0, setNo: cfg.setNo || 0, submitted: false, spent: 0,
    seq: !!cfg.seq
  };
  /* 세션이 없어도(다른 기기에서 풀었거나 다른 버튼으로 풀었어도) 기록이 있으면
     그 다음 문항에서 시작한다. [처음부터 다시]는 fresh 로 이 처리를 건너뛴다. */
  if(session.seq && !cfg.fresh){
    hydrate(session);
    session.idx = firstUnsolved(session);
    if(session.idx > 0) toast("이어서 풀기 · "+(session.idx+1)+"번 문항부터");
  }
  S.sessions[key] = session; save();
  go("quiz");
}
/* 어느 키가 순차 학습 세션인가. 옛 세션에는 seq 표시가 없어서 키로 되짚는다. */
function isSeqKey(fullKey){
  var raw = fullKey.indexOf("/") >= 0 ? fullKey.slice(fullKey.indexOf("/")+1) : fullKey;
  return /^ch\d+:(all|unseen|b\d+)$/.test(raw);
}
/* 대시보드 이어풀기 목록은 세션 객체의 key 를 그대로 넘긴다. 이미 묶음 접두사가
   붙은 완성된 키이므로 skey() 를 다시 씌우면 안 된다 — core/core/ch1:b25 가 되어
   찾지 못하고, 버튼이 아무 반응도 하지 않는다. */
function resumeSession(fullKey){
  var s = S.sessions[fullKey];
  if(!s || !s.ids || !s.ids.length || s.submitted) return;
  if(solvedCount(s) >= s.ids.length) return;
  session = s;
  if(session.seq === undefined) session.seq = isSeqKey(fullKey);
  hydrate(session);
  session.idx = firstUnsolved(session);
  session.start = Date.now() - (session.spent||0)*1000;
  touch(); go("quiz");
}
function endSession(){
  if(session) delete S.sessions[session.key];
  session=null; save();
}
/* 세션 전체를 다 푼 뒤에도 기록은 남기지 않고 정리한다 */
function dropSession(key){ delete S.sessions[key]; save(); }
/* 나가기 — 진도는 그대로 두고 화면만 벗어난다 */
function leaveSession(){
  if(!session) return go("dash");
  var done = solvedCount(session), tot = session.ids.length, nx = firstUnsolved(session)+1;
  session.idx = nx-1; save();
  session = null; go("dash");
  toast(done<tot ? done+"/"+tot+" 문항까지 저장 · 다음에 "+nx+"번부터 이어집니다" : "저장했습니다");
}

function chapterIds(ch, range){
  var qs = DAP.questions.filter(function(q){ return q.ch===ch; });
  if(range==="unseen") qs = qs.filter(function(q){ return !st(q.id); });
  if(range==="wrong")  qs = qs.filter(function(q){ return S.wrong[q.id]; });
  if(range==="rand25") qs = shuffle(qs).slice(0, blockSize(ch));
  return qs.map(function(q){ return q.id; });
}
function randomExamIds(){
  var ids=[];
  CHLIST.forEach(function(c){
    var pool = DAP.questions.filter(function(q){ return q.ch===c.id; });
    ids = ids.concat(shuffle(pool).slice(0,c.perSet).map(function(q){ return q.id; }));
  });
  return ids;
}

/* ─────────── 뷰: 퀴즈 ─────────── */
function viewQuiz(){
  var q = QMAP[session.ids[session.idx]];
  var isExam = session.mode==="exam";
  var picked = session.ans[q.id];
  var revealed = !isExam && session.revealed[q.id];
  var answered = Object.keys(session.ans).length;

  var h = '<div class="page-head" style="margin-bottom:14px"><div>'+
    '<div class="eyebrow">'+(isExam?"실전 모드 · 제출 후 채점":"학습 모드 · 즉시 해설")+'</div>'+
    '<h1 class="page-title" style="font-size:calc(20px * var(--fs))">'+esc(session.title)+'</h1></div>'+
    '<div class="btn-row"><button class="btn btn-sm" data-act="quit">나가기</button>'+
    (isExam? '<button class="btn btn-sm btn-primary" data-act="submit">제출하고 채점</button>':'')+'</div></div>';

  h += '<div class="quizbar">'+
    '<span class="chip mono">'+(session.idx+1)+' / '+session.ids.length+'</span>'+
    '<span class="progress"><i style="width:'+pct(answered, session.ids.length)+'%"></i></span>'+
    '<span class="chip mono">응답 '+answered+'</span>'+
    (session.limitSec? '<span class="timer mono" id="timer">--:--</span>' : '')+
  '</div>';

  h += '<div class="qcard"><div class="qhead">'+
    '<span class="chip mono">'+q.id+'</span>'+
    '<span class="chip chip-accent">'+q.ch+'. '+esc(CH[q.ch].name)+'</span>'+
    '<span class="chip">'+esc(q.s)+'</span>'+
    (st(q.id)&&st(q.id).wrong>=3? '<span class="chip chip-bad">집중 관리</span>':'')+
    '<span class="spacer"></span>'+
    '<button class="icon-btn'+(S.bookmarks[q.id]?" on":"")+'" data-act="mark" title="북마크 (B)">'+(S.bookmarks[q.id]?"★":"☆")+'</button>'+
    (isExam? '<button class="icon-btn'+(session.flags[q.id]?" on":"")+'" data-act="flag" title="나중에 다시 보기">⚑</button>':'')+
  '</div>';

  h += '<div class="qbody"><div class="qtext">'+rich(q.q)+'</div>'+
    (q.m && !revealed? '<div class="note" style="margin-top:8px"><span class="chip chip-key">복수 선택</span> 해당하는 보기를 모두 고른 뒤 '+(isExam? '다음 문항으로 넘어가세요' : '채점(Enter)을 누르세요')+'</div>' : '')+
    '</div>';

  h += '<div class="opts">';
  q.c.forEach(function(txt,i){
    var cls = "opt";
    if(revealed){
      if(isAns(q,i)) cls += " correct";
      else if(hasPick(picked,i)) cls += " wrong";
    }else if(hasPick(picked,i)) cls += " sel";
    h += '<button class="'+cls+'" data-act="pick" data-i="'+i+'" data-q="'+esc(q.id)+'"'+(revealed?" disabled":"")+'>'+
      '<span class="opt-n">'+(i+1)+'</span><span class="opt-txt">'+rich(txt)+'</span></button>';
  });
  h += '</div>';

  if(revealed){
    var ok = isRight(q, picked);
    h += '<div class="explain"><div class="explain-h">'+
      (ok? '<span class="chip chip-ok">정답</span>' : '<span class="chip chip-bad">오답</span>')+
      '<span class="eyebrow">해설</span>'+
      (!ok && (q.m || Array.isArray(q.a))? '<span class="note">정답 '+numText(q.a)+(q.m? ' 모두' : ' 중 하나')+'</span>' : '')+
      '</div>'+
      '<div class="explain-b">'+rich(q.e)+'</div>'+srcLine(q)+'</div>';
  }

  h += '<div class="qfoot">'+
    '<button class="btn btn-sm" data-act="prev"'+(session.idx===0?" disabled":"")+'>← 이전</button>'+
    '<button class="btn btn-sm" data-act="next">'+(session.idx===session.ids.length-1?"마지막 문항":"다음 →")+'</button>'+
    (!isExam && picked!==undefined && !revealed? '<button class="btn btn-sm btn-primary" data-act="reveal">채점 (Enter)</button>':'')+
    '<span class="spacer"></span>'+
    '<span class="note"><span class="kbd">1</span>–<span class="kbd">'+q.c.length+'</span> 선택 · <span class="kbd">Enter</span> 진행</span>'+
  '</div></div>';

  /* 네비게이터 */
  h += '<div class="card" style="margin-top:16px"><div class="sec-head"><span class="sec-title">문항 이동</span>'+
    '<span class="eyebrow">'+(isExam?"응답 / 표시":"정답 / 오답")+'</span></div><div class="navgrid">';
  session.ids.forEach(function(id,i){
    var cls = "navdot";
    if(i===session.idx) cls += " cur";
    if(session.flags[id]) cls += " flag";
    if(isExam){ if(session.ans[id]!==undefined) cls += " answered"; }
    else if(session.revealed[id]) cls += (isRight(QMAP[id], session.ans[id]) ? " ok" : " no");
    else if(session.ans[id]!==undefined) cls += " answered";
    h += '<button class="'+cls+'" data-act="jump" data-i="'+i+'">'+(i+1)+'</button>';
  });
  h += '</div></div>';
  return h;
}

/* ─────────── 채점 ─────────── */
function submitExam(){
  if(session.submitted) return;
  var byCh = {}, correct = 0;
  CHLIST.forEach(function(c){ byCh[c.id] = { count:0, correct:0 }; });
  session.ids.forEach(function(id){
    var q = QMAP[id], picked = session.ans[id];
    var ok = isRight(q, picked);
    byCh[q.ch].count++;
    if(ok){ byCh[q.ch].correct++; correct++; }
    record(id, ok, picked);
  });
  var dur = Math.round((Date.now()-session.start)/1000);
  var rec = {
    id: "E"+Date.now(), ts: Date.now(), bank: DAP.id, title: session.title, setNo: session.setNo,
    count: session.ids.length, correct: correct,
    score: Math.round(correct*PER_Q*10)/10, dur: dur, byCh: byCh,
    ids: session.ids.slice(),
    answers: session.ans
  };
  S.exams.push(rec);
  if(S.exams.length>60) S.exams = S.exams.slice(-60);
  session.submitted = true;
  endSession();
  save();
  go("result", { examId: rec.id });
}

/* ─────────── 정답 정정 반영 ─────────── */
/* 문항의 정답(q.a)을 바로잡으면 이미 낸 응시의 점수·과목별 집계는 제출 당시 값으로
   남는다. 리포트의 문항별 정오답은 q.a 로 그때그때 그리므로 둘이 어긋난다.
   응답(answers)은 그대로 있으니 지금 정답으로 다시 세어 덮는다. 몇 번을 돌려도
   결과가 같아 동기화로 옛 기록이 다시 들어와도 다음 화면에서 바로잡힌다.
   오답노트도 마지막에 고른 보기(pick)가 지금 정답이면 뺀다. right/wrong 횟수는
   동기화 병합이 큰 쪽을 택하므로 줄여도 되살아나 손대지 않는다. */
function regradeByKey(){
  var n = 0;
  S.exams.forEach(function(e){
    if(!e || !e.answers || examBank(e)!==DAP.id) return;
    var ids = examIds(e);
    if(!ids.length || !ids.every(function(id){ return QMAP[id]; })) return;
    var byCh = {}, correct = 0;
    CHLIST.forEach(function(c){ byCh[c.id] = { count:0, correct:0 }; });
    ids.forEach(function(id){
      var q = QMAP[id], b = byCh[q.ch] || (byCh[q.ch] = { count:0, correct:0 });
      b.count++;
      if(isRight(q, e.answers[id])){ b.correct++; correct++; }
    });
    var score = Math.round(correct*PER_Q*10)/10;
    if(e.correct===correct && e.score===score && JSON.stringify(e.byCh)===JSON.stringify(byCh)) return;
    e.correct = correct; e.score = score; e.byCh = byCh; e.count = ids.length;
    n++;
  });
  Object.keys(S.wrong).forEach(function(id){
    var q = QMAP[id], t = S.stats[id];
    if(!q || !t || !isRight(q, t.pick)) return;
    delete S.wrong[id];
    if(!t.box){
      t.box = 1;
      t.due = Date.now() + BOX_DAYS[1] * 864e5;
    }
    n++;
  });
  if(n){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    markDirty();
  }
  return n;
}

/* 리포트에서 문항 하나를 보여준다. picked 가 없으면 미응답. */
function revBlock(id, picked, no){
  var q = QMAP[id];
  if(!q) return "";
  var ok = isRight(q, picked);
  if(!pickList(picked).length) picked = undefined;
  return '<div class="rev"><div class="rev-h">'+
    (no? '<span class="chip chip-accent mono">'+esc(no)+'</span>' : '')+
    '<span class="chip mono">'+q.id+'</span>'+
    '<span class="chip">'+q.ch+'. '+esc(CH[q.ch].name)+'</span>'+(q.s? '<span class="chip">'+esc(q.s)+'</span>' : '')+
    '<span class="'+(ok?"chip chip-ok":"chip chip-bad")+'">'+(ok?"정답":(picked===undefined?"미응답":"오답"))+'</span>'+
    (S.bookmarks[q.id]? '<span class="chip chip-key">★ 즐겨찾기</span>' : '')+
    '<span style="flex:1"></span><button class="btn btn-sm" data-act="solveone" data-id="'+q.id+'">다시 풀기</button>'+
    '<button class="btn btn-sm" data-act="togglemark" data-id="'+q.id+'" title="즐겨찾기">'+(S.bookmarks[q.id]?"★":"☆")+'</button></div>'+
    '<div class="rev-b"><div class="rev-q">'+rich(q.q)+'</div>'+
    '<div class="rev-a">'+q.c.map(function(c,i){
      var mk = isAns(q,i) ? '<span class="tag-ok">✔ 정답</span> '+(hasPick(picked,i) && q.m? '<span class="tag-ok">· 내 답</span> ' : '')
             : (hasPick(picked,i)? '<span class="tag-bad">✕ 내 답</span> ':'　　　　 ');
      return '<div>'+mk+rich(c)+'</div>'; }).join("")+'</div>'+
    (picked===undefined? '<div class="note">답을 고르지 않은 문항입니다.</div>'
     : (ok? '' : '<div class="note">내가 고른 답 '+numText(picked)+' · 정답 '+numText(q.a)+
                 (q.m? ' 모두' : (Array.isArray(q.a)? ' 중 하나' : ''))+'</div>'))+
    '<div class="explain" style="margin:4px 0 0"><div class="explain-h"><span class="eyebrow">해설</span></div>'+
    '<div class="explain-b">'+rich(q.e)+'</div>'+srcLine(q)+'</div></div></div>';
}

    '<thead><tr><th>No.</th><th>과목명</th><th style="text-align:right">정답</th><th style="text-align:right">배점</th><th style="text-align:right">득점</th><th style="text-align:right">정답률</th><th>판정</th></tr></thead><tbody>';

      '<td class="num"><strong>'+(Math.round(b.correct*PER_Q*10)/10)+'</strong></td>'+
      '<td class="num">'+p+'%</td>'+
      '<td>'+(b.count===0?'–':(p<40? '<span class="chip chip-bad">과락</span>' : (p>=75? '<span class="chip chip-ok">양호</span>':'<span class="chip">보통</span>')))+'</td></tr>';
  });

  var sel = view.rq===null ? null : Math.min(Math.max(view.rq||0, 0), ids.length-1);

         '테두리가 점선인 것은 답을 고르지 않은 문항입니다.</div>';

    h += '<div style="padding:2px 16px 14px">'+ revBlock(ids[sel], e.answers[ids[sel]], (sel+1)+"번") +

      '<button class="btn btn-sm" data-act="rvjump" data-i="'+(sel-1)+'"'+(sel===0?" disabled":"")+'>← 이전 문항</button>'+
      '<button class="btn btn-sm" data-act="rvjump" data-i="'+(sel+1)+'"'+(sel===ids.length-1?" disabled":"")+'>다음 문항 →</button>'+
      '<span class="spacer" style="flex:1"></span>'+
      '<button class="btn btn-sm" data-act="rvclose">접기</button></div></div>';
  }
  h += '</div>';

  /* 틀린 문항 해설 — 기본은 모두 접어 두고, 고른 문항만 펼친다.
     한 화면에 해설이 수십 개 늘어서면 정작 볼 것을 찾기 어렵다. */
  var open = view.rvOpen || {};
  h += '<div class="card"><div class="sec-head"><span class="sec-title">틀린 문항 해설</span>'+
    '<span class="eyebrow">'+missed.length+'문항'+
    (missed.length? ' · <button class="btn btn-sm" data-act="rvallmissed">'+
       (missed.every(function(id){ return open[id]; })? '모두 접기' : '모두 펼치기')+'</button>' : '')+
    '</span></div>';
  if(!missed.length){
    h += '<div class="empty"><b>만점입니다</b>틀린 문항이 없습니다.</div>';
  }else{
    h += '<div style="padding:14px 16px">';
    missed.forEach(function(id){
      var q = QMAP[id], no = ids.indexOf(id)+1, isOpen = !!open[id];
      h += '<div class="rev" style="margin-bottom:8px">'+
        '<button class="rev-h" data-act="rvmissed" data-id="'+esc(id)+'" style="width:100%;text-align:left;background:none;border:0;cursor:pointer">'+
          '<span class="chip chip-accent mono">'+no+'번</span>'+
          '<span class="chip">'+q.ch+'. '+esc(CH[q.ch].name)+'</span>'+
          (S.bookmarks[id]? '<span class="chip chip-key">★</span>' : '')+
          '<span class="rev-q" style="flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(plain(q.q))+'</span>'+
          '<span class="eyebrow">'+(isOpen? '접기 ▲' : '해설 ▼')+'</span>'+
        '</button>'+
        (isOpen? '<div style="padding:0 4px 4px">'+revBlock(id, e.answers[id], no+"번")+'</div>' : '')+
      '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ═══════════ 내용정리 ═══════════
   교재 요약본의 이론을 과목 → 장 → 절 → 항으로 옮긴 읽기 화면. 화면 한 장이 절 하나다.
   데이터는 data/notes/N.과목명.js — tools/notes-build.js 가 원고(tools/notes-src/chN.md)에서
   만든다. 과목 파일은 그 과목을 처음 열 때 불러온다. 문제은행의 시작 속도와 무관하게 두려는 것이다.
   2013 판은 data/notes2013/N.과목명.js(원고 tools/notes-src/2013/chN.md).
   화면 주소(#/2020/3/2/2)를 남겨 새로고침·북마크·뒤로 가기가 그 절로 돌아온다.
   문항의 s(「2장 2절 표준 코드 정의」)가 요약본의 장·절 번호를 그대로 쓰므로, 절 화면은 그 절의
   문항을 모아 풀게 하고, 해설의 원천 줄은 해당 절의 그 소제목으로 바로 건너뛴다. */
var ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"];
/* 내용정리는 두 판이다. 2020 = 과목별 요약본(I.~VI. hwpx), 2013 = 준전문가 가이드(교재) 본문을 개조식으로.
   manifest 의 notes 항목에 ed 가 없으면 2020 이다. 과목 데이터는 "판/과목" 키로 둔다.
   2013 판의 장·절 번호는 문항의 s(요약본 기준)와 맞지 않으므로 문항 연결은 2020 판에만 둔다. */
var NOTE_EDS = [
  { id:"2020", title:"2020 Edition", eyebrow:"Notes · 2020 Edition",
    desc:"교재 요약본(2020 Edition)의 이론을 과목 → 장 → 절 순서로 옮긴 것", none:"준비 중", quiz:true },
  { id:"2013", title:"2013 Edition", eyebrow:"Notes · 2013 Edition",
    desc:"데이터아키텍처 준전문가 가이드(I~IV)와 워드 요약(V·VI 및 보탠 내용)을 개조식으로 정리한 것", none:"준비 중", quiz:false }
];
/* 판을 주지 않으면 지금 화면의 판. 설정 화면처럼 view 에 판이 없으면 지금 모드의 판 */
function curEd(){ return view.ed || (curMode === "n2013" ? "2013" : "2020"); }
function noteEd(ed){ ed = ed || curEd(); return NOTE_EDS.filter(function(e){ return e.id === ed; })[0] || NOTE_EDS[0]; }
function nk(ed, ch){ return (ed || curEd()) + "/" + ch; }
var NOTE_FILES = {}, NOTES = {}, NOTE_WAIT = {}, NOTE_FAIL = {}, NOTE_OPEN = {};
((window.DAP_MANIFEST && window.DAP_MANIFEST.notes) || []).forEach(function(n){ if(n && n.ch && n.file) NOTE_FILES[nk(n.ed || "2020", n.ch)] = n.file; });
/* 2013 판 데이터 파일은 머리에 ed:"2013" 이 있다. 없으면 2020 판이다 */
window.DAP_NOTES = { add: function(b){ if(b && b.ch && b.chapters) NOTES[nk(b.ed || "2020", b.ch)] = b; } };
function hasNotes(ch, ed){ return !!NOTE_FILES[nk(ed, ch)]; }
function noteBook(ch, ed){ return NOTES[nk(ed, ch)]; }
function noteSubjects(){
  return ((window.DAP_MANIFEST && window.DAP_MANIFEST.chapters) || CHLIST).map(function(c){ return { id:c.id, name:c.name }; });
}
/* 과목 파일을 한 번만 읽는다. 실패하면 다시 시도하지 않는다 — render 가 되부르며 맴돌지 않게 */
function loadNotes(ch, done, ed){
  var k = nk(ed, ch);
  if(NOTES[k] || !NOTE_FILES[k] || NOTE_FAIL[k]){ if(done) done(); return; }
  if(NOTE_WAIT[k]){ if(done) NOTE_WAIT[k].push(done); return; }
  NOTE_WAIT[k] = done ? [done] : [];
  var el = document.createElement("script");
  el.src = "data/" + NOTE_FILES[k];
  el.charset = "UTF-8";
  el.onload = el.onerror = function(){
    var cbs = NOTE_WAIT[k]; delete NOTE_WAIT[k];
    if(!NOTES[k]){ NOTE_FAIL[k] = true; toast("내용정리 파일을 불러오지 못했습니다 · " + NOTE_FILES[k]); }
    cbs.forEach(function(f){ f(); });
  };
  document.head.appendChild(el);
}
/* 아직 안 읽은 과목이 있으면 읽은 뒤 다시 그린다. 지금 그릴 수 있으면 true */
function needNotes(list, ed){
  ed = ed || curEd();
  var miss = list.filter(function(ch){ var k = nk(ed, ch); return NOTE_FILES[k] && !NOTES[k] && !NOTE_FAIL[k]; });
  if(!miss.length) return true;
  var left = miss.length;
  miss.forEach(function(ch){ loadNotes(ch, function(){
    if(--left || !isNoteView(view.name) || view.ed !== ed) return;
    render();
    if(view.h) scrollToNote(view.h);
  }, ed); });
  return false;
}
function isNoteView(name){ return name === "notes" || name === "note" || name === "nsearch" || name === "nhl"; }
/* 읽음 표시 키 — 2020 판은 예전 그대로("3-2-2"), 2013 판은 "13:" 을 앞에 붙인다 */
function noteKey(ch, c, s, ed){ return ((ed || curEd()) === "2013" ? "13:" : "") + ch + "-" + c + "-" + s; }
function noteRead(ch, c, s, ed){ return !!(S.notesRead && S.notesRead[noteKey(ch, c, s, ed)]); }
/* 과목 안의 절을 순서대로 */
function noteFlat(ch, ed){
  var b = noteBook(ch, ed), out = [];
  if(b) b.chapters.forEach(function(C){ C.sections.forEach(function(Sx){ out.push({ ch:ch, c:C.no, s:Sx.no, C:C, S:Sx }); }); });
  return out;
}
function noteIndex(all, c, s){
  for(var i = 0; i < all.length; i++) if(all[i].c === c && all[i].s === s) return i;
  return -1;
}
function noteFind(ch, c, s, ed){
  return noteFlat(ch, ed).filter(function(x){ return x.c === c && x.s === s; })[0] || null;
}
function noteReadCount(ch, ed){
  var all = noteFlat(ch, ed);
  return { done: all.filter(function(x){ return noteRead(ch, x.c, x.s, ed); }).length, total: all.length };
}

/* ---- 본문 서식 ----
   **굵게**  {2013}(2013 Edition 에만 있는 내용)  #### / ##### 소제목  - 글머리(두 칸마다 한 단계)
   ‖ 머리 | 셀 |  / | 셀 | 셀 | 표 (¶ 셀 안 줄바꿈, << 왼쪽 칸과 병합, ^^ 위 칸과 병합)
   [표 …] [그림 …] [정리] 제목줄,  [[img:키]] 그림,  > 암기 상자 */
/* 원본 강조 그대로: **굵게** {r}빨강{/r} {b}파랑{/b} {u}밑줄{/u} — 원고에서는 늘 색 ⊃ 굵게 ⊃ 밑줄로
   통째로 감싸므로(tools/notes-fmt.js) 표기마다 따로 바꿔도 태그가 엇갈리지 않는다 */
var NOTE_TAG = /\*\*|\{\/?[rbu]\}|\{2013\}|\{w\}/g;
function noteInline(s){
  return esc(s)
    .replace(/\{r\}([\s\S]*?)\{\/r\}/g, '<span class="n-red">$1</span>')
    .replace(/\{b\}([\s\S]*?)\{\/b\}/g, '<span class="n-blue">$1</span>')
    .replace(/\{u\}([\s\S]*?)\{\/u\}/g, '<u class="n-u">$1</u>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\{2013\}/g, '<span class="n-2013" title="2013 Edition 에만 있는 내용">2013</span>')
    .replace(/\{w\}/g, '<span class="n-w" title="2013 워드 요약(data_source 의 .doc)에서 보탠 내용">워드</span>');
}
function noteList(lines){
  var items = [];
  lines.forEach(function(L){
    var m = /^(\s*)- (.*)$/.exec(L);
    if(m) items.push({ ind:m[1].length, t:m[2] });
    else if(items.length) items[items.length-1].t += "\n" + L.trim();   /* 들여쓴 다음 줄 */
  });
  var h = "", st = [];
  items.forEach(function(it){
    if(!st.length || it.ind > st[st.length-1]){ h += '<ul class="n-ul">'; st.push(it.ind); }
    else {
      while(st.length > 1 && it.ind < st[st.length-1]){ h += '</li></ul>'; st.pop(); }
      h += '</li>';
    }
    h += '<li>' + noteInline(it.t).replace(/\n/g, "<br>");
  });
  while(st.length){ h += '</li></ul>'; st.pop(); }
  return h;
}
function noteTable(rows){
  var own = [], heads = [];
  rows.forEach(function(r, ri){
    heads[ri] = r.charAt(0) === "‖";
    own[ri] = [];
    r.replace(/\s+$/, "").slice(2, -2).split(" | ").forEach(function(x, ci){
      x = x.trim();
      var left = own[ri][ci-1], up = ri > 0 ? own[ri-1][ci] : null;
      if(x === "<<" && left){ if(left.r === ri) left.cs++; own[ri][ci] = left; return; }
      if(x === "^^" && up){ if(up.last !== ri){ up.rs++; up.last = ri; } own[ri][ci] = up; return; }
      own[ri][ci] = { t:x, cs:1, rs:1, r:ri, last:ri };
    });
  });
  return '<div class="n-tw"><table class="n-tbl">' + own.map(function(row, ri){
    return '<tr>' + row.map(function(cell, ci){
      if(cell.r !== ri || row[ci-1] === cell) return "";
      var tag = heads[ri] ? "th" : "td";
      return '<' + tag + (cell.cs > 1 ? ' colspan="'+cell.cs+'"' : '') + (cell.rs > 1 ? ' rowspan="'+cell.rs+'"' : '') + '>' +
        noteInline(cell.t).replace(/¶/g, "<br>") + '</' + tag + '>';
    }).join("") + '</tr>';
  }).join("") + '</table></div>';
}
/* H: 이 절 화면의 소제목 번호표 { n } — 소제목마다 nh-번호 id 를 붙인다. noteHeads 와 같은 순서다 */
function noteHtml(body, book, H){
  var lines = String(body || "").split("\n"), i = 0, out = "", m;
  while(i < lines.length){
    var L = lines[i], T = L.trim();
    if(!T){ i++; continue; }
    if((m = /^(#{4,5}) (.*)$/.exec(L))){
      var lv = m[1].length;
      out += '<h'+lv+' class="n-h'+lv+'" id="nh-'+(H.n++)+'">' + noteInline(m[2]) + '</h'+lv+'>';
      i++; continue;
    }
    if((m = /^\[\[img:([\w\-]+)\]\]$/.exec(T))){
      var im = (book.images || {})[m[1]];
      out += im ? '<figure class="rx-fig n-fig"><img class="rx-img" src="data/notes/'+esc(im.src)+'" alt="그림 '+esc(m[1])+'" loading="lazy"'+
                  (im.w ? ' width="'+im.w+'" height="'+im.h+'"' : '')+' data-act="imgzoom"></figure>'
                : '<p class="n-empty">[그림을 찾을 수 없습니다 · '+esc(m[1])+']</p>';
      i++; continue;
    }
    if(/^\[(표|그림|정리)[^\]]*\]/.test(T)){ out += '<div class="n-cap" id="nc-'+(H.c = (H.c||0) + 1)+'">' + noteInline(T) + '</div>'; i++; continue; }
    if(/^[|‖] /.test(L)){
      var rows = [];
      while(i < lines.length && /^[|‖] /.test(lines[i])) rows.push(lines[i++]);
      out += noteTable(rows); continue;
    }
    if(/^> /.test(L)){
      var tip = [];
      while(i < lines.length && /^> /.test(lines[i])) tip.push(noteInline(lines[i++].slice(2)));
      out += '<div class="n-tip">' + tip.join("<br>") + '</div>'; continue;
    }
    if(/^\s*- /.test(L)){
      var li = [];
      while(i < lines.length && (/^\s*- /.test(lines[i]) || (/^\s+\S/.test(lines[i]) && li.length))) li.push(lines[i++]);
      out += noteList(li); continue;
    }
    out += '<p class="n-p">' + noteInline(T) + '</p>'; i++;
  }
  return out;
}
/* 절 화면의 소제목 목록 — noteHtml 이 매기는 nh-번호와 같은 순서로 센다 */
function noteHeads(Sx){
  var out = [], n = 0, cap = 0;
  function scan(body, item){
    String(body || "").split("\n").forEach(function(L){
      var m = /^(#{4,5}) (.*)$/.exec(L), k = /^\[(?:표|그림|정리)[^\]]*\]\s*(.*)$/.exec(L.trim());
      if(m) out.push({ id:"nh-"+(n++), lv:m[1].length, t:m[2].replace(NOTE_TAG, ""), item:item });
      else if(k) out.push({ id:"nc-"+(++cap), lv:6, t:k[1], item:item });   /* 표·그림 제목 — 목차에는 안 나온다 */
    });
  }
  scan(Sx.intro, 0);
  Sx.items.forEach(function(it){ out.push({ id:"na-"+it.no, lv:3, t:it.title, item:it.no }); scan(it.body, it.no); });
  return out;
}
/* 문항의 s 끝머리(「표준 코드 정의」)에 가장 가까운 소제목·표 제목.
   번호(가. 1) 1.)·괄호 속 풀이·띄어쓰기는 무시하고, 같거나 포함하면 그것을, 아니면 글자쌍이
   가장 많이 겹치는 것(75% 이상)을 고른다. 절 제목과 같으면 절 머리("")다. */
function noteAnchor(Sx, topic){
  var norm = function(s){ return String(s || "").replace(NOTE_TAG, "").replace(/^\s*([가-하]\.|\d+\)|\d+\.)\s*/, "")
                                  .replace(/\([^)]*\)/g, "").replace(/[\s·:,()（）]/g, ""); };
  var pairs = function(s){ var o = []; for(var i = 0; i < s.length - 1; i++) o.push(s.substr(i, 2)); return o; };
  var k = norm(topic);
  if(!k || k === norm(Sx.title)) return "";
  var kp = pairs(k), best = null, bestS = 0;
  noteHeads(Sx).forEach(function(h){
    var t = norm(h.t), sc;
    if(!t) return;
    if(t === k) sc = 2;
    else if(t.indexOf(k) >= 0 || k.indexOf(t) >= 0) sc = 1.5;
    else {
      var tp = pairs(t), hit = 0, pool = tp.slice();
      kp.forEach(function(p){ var j = pool.indexOf(p); if(j >= 0){ hit++; pool.splice(j, 1); } });
      sc = (2 * hit) / (kp.length + tp.length || 1);
    }
    if(sc > bestS){ bestS = sc; best = h; }
  });
  return best && bestS >= 0.75 ? best.id : "";
}
/* 문항 → 내용정리 자리. 요약본을 근거로 쓴 문항만 잇는다(교재만 본 문항은 장·절 번호 체계가 다르다) */
function noteLinkOf(q){
  if(!q || !hasNotes(q.ch, "2020")) return null;
  var m = /^(\d+)장 (\d+)절\s*(.*)$/.exec(q.s || "");
  if(!m) return null;
  var files = String(q.f || "").split(" · ").filter(function(x){ return x; });
  if(files.length && !files.some(function(f){ return srcKind(f) === "요약본"; })) return null;
  return { ch:q.ch, c:+m[1], s:+m[2], topic:m[3] };
}
/* 절에 딸린 문항 — 열린 묶음 전부에서. 요약본 근거 문항만 */
function noteQuestions(ch, c, s){
  return BANKS.filter(function(b){ return !b.locked && b.questions; }).map(function(b){
    return { bank:b, ids: b.questions.filter(function(q){
      var l = q.ch === ch && noteLinkOf(q);
      return l && l.c === c && l.s === s;
    }).map(function(q){ return q.id; }) };
  }).filter(function(x){ return x.ids.length; });
}

/* ---- 화면 ---- */
function viewNotesHome(){
  var subs = noteSubjects(), E = noteEd();
  needNotes(subs.map(function(c){ return c.id; }));
  var h = '<div class="page-head"><div><div class="eyebrow">'+esc(E.eyebrow)+'</div><h1 class="page-title">'+esc(E.title)+'</h1>'+
    '<p class="page-desc">'+esc(E.desc)+'입니다. 절을 고르면 그 절 전체가 한 화면에 나오고, 오른쪽 목차로 소제목 사이를 건너뜁니다.'+
    (E.id === "2020" ? ' <span class="n-2013">2013</span> 표시는 2013 Edition 에만 있는 내용입니다.' : '')+'</p></div>'+
    '<button class="btn" data-go="nsearch">⌕ 내용 검색</button></div>';
  h += '<div class="nh-grid">';
  var hc = hlCounts(E.id);
  subs.forEach(function(sub){
    var b = noteBook(sub.id);
    if(!hasNotes(sub.id) || !b){
      h += '<div class="card nh-card off"><div class="nh-head"><span class="nh-rom">'+ROMAN[sub.id]+'</span><span class="nh-title">'+esc(sub.name)+'</span>'+
        '<span class="chip">'+(hasNotes(sub.id) ? (NOTE_FAIL[nk("", sub.id)] ? "불러오기 실패" : "불러오는 중…") : esc(E.none))+'</span></div></div>';
      return;
    }
    var rc = noteReadCount(sub.id);
    h += '<div class="card nh-card"><div class="nh-head"><span class="nh-rom">'+ROMAN[sub.id]+'</span><span class="nh-title">'+esc(b.title || sub.name)+'</span>'+
      '<span class="nav-count">'+rc.done+'/'+rc.total+'</span></div>'+
      '<div class="meter-track"><div class="meter-fill" style="width:'+(rc.total ? Math.round(rc.done/rc.total*100) : 0)+'%"></div></div>';
    b.chapters.forEach(function(C){
      h += '<div class="nh-ch">제'+C.no+'장 '+esc(C.title)+'</div><div class="nh-secs">';
      C.sections.forEach(function(Sx){
        h += '<button data-go="note" data-ch="'+sub.id+'" data-c="'+C.no+'" data-s="'+Sx.no+'"><span class="mono" style="color:var(--muted)">'+Sx.no+'절</span>'+
          '<span>'+esc(Sx.title)+'</span>'+hlBadge(hc[noteKey(sub.id, C.no, Sx.no)])+(noteRead(sub.id, C.no, Sx.no) ? '<span class="nt-ok">✓</span>' : '')+'</button>';
      });
      h += '</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

/* 절 본문 — 절 화면과 형광펜 모아보기(칠한 자리가 아직 있는지 보려고)가 함께 쓴다 */
function noteDocHtml(Sx, b, E){
  var H = { n:0 }, doc = "";
  if(Sx.intro) doc += '<div class="note-intro">' + noteHtml(Sx.intro, b, H) + '</div>';
  Sx.items.forEach(function(it){
    doc += '<section class="n-item" id="na-'+it.no+'"><h2 class="n-h3"><span class="n-no">'+it.no+'.</span><span>'+noteInline(it.title)+'</span></h2>'+
      (it.body ? noteHtml(it.body, b, H) : '<p class="n-empty">'+(E.id === "2013" ? '가이드' : '요약본')+'에 이 항의 본문이 없습니다.</p>') + '</section>';
  });
  return doc;
}

function viewNote(){
  var ch = view.ch, c = view.c, s = view.s;
  if(!needNotes([ch])) return '<div class="card"><div class="empty"><b>내용정리를 불러오는 중…</b></div></div>';
  var E = noteEd(), b = noteBook(ch), here = b && noteFind(ch, c, s);
  if(!here) return '<div class="card"><div class="empty"><b>해당 절이 없습니다</b>'+
    '<button class="btn" data-go="notes" style="margin-top:12px">'+esc(E.title)+' 개요로</button></div></div>';
  var C = here.C, Sx = here.S, read = noteRead(ch, c, s);
  /* 해설에서 건너왔으면 그 소제목으로 */
  if(view.topic && !view.h){ view.h = noteAnchor(Sx, view.topic); view.topic = ""; }

  var h = '<div class="note-crumb"><button data-go="notes">'+esc(E.title)+'</button><span>›</span>'+
    '<button data-go="notes">'+ROMAN[ch]+'. '+esc(b.title)+'</button><span>›</span><span>제'+C.no+'장 '+esc(C.title)+'</span></div>';
  h += '<div class="page-head" style="margin-bottom:16px"><div><h1 class="page-title">제'+s+'절 '+esc(Sx.title)+'</h1></div>'+
    '<button class="btn'+(read ? ' btn-primary' : '')+'" data-act="noteread">'+(read ? '✓ 읽음' : '읽음 표시')+'</button></div>';
  var hn = hlOf(noteKey(ch, c, s)).length;
  h += '<div class="hl-tools"><span class="hl-tip"><b>형광펜 '+hn+'개</b> · 글자를 선택하면 색을 고르는 막대가 나옵니다. 칠한 곳을 누르면 색·메모를 고칩니다</span>'+
    '<button class="btn btn-sm'+(S.settings.hlHide ? ' btn-primary' : '')+'" data-act="hlhide" aria-pressed="'+!!S.settings.hlHide+'" title="칠한 글자를 가리고, 누르면 보입니다">가리기</button>'+
    '<button class="btn btn-sm'+(S.settings.hlOnly ? ' btn-primary' : '')+'" data-act="hlonly" aria-pressed="'+!!S.settings.hlOnly+'" title="칠한 곳이 있는 줄만 남깁니다">형광만 보기</button>'+
    '<button class="btn btn-sm" data-go="nhl">모아보기</button></div><div id="hlLost"></div>';

  var heads = noteHeads(Sx);
  function toc(){
    return '<nav class="note-toc"><div class="toc-h">이 절의 목차</div>'+
      heads.filter(function(x){ return x.lv <= 4; }).map(function(x){
        return '<button data-act="nscroll" data-to="'+x.id+'"'+(x.lv === 4 ? ' class="toc-sub"' : '')+'>'+
          (x.lv === 3 ? x.item + '. ' : '') + esc(x.t) + '</button>';
      }).join("") + '</nav>';
  }
  var doc = noteDocHtml(Sx, b, E);
  h += '<details class="note-toc-m"><summary>이 절의 목차 · '+Sx.items.length+'항</summary>'+toc()+'</details>';
  h += '<div class="note-layout"><article class="note-doc">'+doc+'</article>'+toc()+'</div>';

  /* 이 절의 문항 — 문항의 s 가 요약본(2020) 장·절 번호라 2020 판에만 */
  var rel = E.quiz ? noteQuestions(ch, c, s) : null;
  if(rel) h += '<div class="card" style="margin-top:16px"><div class="sec-head"><span class="sec-title">이 절의 문항</span>'+
    '<span class="note">문항의 원천(장·절)이 이 절인 것</span></div>';
  if(rel && !rel.length) h += '<div class="empty" style="padding:22px">이 절을 원천으로 하는 문항이 없습니다.</div></div>';
  else if(rel){
    h += '<div class="meter-list">';
    rel.forEach(function(x){
      /* 맞힘 = 마지막으로 고른 답이 정답인 것 */
      var seen = 0, right = 0, qm = {};
      x.bank.questions.forEach(function(q){ qm[q.id] = q; });
      x.ids.forEach(function(id){
        var st = S.stats[id];
        if(!st || !(st.right || st.wrong)) return;
        seen++;
        if(st.pick !== undefined ? isRight(qm[id], st.pick) : (st.right && !st.wrong)) right++;
      });
      h += '<div class="resume-row"><div style="flex:1;min-width:180px"><div style="font-weight:500">'+esc(x.bank.name)+'</div>'+
        '<div class="note">'+x.ids.length+'문항 · 푼 문항 '+seen+(seen ? ' · 맞힌 문항 '+right : '')+'</div></div>'+
        '<button class="btn btn-sm" data-act="notequiz" data-bank="'+esc(x.bank.id)+'">풀기 →</button></div>';
    });
    h += '</div></div>';
  }

  /* 이전 · 다음 절 */
  var all = noteFlat(ch), k = noteIndex(all, c, s), pv = all[k-1], nx = all[k+1];
  h += '<div class="note-pager">'+
    (pv ? '<button data-go="note" data-ch="'+ch+'" data-c="'+pv.c+'" data-s="'+pv.s+'"><small>← 이전 절</small><span>'+pv.c+'장 '+pv.s+'절 '+esc(pv.S.title)+'</span></button>' : '')+

function viewNoteSearch(){
  var E = noteEd(), subs = noteSubjects().map(function(c){ return c.id; }).filter(function(ch){ return hasNotes(ch); });
  var ready = needNotes(subs);
  var kw = (view.kw || "").trim();
  var h = '<div class="page-head"><div><div class="eyebrow">Search · '+esc(E.title)+'</div><h1 class="page-title">내용 검색</h1>'+
    '<p class="page-desc">'+esc(E.title)+' 내용정리의 제목·본문·표에서 찾습니다. 결과를 누르면 그 소제목으로 바로 갑니다.</p></div></div>';
  h += '<div class="toolbar"><input type="text" id="nq" placeholder="예: 표준 도메인, 금칙어, 이음동의어" value="'+esc(kw)+'">'+
       '<button class="btn btn-primary" data-act="donsearch">검색</button></div>';
  if(!ready) return h + '<div class="card"><div class="empty"><b>내용정리를 불러오는 중…</b></div></div>';
  if(!kw) return h + '<div class="card"><div class="empty"><b>검색어를 입력하세요</b>준비된 과목: '+
    (subs.map(function(ch){ return ROMAN[ch]; }).join(", ") || "없음")+'</div></div>';
  var k = kw.toLowerCase(), hits = [];
  var plainOf = function(s){ return String(s).replace(NOTE_TAG, "").replace(/\[\[img:[^\]]*\]\]|^#+ |^\s*- |^[|‖] /gm, "").replace(/ \| |¶/g, " ").replace(/<<|\^\^/g, ""); };
  subs.forEach(function(ch){
    noteFlat(ch).forEach(function(x){
      var heads = noteHeads(x.S);
      /* 단락(소제목 단위)으로 나눠 찾는다 — 결과를 누르면 그 소제목으로 */
      var chunks = [{ id:"", title:"", text:x.S.title + "\n" + (x.S.intro || "") }];
      var hi = 0;
      [{ no:0, body:x.S.intro || "" }].concat(x.S.items).forEach(function(it){
        var cur = it.no ? { id:"na-"+it.no, title:it.no+". "+it.title, text:it.title+"\n" } : chunks[0];
        if(it.no) chunks.push(cur);
        String(it.body).split("\n").forEach(function(L){
          if(/^#{4,5} /.test(L)){ var hd = heads.filter(function(z){ return z.lv === 4 || z.lv === 5; })[hi++]; cur = { id:hd ? hd.id : cur.id, title:L.replace(/^#+ /, "").replace(NOTE_TAG, ""), text:"" }; chunks.push(cur); }
          cur.text += L + "\n";
        });
      });
      chunks.forEach(function(ck){
        var t = plainOf(ck.text), p = t.toLowerCase().indexOf(k);
        if(p < 0) return;
        var a = Math.max(0, p - 40), snip = t.slice(a, p + k.length + 70).replace(/\s+/g, " ");
        var at = snip.toLowerCase().indexOf(k);
        hits.push({ x:x, id:ck.id, title:ck.title,
          snip: (a ? "… " : "") + esc(snip.slice(0, at)) + '<mark class="n-hit">' + esc(snip.slice(at, at + k.length)) + '</mark>' + esc(snip.slice(at + k.length)) + " …" });
      });
    });
  });
  h += '<p class="note" style="margin-bottom:12px">'+hits.length+'곳</p>';
  if(!hits.length) return h + '<div class="card"><div class="empty"><b>결과가 없습니다</b>다른 키워드로 시도해 보세요.</div></div>';
  h += '<div class="card">';
  hits.slice(0, 80).forEach(function(r){
    h += '<button class="ns-hit" data-go="note" data-ch="'+r.x.ch+'" data-c="'+r.x.c+'" data-s="'+r.x.s+'" data-h="'+esc(r.id)+'">'+
      '<span class="ns-path">'+ROMAN[r.x.ch]+' › '+r.x.c+'장 '+r.x.s+'절 '+esc(r.x.S.title)+(r.title ? ' › '+esc(r.title) : '')+'</span>'+
      '<span class="ns-snip">'+r.snip+'</span></button>';
  });
  if(hits.length > 80) h += '<p class="note" style="padding:10px 18px">상위 80곳만 표시했습니다.</p>';
  return h + '</div>';
}

/* ---- 화면 주소 ---- */
/* #/2020/3/2/2 · #/2013/1/2/3 — 판이 주소 맨 앞에 온다. 예전 주소 #/notes/… 는 2020 판으로 읽는다 */
function viewHash(v){
  if(v.name === "dm")  return "#/dm";
  if(v.name === "dmq") return "#/dm/" + v.id;
  if(v.name === "video")  return "#/video";
  if(v.name === "vdq")    return "#/video/" + v.id;
  if(v.name === "slides") return "#/slides";
  var p = "#/" + (v.ed || "2020");
  if(v.name === "notes")   return p;
  if(v.name === "nsearch") return p + "/search";
  if(v.name === "nhl")     return p + "/marks";
  if(v.name === "note")    return p + "/" + v.ch + "/" + v.c + "/" + v.s;
  return "";
}
function viewFromHash(){
  var d = /^#\/dm(?:\/([\w-]+))?\/?$/.exec(location.hash || "");
  if(d) return d[1] ? { name:"dmq", id:d[1] } : { name:"dm" };
  var vq = /^#\/video\/([\w-]+)\/?$/.exec(location.hash || "");
  if(vq) return { name:"vdq", id:vq[1] };
  var z = /^#\/(video|slides)\/?$/.exec(location.hash || "");
  if(z) return { name:z[1] };
  var m = /^#\/(notes|2020|2013)(?:\/(search|marks)|\/(\d+)\/(\d+)\/(\d+))?\/?$/.exec(location.hash || "");
  if(!m) return null;
  var ed = m[1] === "2013" ? "2013" : "2020";
  if(m[2]) return { name:m[2] === "marks" ? "nhl" : "nsearch", ed:ed };
  if(m[3]) return { name:"note", ed:ed, ch:+m[3], c:+m[4], s:+m[5] };
  return { name:"notes", ed:ed };
}
/* 내용정리·실기·강의·슬라이드 화면을 오갈 때만 주소를 남긴다. 문제은행 화면끼리는 지금처럼 주소가 바뀌지 않는다 */
function syncHash(){
  var h = viewHash(view), cur = location.hash || "";
  if(h === cur || (!h && !/^#\/(notes|2020|2013|dm|video|slides)/.test(cur))) return;
  try{ history.pushState(null, "", h || (location.pathname + location.search)); }catch(e){}
}
window.addEventListener("popstate", function(){
  var v = viewFromHash();
  if(v) go(v.name, v, true);
  else if(isNoteView(view.name) || isDmView(view.name) || isVdView(view.name) || isSoonView(view.name)) go(lastView.bank.name, lastView.bank, true);
});
/* 해설의 [내용정리에서 보기] — 절 화면을 열고 그 소제목으로 */
function scrollToNote(id){
  var el = id && document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({ block:"start" });
  el.classList.remove("n-flash"); void el.offsetWidth; el.classList.add("n-flash");

/* ═══════════ Data Modeling(실기) ═══════════
   data_source 의 「Modeling 실습문제.hwpx」 30문제 — 요구 사항 지문과 모범 답안 ERD (tools/dm-build.js → data/dm/dm.js).
   단계(기초 → 특급) → 문제. 화면 주소 #/dm · #/dm/4-7. 처음 이 화면을 열 때 데이터를 읽는다.
   「풀어 봄」 표시는 내용정리 읽음 표시와 같은 S.notesRead 에 "dm:4-7" 로 둔다 — 동기화 병합·전체 초기화가 그대로 적용된다.
   ERD 는 눌러서 확대 보기로 연다(dmz*): 휠·두 손가락으로 확대, 끌어서 이동, 두 번 눌러 맞춤 ↔ 확대. */
var DM = null, DM_WAIT = null, DM_FAIL = false;
var DM_FILE = (window.DAP_MANIFEST && window.DAP_MANIFEST.dm) || "";
window.DAP_DM = { add: function(b){ if(b && b.items) DM = b; } };
function isDmView(name){ return name === "dm" || name === "dmq"; }
function loadDm(done){
  if(DM || !DM_FILE || DM_FAIL){ if(done) done(); return; }
  if(DM_WAIT){ if(done) DM_WAIT.push(done); return; }
  DM_WAIT = done ? [done] : [];
  var el = document.createElement("script");
  el.src = "data/" + DM_FILE;
  el.charset = "UTF-8";
  el.onload = el.onerror = function(){
    var cbs = DM_WAIT; DM_WAIT = null;
    if(!DM){ DM_FAIL = true; toast("실기 문제 파일을 불러오지 못했습니다 · " + DM_FILE); }
    cbs.forEach(function(f){ f(); });
  };
  document.head.appendChild(el);
}
/* 아직 안 읽었으면 읽은 뒤 다시 그린다. 지금 그릴 수 있으면 true */
function needDm(){
  if(DM || DM_FAIL || !DM_FILE) return true;
  loadDm(function(){ if(isDmView(view.name)) render(); });
  return false;
}
function dmKey(id){ return "dm:" + id; }
function dmDone(id){ return !!(S.notesRead && S.notesRead[dmKey(id)]); }
function dmFind(id){ return DM ? DM.items.filter(function(x){ return x.id === id; })[0] || null : null; }
function dmLevelName(lv){ return lv + ". " + DM.levels[lv]; }
function dmStars(n){ return n ? ' <span class="dm-stars" title="난이도 표시(원문)">'+"★".repeat(n)+'</span>' : ''; }
function dmCount(){
  var all = DM ? DM.items : [];
  return { done: all.filter(function(x){ return dmDone(x.id); }).length, total: all.length };
}

  h += '<article class="note-doc dm-doc dm-ans"><div class="dm-ans-head"><h2 class="n-h3"><span class="n-no">A</span><span>모범 답안 ERD</span></h2>'+
    '<button class="btn btn-sm'+(S.settings.dmHide ? ' btn-primary' : '')+'" data-act="dmhide" aria-pressed="'+!!S.settings.dmHide+'" '+
    'title="켜 두면 문제를 열 때마다 답안을 가려 두고, 직접 그려 본 뒤 펼칩니다">답안 먼저 가리기</button></div>';
  if(hide) h += '<div class="dm-cover"><b>답안이 가려져 있습니다</b><span class="note">지문을 보고 먼저 모델을 그려 본 뒤 펼쳐 보세요. '+
    (nImg > 1 ? 'ERD '+nImg+'장' : 'ERD')+(it.a.some(function(b){ return b.tbl; }) ? '과 정의서 표' : '')+'가 있습니다.</span>'+
    '<button class="btn btn-primary" data-act="dmshow">답안 보기</button></div>';
  else h += dmBlocks(it.a) + '<p class="note dm-hint">ERD 를 누르면 크게 봅니다 — 휠·두 손가락으로 확대, 끌어서 이동, 두 번 눌러 맞춤.</p>';
  h += '</article>';

  var all = DM.items, k = all.indexOf(it), pv = all[k-1], nx = all[k+1];
  h += '<div class="note-pager">'+
    (pv ? '<button data-go="dmq" data-id="'+esc(pv.id)+'"><small>← 이전 문제</small><span>['+esc(pv.id)+'] '+esc(pv.title)+'</span></button>' : '')+
    (nx ? '<button class="nx" data-go="dmq" data-id="'+esc(nx.id)+'"><small>다음 문제 →</small><span>['+esc(nx.id)+'] '+esc(nx.title)+'</span></button>' : '')+
    '</div>';
  return h;
}

/* ---- ERD 확대 보기 ----
   그림 하나를 화면 가득 띄우고 transform(translate · scale)으로 움직인다. 한 문제에 그림이 여럿이면 ‹ › 로 넘긴다.
   확대 범위는 맞춤 크기의 절반 ~ 원본의 6배. */
var dmz = null;
function dmzOpen(key){
  var it = dmFind(view.id);
  var list = it ? it.q.concat(it.a).filter(function(b){ return b.img; }) : [];
  if(S.settings.dmHide && !view.show) list = it.q.filter(function(b){ return b.img; });
  var idx = Math.max(0, list.map(function(b){ return b.img; }).indexOf(key));
  if(!list.length) return;
  var el = document.createElement("div");
  el.className = "dmz";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "ERD 크게 보기");
  el.innerHTML = '<div class="dmz-bar"><span class="dmz-title"></span><span class="dmz-pct mono"></span>'+
    '<span class="dmz-btns">'+
    '<button data-z="prev" title="이전 그림 (←)">‹</button><button data-z="next" title="다음 그림 (→)">›</button>'+
    '<button data-z="out" title="축소 (−)">−</button><button data-z="in" title="확대 (+)">＋</button>'+
    '<button data-z="fit" title="화면에 맞춤 (0)">맞춤</button><button data-z="one" title="원본 크기 (1)">1:1</button>'+
    '<button data-z="close" class="dmz-x" title="닫기 (Esc)">✕</button></span></div>'+
    '<div class="dmz-stage"><img class="dmz-img" alt="" draggable="false"></div>';
  document.body.appendChild(el);
  document.body.classList.add("dmz-open");
  dmz = { el:el, stage:el.querySelector(".dmz-stage"), img:el.querySelector(".dmz-img"), list:list, idx:idx, title:it.title,
          s:1, x:0, y:0, fit:1, pts:{}, pinch:null, moved:false, back:document.activeElement };
  dmzBind();
  dmzShow(idx);
  el.querySelector(".dmz-x").focus();
}
function dmzClose(){
  if(!dmz) return;
  dmz.el.remove();
  document.body.classList.remove("dmz-open");
  window.removeEventListener("resize", dmzResize);
  var back = dmz.back; dmz = null;
  if(back && back.focus) back.focus();
}
function dmzShow(i){
  var b = dmz.list[i], im = DM.images[b.img] || {};
  dmz.idx = i;
  dmz.w = im.w || 1000; dmz.h = im.h || 700;
  dmz.img.src = "data/dm/" + im.src;
  dmz.img.style.width = dmz.w + "px"; dmz.img.style.height = dmz.h + "px";
  dmz.el.querySelector(".dmz-title").textContent = dmz.title + (b.cap ? " · " + b.cap : "") + (dmz.list.length > 1 ? "  (" + (i+1) + "/" + dmz.list.length + ")" : "");
  dmz.el.querySelector('[data-z="prev"]').hidden = dmz.el.querySelector('[data-z="next"]').hidden = dmz.list.length < 2;
  dmzFit();
}
function dmzFit(){
  var r = dmz.stage.getBoundingClientRect();
  dmz.fit = Math.min((r.width - 24) / dmz.w, (r.height - 24) / dmz.h, 2);
  dmz.s = dmz.fit;
  dmz.x = (r.width - dmz.w * dmz.s) / 2; dmz.y = (r.height - dmz.h * dmz.s) / 2;
  dmzApply();
}
function dmzApply(){
  dmz.img.style.transform = "translate(" + dmz.x + "px," + dmz.y + "px) scale(" + dmz.s + ")";
  dmz.el.querySelector(".dmz-pct").textContent = Math.round(dmz.s * 100) + "%";
}
/* (px, py) = 화면(stage) 좌표. 그 점이 제자리에 있도록 확대한다 */
function dmzZoom(f, px, py){
  var r = dmz.stage.getBoundingClientRect();
  if(px === undefined){ px = r.width / 2; py = r.height / 2; }
  var ns = Math.min(6, Math.max(dmz.fit / 2, dmz.s * f));
  dmz.x = px - (px - dmz.x) * ns / dmz.s;
  dmz.y = py - (py - dmz.y) * ns / dmz.s;
  dmz.s = ns;
  dmzApply();
}
function dmzResize(){ if(dmz) dmzFit(); }
function dmzBind(){
  var st = dmz.stage;
  window.addEventListener("resize", dmzResize);
  dmz.el.addEventListener("click", function(e){
    var b = e.target.closest("[data-z]"); if(!b) return;
    var z = b.getAttribute("data-z");
    if(z === "close") dmzClose();
    else if(z === "in") dmzZoom(1.4);
    else if(z === "out") dmzZoom(1 / 1.4);
    else if(z === "fit") dmzFit();
    else if(z === "one") dmzZoom(1 / dmz.s);
    else if(z === "prev") dmzShow((dmz.idx - 1 + dmz.list.length) % dmz.list.length);
    else if(z === "next") dmzShow((dmz.idx + 1) % dmz.list.length);
  });
  st.addEventListener("wheel", function(e){
    e.preventDefault();
    var r = st.getBoundingClientRect();
    dmzZoom(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });
  st.addEventListener("dblclick", function(e){
    var r = st.getBoundingClientRect();
    if(dmz.s > dmz.fit * 1.2) dmzFit(); else dmzZoom(Math.max(1, dmz.fit * 2.2) / dmz.s, e.clientX - r.left, e.clientY - r.top);
  });
  st.addEventListener("pointerdown", function(e){
    st.setPointerCapture(e.pointerId);
    dmz.pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    st.classList.add("drag");
    dmz.pinch = null;
  });
  st.addEventListener("pointermove", function(e){
    var p = dmz.pts[e.pointerId]; if(!p) return;
    var ids = Object.keys(dmz.pts);
    if(ids.length === 1){
      dmz.x += e.clientX - p.x; dmz.y += e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      dmzApply();
      return;
    }
    /* 두 손가락 — 거리 비율로 확대, 가운데 점의 움직임으로 이동 */
    p.x = e.clientX; p.y = e.clientY;
    var a = dmz.pts[ids[0]], b = dmz.pts[ids[1]], r = st.getBoundingClientRect();
    var d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if(dmz.pinch && dmz.pinch.d > 0){
      dmz.x += mx - dmz.pinch.mx; dmz.y += my - dmz.pinch.my;
      dmzZoom(d / dmz.pinch.d, mx, my);
    }
    dmz.pinch = { d:d, mx:mx, my:my };
  });
  function up(e){
    delete dmz.pts[e.pointerId];
    dmz.pinch = null;
    if(!Object.keys(dmz.pts).length) st.classList.remove("drag");
  }
  st.addEventListener("pointerup", up);
  st.addEventListener("pointercancel", up);
}
/* 확대 보기가 열려 있으면 키 입력을 먼저 가로챈다 (캡처 단계 — 화면의 ← → 문제 넘기기보다 앞선다) */
document.addEventListener("keydown", function(e){
  if(!dmz) return;
  var k = e.key, used = true;
  if(k === "Escape") dmzClose();
  else if(k === "+" || k === "=") dmzZoom(1.4);
  else if(k === "-" || k === "_") dmzZoom(1 / 1.4);
  else if(k === "0") dmzFit();
  else if(k === "1") dmzZoom(1 / dmz.s);
  else if(k === "ArrowLeft" && dmz.list.length > 1) dmzShow((dmz.idx - 1 + dmz.list.length) % dmz.list.length);
  else if(k === "ArrowRight" && dmz.list.length > 1) dmzShow((dmz.idx + 1) % dmz.list.length);
  else if(k === "Tab"){
    /* 초점을 확대 보기 안에 가둔다 */
    var bs = [].filter.call(dmz.el.querySelectorAll("button"), function(b){ return !b.hidden; });
    var i = bs.indexOf(document.activeElement), n = (i + (e.shiftKey ? -1 : 1) + bs.length) % bs.length;
    bs[n].focus();
  }
  else used = false;
  if(used){ e.preventDefault(); e.stopPropagation(); }
}, true);

/* ═══════════ 형광펜 ═══════════
   내용정리 본문에서 글자를 선택해 칠한다. 기록은 S.hl = { id: 형광펜 } 이다.
   형광펜 = { k:절 키(noteKey), c:색, q:칠한 글자, pre·suf:그 앞뒤 글자, o:칠할 때의 위치,
              m:메모, t:만든 시각, u:마지막으로 고친 시각, del:지움 }
   위치를 글자 번호로만 두면 원고를 다시 빌드할 때 어긋난다. 칠한 글자를 앞뒤 글자와 함께 기억해 두고
   그릴 때마다 본문에서 다시 찾는다(텍스트 인용 앵커). 같은 글자가 여러 곳이면 앞뒤가 더 많이 맞는 곳,
   그다음 o 에 가까운 곳이다. 못 찾은 것은 버리지 않고 「위치를 찾지 못한 형광펜」으로 보인다.
   본문을 문자열 하나로 볼 때 블록(글머리·문단·셀·소제목)이 바뀌는 자리와 <br> 에는 "\n" 을 넣는다 —
   블록을 걸쳐 칠한 글자가 모아보기에서 붙어 보이지 않게. 배지(2013·워드)·메모 표시는 본문 글자로 치지 않는다.
   칠한 곳은 서로 겹치지 않게 둔다. 겹치게 칠하면 둘을 합친다.
   지운 것은 del 로 남긴다. 병합은 합집합이라 그냥 지우면 다른 기기에 남은 것이 되살아난다. */
var HL_COLORS = [ { id:"y", name:"중요" }, { id:"g", name:"헷갈림" }, { id:"r", name:"꼭 암기" } ];
var HL_CTX = 24;                                        /* 앞뒤로 기억하는 글자 수 */
var HL_BLOCK = "li,p,td,th,h2,h4,h5,.n-tip,.n-cap";
var HL_SKIP = ".n-2013,.n-w,.hl-memo,.hl-skip";
var HL_POS = {};                                        /* 지금 절 화면에서 형광펜이 놓인 자리 { id:[시작, 끝] } */
var hlSelNow = null, hlSelT = null;

function hlLive(){
  return Object.keys(S.hl || {}).map(function(id){
    var h = S.hl[id];
    return h && !h.del ? Object.assign({ id:id }, h) : null;
  }).filter(Boolean);
}
function hlOf(key){
  return hlLive().filter(function(h){ return h.k === key; }).sort(function(a, b){ return (a.o||0) - (b.o||0); });
}
function hlEdOf(k){ return String(k).indexOf("13:") === 0 ? "2013" : "2020"; }
function hlCounts(ed){
  var m = {};
  hlLive().forEach(function(h){ if(hlEdOf(h.k) === ed) m[h.k] = (m[h.k]||0) + 1; });
  return m;
}
function hlBadge(n){ return n ? '<span class="nt-hl" title="형광펜 '+n+'개">'+n+'</span>' : ''; }

/* 본문을 문자열 하나로. nodes = [{ n:글자 노드, s:문자열 속 시작 }] */
function hlText(root){
  var out = { text:"", nodes:[] }, prev = null, br = false, n;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, null);
  while((n = w.nextNode())){
    if(n.nodeType === 1){ if(n.tagName === "BR") br = true; continue; }
    var p = n.parentNode;
    if(!n.nodeValue || p.closest(HL_SKIP)) continue;
    var blk = p.closest(HL_BLOCK) || root;
    if(out.text && (br || (prev && blk !== prev))) out.text += "\n";
    prev = blk; br = false;
    out.nodes.push({ n:n, s:out.text.length });
    out.text += n.nodeValue;
  }
  return out;
}
/* 선택 경계(노드, 오프셋) → 문자열 위치. 글자 노드가 아니면 그 뒤 첫 글자 노드의 시작 */
function hlPoint(info, node, off){
  for(var i = 0; i < info.nodes.length; i++)
    if(info.nodes[i].n === node) return info.nodes[i].s + Math.min(off, node.nodeValue.length);
  var r = document.createRange();
  r.setStart(node, off); r.collapse(true);
  for(var j = 0; j < info.nodes.length; j++) if(r.comparePoint(info.nodes[j].n, 0) >= 0) return info.nodes[j].s;
  return info.text.length;
}
function hlSel(root){
  var sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  var r = sel.getRangeAt(0);
  if(!root.contains(r.startContainer) || !root.contains(r.endContainer)) return null;
  var info = hlText(root), s = hlPoint(info, r.startContainer, r.startOffset), e = hlPoint(info, r.endContainer, r.endOffset);
  while(s < e && /\s/.test(info.text.charAt(s))) s++;
  while(e > s && /\s/.test(info.text.charAt(e-1))) e--;
  return e > s ? { s:s, e:e, rect:r.getBoundingClientRect() } : null;
}
/* 본문 문자열에서 형광펜 자리를 찾는다. 없으면 -1 */
function hlFind(text, h){
  var q = h.q || "", a = h.pre || "", b = h.suf || "", best = -1, bs = 0, i = q ? text.indexOf(q) : -1;
  while(i >= 0){
    var sc = 0, x, y;
    for(x = 1; x <= a.length && i - x >= 0 && text.charAt(i-x) === a.charAt(a.length-x); x++) sc++;
    for(y = 0; y < b.length && text.charAt(i+q.length+y) === b.charAt(y); y++) sc++;
    sc = sc * 1e7 - Math.abs(i - (h.o||0));
    if(best < 0 || sc > bs){ best = i; bs = sc; }
    i = text.indexOf(q, i + 1);
  }
  return best;
}
/* [s, e) 를 <mark> 로 감싼다. 블록을 걸치면 노드마다 따로 감싸고, 첫 조각에 id 를 붙인다 */
function hlWrap(root, s, e, h){
  var first = null, last = null;
  hlText(root).nodes.forEach(function(x){
    var len = x.n.nodeValue.length, a = Math.max(s, x.s) - x.s, b = Math.min(e, x.s + len) - x.s;
    if(a >= b || x.n.parentNode.closest("mark.hl")) return;
    var n = x.n;
    if(b < len) n.splitText(b);
    if(a > 0) n = n.splitText(a);
    var mk = document.createElement("mark");
    mk.className = "hl hl-" + h.c;
    mk.setAttribute("data-act", "hlmark"); mk.setAttribute("data-hl", h.id);
    if(h.m) mk.title = h.m;
    if(!first){ mk.id = "hl-" + h.id; first = mk; }
    n.parentNode.insertBefore(mk, n); mk.appendChild(n);
    last = mk;
  });
  if(last && h.m){
    var sp = document.createElement("sup");
    sp.className = "hl-memo"; sp.textContent = "✎"; sp.title = h.m;
    sp.setAttribute("data-act", "hlmark"); sp.setAttribute("data-hl", h.id);
    last.parentNode.insertBefore(sp, last.nextSibling);
  }
}
/* 절 본문에 그 절의 형광펜을 칠한다. 자리를 못 찾은 것을 돌려준다 */
function hlApply(root, key){
  var list = hlOf(key), text = hlText(root).text, lost = [];
  HL_POS = {};
  list.forEach(function(h){
    var i = hlFind(text, h);
    if(i < 0) lost.push(h); else HL_POS[h.id] = [i, i + h.q.length];
  });
  list.forEach(function(h){ if(HL_POS[h.id]) hlWrap(root, HL_POS[h.id][0], HL_POS[h.id][1], h); });
  return lost;
}
/* 형광만 보기 — 칠한 곳이 있는 줄만 남긴다. 소제목은 그 아래에 칠한 곳이 있으면, 표는 머리 행을 남긴다 */
function hlOnly(root){
  var has = function(el){ return !!(el && el.querySelector("mark.hl")); };
  var off = function(el){ el.classList.add("hl-off"); };
  $$(".note-intro, .n-item", root).forEach(function(box){
    if(!has(box)) return off(box);
    var kids = Array.prototype.slice.call(box.children);
    kids.forEach(function(el, i){
      var tg = el.tagName;
      if(tg === "H2") return;
      if(tg === "H4" || tg === "H5"){
        for(var j = i + 1; j < kids.length; j++){
          var t2 = kids[j].tagName;
          if(t2 === "H4" || (tg === "H5" && t2 === "H5")) break;
          if(has(kids[j])) return;
        }
        return off(el);
      }
      if(el.classList.contains("n-cap") && has(kids[i+1])) return;
      if(!has(el)) return off(el);
      $$("li", el).forEach(function(li){ if(!has(li)) off(li); });
      $$("tr", el).forEach(function(tr){ if(!has(tr) && !tr.querySelector("th")) off(tr); });
    });
  });
}
function hlAfterRender(){
  hlHideUi();
  if(view.name !== "note") return;
  var root = $(".note-doc");
  if(!root) return;
  var lost = hlApply(root, noteKey(view.ch, view.c, view.s));
  if(S.settings.hlHide) root.classList.add("hl-hide");
  if(S.settings.hlOnly){
    root.classList.add("hl-only");
    hlOnly(root);
    if(!root.querySelector("mark.hl")) root.insertAdjacentHTML("afterbegin", '<p class="n-empty hl-skip">이 절에는 칠한 곳이 없습니다. [형광만 보기]를 끄면 본문 전체가 나옵니다.</p>');
  }
  var box = $("#hlLost");
  if(box && lost.length) box.innerHTML = '<div class="hl-lost"><b>위치를 찾지 못한 형광펜 '+lost.length+'개</b>'+
    '<span class="note">내용정리 원고가 바뀌어 칠했던 글자를 찾지 못했습니다. 내용은 그대로 남아 있습니다.</span>'+
    lost.map(function(h){
      return '<div class="hl-lost-row"><i class="hl-sw hl-'+esc(h.c)+'"></i><span>'+esc(h.q).replace(/\n/g, " / ")+
        (h.m ? ' <span class="note">✎ '+esc(h.m)+'</span>' : '')+'</span><button class="btn btn-sm" data-act="hldel" data-id="'+esc(h.id)+'">삭제</button></div>';
    }).join("") + '</div>';
}

/* ---- 칠하기 · 고치기 ---- */
function hlRerender(){ var y = window.scrollY; render(); window.scrollTo(0, y); }
function hlNewId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function hlAdd(sel, c){
  var root = $(".note-doc");
  if(!root || view.name !== "note") return;
  var info = hlText(root), now = Date.now(), s = sel.s, e = sel.e, memo = [], hit = true;
  /* 겹치는 형광펜은 새것에 합친다. 합쳐서 넓어진 자리가 또 다른 것과 겹칠 수 있어 더 없을 때까지 */
  while(hit){
    hit = false;
    Object.keys(HL_POS).forEach(function(id){
      var p = HL_POS[id], h = S.hl[id];
      if(!h || h.del || !(p[0] < e && p[1] > s)) return;
      s = Math.min(s, p[0]); e = Math.max(e, p[1]);
      if(h.m) memo.push(h.m);
      S.hl[id] = { k:h.k, del:1, u:now };
      hit = true;
    });
  }
  S.hl[hlNewId()] = { k:noteKey(view.ch, view.c, view.s), c:c, q:info.text.slice(s, e),
                      pre:info.text.slice(Math.max(0, s - HL_CTX), s), suf:info.text.slice(e, e + HL_CTX),
                      o:s, m:memo.join(" / "), t:now, u:now };
  save();
  try{ window.getSelection().removeAllRanges(); }catch(er){}
  hlSelNow = null;
  hlRerender();
}
function hlSet(id, patch){
  var h = S.hl[id];
  if(!h || h.del) return;
  if(patch.del) S.hl[id] = { k:h.k, del:1, u:Date.now() };
  else { Object.assign(h, patch); h.u = Date.now(); }
  save();
  hlRerender();
}

/* ---- 색 고르는 막대 · 고치기 창 ---- */
function hlEl(id, cls){
  var el = document.getElementById(id);
  if(!el){ el = document.createElement("div"); el.id = id; el.className = cls; el.hidden = true; document.body.appendChild(el); }
  return el;
}
function hlBarEl(){
  var el = document.getElementById("hlBar");
  if(el) return el;
  el = hlEl("hlBar", "hl-bar");
  el.innerHTML = HL_COLORS.map(function(c){
    return '<button type="button" data-c="'+c.id+'" title="'+esc(c.name)+'"><i class="hl-sw hl-'+c.id+'"></i><span>'+esc(c.name)+'</span></button>';
  }).join("");
  /* 막대를 누르는 순간 선택이 풀리지 않게 한다. 풀리더라도 칠할 자리는 hlSelNow 에 있다 */
  el.addEventListener("mousedown", function(e){ e.preventDefault(); });
  el.addEventListener("touchstart", function(e){ e.preventDefault(); }, { passive:false });
  el.addEventListener("pointerdown", function(e){
    var b = e.target.closest("button[data-c]");
    if(!b) return;
    e.preventDefault();
    if(hlSelNow) hlAdd(hlSelNow, b.getAttribute("data-c"));

}
function hlPlace(el, rect){
  el.hidden = false;
  var sx = window.scrollX, sy = window.scrollY, vw = document.documentElement.clientWidth, w = el.offsetWidth;
  var x = Math.max(sx + 8, Math.min(rect.left + rect.width / 2 - w / 2 + sx, sx + vw - w - 8));
  el.style.left = x + "px";
  el.style.top = (rect.bottom + sy + 10) + "px";
}
function hlHideUi(){
  var b = document.getElementById("hlBar"), p = document.getElementById("hlPop");

}
function hlOpen(id, rect){

document.addEventListener("selectionchange", function(){

/* ---- 모아보기 ---- */
function viewNoteMarks(){
  var E = noteEd(), fc = view.hc || "", hide = !!S.settings.hlHide;
  var all = hlLive().filter(function(h){ return hlEdOf(h.k) === E.id; });
  var h = '<div class="page-head"><div><div class="eyebrow">Highlights · '+esc(E.title)+'</div><h1 class="page-title">형광펜 모아보기</h1>'+

    '[가리기]를 켜면 칠한 글자가 가려져 암기 확인용 카드가 되고, 누르면 보입니다.</p></div></div>';
  if(!all.length) return h + '<div class="card"><div class="empty"><b>아직 칠한 형광펜이 없습니다</b>절 화면에서 글자를 선택하면 색을 고르는 막대가 나옵니다.</div></div>';
  var cnt = {};
  all.forEach(function(x){ cnt[x.c] = (cnt[x.c]||0) + 1; });
  h += '<div class="hl-filter">'+[{ id:"", name:"전체" }].concat(HL_COLORS).map(function(c){
      return '<button class="chip'+(fc === c.id ? ' chip-accent' : '')+'" data-act="hlfilter" data-c="'+c.id+'">'+
        (c.id ? '<i class="hl-sw hl-'+c.id+'"></i>' : '')+esc(c.name)+' '+(c.id ? (cnt[c.id]||0) : all.length)+'</button>';
    }).join("")+'<span style="flex:1"></span>'+
    '<button class="btn btn-sm'+(hide ? ' btn-primary' : '')+'" data-act="hlhide" aria-pressed="'+hide+'">가리기</button></div>';
  /* 절 키 → 과목·장·절 */
  var groups = {}, chs = {};
  all.forEach(function(x){
    var m = /^(?:13:)?(\d+)-(\d+)-(\d+)$/.exec(x.k);
    if(!m) return;
    (groups[x.k] = groups[x.k] || { ch:+m[1], c:+m[2], s:+m[3], list:[] }).list.push(x);
    chs[m[1]] = 1;
  });
  if(!needNotes(Object.keys(chs).map(Number))) return h + '<div class="card"><div class="empty"><b>내용정리를 불러오는 중…</b></div></div>';
  var keys = Object.keys(groups).sort(function(a, b){
    var A = groups[a], B = groups[b];
    return A.ch - B.ch || A.c - B.c || A.s - B.s;
  });
  var shown = 0;
  keys.forEach(function(k){
    var g = groups[k], b = noteBook(g.ch), here = b && noteFind(g.ch, g.c, g.s), text = null;
    /* 칠한 자리가 지금 본문에 아직 있는지 — 그림은 빼고 그려 본다(떨어진 요소라도 img 는 받아 오므로) */
    if(here){
      var box = document.createElement("div");
      box.innerHTML = noteDocHtml(here.S, b, E).replace(/<img[^>]*>/g, "");
      text = hlText(box).text;
    }
    var list = g.list.filter(function(x){ return !fc || x.c === fc; }).sort(function(a, b){ return (a.o||0) - (b.o||0); });
    if(!list.length) return;
    shown += list.length;
    h += '<div class="card hl-group"><div class="hl-gh"><span>'+ROMAN[g.ch]+' › '+g.c+'장 '+g.s+'절 '+(here ? esc(here.S.title) : '')+'</span>'+
      '<span class="nav-count">'+list.length+'</span></div>';
    list.forEach(function(x){
      var lost = text === null || hlFind(text, x) < 0;
      h += '<div class="hl-row"><div class="hl-row-b'+(hide ? ' hl-hide' : '')+'">'+
        '<mark class="hl hl-'+esc(x.c)+' hl-card" data-act="hlreveal">'+esc(x.q).replace(/\n/g, "<br>")+'</mark>'+
        (x.m ? '<div class="hl-m">✎ '+esc(x.m)+'</div>' : '')+
        (lost ? '<div class="hl-m"><span class="chip">위치를 찾지 못함</span> 원고가 바뀌어 본문에서 이 글자를 찾지 못했습니다</div>' : '')+
        '</div><div class="hl-row-a">'+
        '<button class="btn btn-sm" data-go="note" data-ed="'+E.id+'" data-ch="'+g.ch+'" data-c="'+g.c+'" data-s="'+g.s+'" data-h="hl-'+esc(x.id)+'">위치로 →</button>'+
        (lost ? '<button class="btn btn-sm" data-act="hldel" data-id="'+esc(x.id)+'">삭제</button>' : '')+'</div></div>';
    });
    h += '</div>';
  });
  if(!shown) h += '<div class="card"><div class="empty"><b>이 색으로 칠한 형광펜이 없습니다</b></div></div>';
  return h;
}

/* ═══════════ 동영상 강의 ═══════════
   구글 드라이브 「DAP/2. DAP 영상 강의」 과목 폴더 1 ~ 5 의 mp4 (data/video/video.js — 드라이브 파일 id 목록).
   영상은 저장소에 두지 않고 드라이브 미리보기 플레이어(iframe)로 재생한다. 파일이 소유자 전용이면
   그 구글 계정으로 로그인한 브라우저에서만 나온다 — 안 나올 때를 위해 [드라이브에서 열기]를 함께 둔다.
   과목 → 강의. 화면 주소 #/video · #/video/4-7. 처음 이 화면을 열 때 데이터를 읽는다.
   「봤음」 표시는 실기와 같이 S.notesRead 에 "vd:4-7" 로 둔다 — 동기화 병합·전체 초기화가 그대로 적용된다.
   마지막으로 연 강의는 S.settings.vdLast 에 두고 개요의 [이어 보기]로 쓴다.
   iframe 은 다시 그리면 처음부터 다시 읽히므로, 같은 강의를 다시 그릴 때는 플레이어를 두고 위·아래만 바꾼다(vdPatch). */
var VD = null, VD_WAIT = null, VD_FAIL = false;
var VD_FILE = (window.DAP_MANIFEST && window.DAP_MANIFEST.video) || "";
window.DAP_VIDEO = { add: function(b){ if(b && b.items) VD = b; } };
function isVdView(name){ return name === "video" || name === "vdq"; }
function loadVd(done){
  if(VD || !VD_FILE || VD_FAIL){ if(done) done(); return; }
  if(VD_WAIT){ if(done) VD_WAIT.push(done); return; }
  VD_WAIT = done ? [done] : [];
  var el = document.createElement("script");
  el.src = "data/" + VD_FILE;
  el.charset = "UTF-8";
  el.onload = el.onerror = function(){
    var cbs = VD_WAIT; VD_WAIT = null;
    if(!VD){ VD_FAIL = true; toast("강의 목록 파일을 불러오지 못했습니다 · " + VD_FILE); }
    cbs.forEach(function(f){ f(); });
  };
  document.head.appendChild(el);
}
function needVd(){
  if(VD || VD_FAIL || !VD_FILE) return true;
  loadVd(function(){ if(isVdView(view.name)) render(); });
  return false;
}
function vdKey(id){ return "vd:" + id; }
function vdDone(id){ return !!(S.notesRead && S.notesRead[vdKey(id)]); }
function vdFind(id){ return VD ? VD.items.filter(function(x){ return x.id === id; })[0] || null : null; }
function vdSub(ch){ return VD ? VD.subjects.filter(function(s){ return s.ch === ch; })[0] || null : null; }
function vdItems(ch){ return VD.items.filter(function(x){ return x.ch === ch; }); }
function vdMin(sec){ return Math.round(sec / 60) + "분"; }
function vdHours(sec){ var m = Math.round(sec / 60); return m < 60 ? m + "분" : Math.floor(m / 60) + "시간" + (m % 60 ? " " + (m % 60) + "분" : ""); }
function vdCount(xs){
  xs = xs || (VD ? VD.items : []);
  var d = xs.filter(function(x){ return vdDone(x.id); });
  return { done:d.length, total:xs.length,
           sec:xs.reduce(function(a, x){ return a + (x.sec || 0); }, 0),
           dsec:d.reduce(function(a, x){ return a + (x.sec || 0); }, 0) };
}
function vdUrl(drive, preview){ return "https://drive.google.com/file/d/" + encodeURIComponent(drive) + (preview ? "/preview" : "/view"); }
function vdLabel(x){ return (x.tag ? "[" + x.tag + "] " : "") + x.title; }

/* ---- 레일: 과목별 강의 목록 ----
   과목마다 접고 편다. 처음엔 모두 접혀 있고, 강의를 열면 그 과목이 펴진다(실기 DM_OPEN 과 같다) */

    h += '</div>';

  $("#navChap").innerHTML = h;
}

/* ---- 강의 화면 ----
   플레이어 위(vdTop)·아래(vdBot)를 나눠 만들어, 같은 강의를 다시 그릴 때는 플레이어를 그대로 둔다 */
function vdTop(it){
  var sub = vdSub(it.ch), done = vdDone(it.id);
