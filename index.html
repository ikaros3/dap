/* ---- PC 로컬 폴더 재생 ----
   드라이브 플레이어는 다른 사이트(iframe)라 속도를 0.25 단위로밖에 못 고른다. Chrome·Edge(PC)에서
   「2. DAP 영상 강의」 폴더(구글 드라이브 데스크톱으로 동기화된 G:\내 드라이브\DAP\…)를 한 번 골라 두면
   앱이 <video> 로 직접 재생해 1.1 · 1.15배속 같은 속도를 쓸 수 있다. 각 강의의 위치는 video.js 의 file.
   폴더 핸들은 진도 파일 핸들과 같은 IndexedDB 에 "video" 로 둔다. 다시 열면 브라우저가 권한을 다시 물을 수 있어
   (queryPermission 이 prompt) 그때는 [로컬 재생 켜기]를 눌러야 한다 — 권한 요청은 사용자 클릭 안에서만 된다.
   속도는 S.settings.vdRate(동기화), 강의별 재생 위치는 이 기기 localStorage(VD_POS)에만 둔다. */
var VD_RATES = [1, 1.1, 1.15, 1.25, 1.5, 1.75, 2];
var VD_HKEY = "video", VD_POS = "dap750:vdpos";
var vdDir = null, vdDirOk = false, vdObjUrl = "", VD_MISS = {};
function vdLocalSupported(){ return typeof window.showDirectoryPicker === "function"; }
function vdLocal(it){ return !!(vdDir && vdDirOk && it && it.file && !VD_MISS[it.id]); }
function vdRestoreDir(){
  if(!vdLocalSupported()) return;
  idbGet(function(h){
    if(!h || h.kind !== "directory") return;
    vdDir = h;
    vdPerm(false, function(){ if(isVdView(view.name)) render(); });
  }, VD_HKEY);
}
function vdPerm(ask, done){
  var o = { mode:"read" };
  Promise.resolve().then(function(){ return ask ? vdDir.requestPermission(o) : vdDir.queryPermission(o); })
    .then(function(p){ vdDirOk = p === "granted"; }, function(){ vdDirOk = false; })
    .then(function(){ if(done) done(); });
}
function vdFileOf(it){
  var parts = it.file.split("/"), d = Promise.resolve(vdDir);
  parts.slice(0, -1).forEach(function(p){ d = d.then(function(h){ return h.getDirectoryHandle(p); }); });
  return d.then(function(h){ return h.getFileHandle(parts[parts.length - 1]); }).then(function(fh){ return fh.getFile(); });
}
/* 폴더를 고르면 첫 강의 파일이 있는지로 맞는 폴더인지 본다 */
function vdPick(){
  if(!vdLocalSupported() || !VD) return;
  window.showDirectoryPicker({ id:"dap-video", mode:"read" }).then(function(h){
    var prev = [vdDir, vdDirOk];
    vdDir = h; vdDirOk = true;
    vdFileOf(VD.items[0]).then(function(){
      VD_MISS = {};
      idbPut(h, VD_HKEY);
      toast("강의 폴더를 연결했습니다 — 이 기기에서는 앱이 직접 재생합니다");
      render();
    }, function(){
      vdDir = prev[0]; vdDirOk = prev[1];
      toast("강의 파일을 찾지 못했습니다 · 「2. DAP 영상 강의」 폴더를 골라 주세요");
    });
  }, function(){});
}
function vdUnlink(){
  vdDir = null; vdDirOk = false; VD_MISS = {};
  idbDel(VD_HKEY);
  toast("강의 폴더 연결을 해제했습니다 — 드라이브 플레이어로 재생합니다");
  render();
}
function vdPosAll(){ try{ return JSON.parse(localStorage.getItem(VD_POS)) || {}; }catch(e){ return {}; } }
function vdPosSet(id, t){
  var o = vdPosAll();
  if(t > 0) o[id] = Math.round(t); else delete o[id];
  try{ localStorage.setItem(VD_POS, JSON.stringify(o)); }catch(e){}
}
function vdRateMark(){
  var cur = S.settings.vdRate || 1;
  $$(".vd-rates button").forEach(function(b){ b.setAttribute("aria-pressed", String(+b.getAttribute("data-rate") === cur)); });
}
/* 그린 뒤 로컬 플레이어에 파일을 물린다. 파일이 없으면 그 강의만 드라이브 플레이어로 */
function vdAttach(){
  var it = vdFind(view.id), v = $(".vd-player video");
  if(!it || !v) return;
  vdFileOf(it).then(function(f){
    if(!v.isConnected) return;
    if(vdObjUrl) URL.revokeObjectURL(vdObjUrl);
    vdObjUrl = URL.createObjectURL(f);
    var rate = S.settings.vdRate || 1, last = 0;
    v.defaultPlaybackRate = rate;
    v.addEventListener("loadedmetadata", function(){
      v.playbackRate = rate;
      var p = vdPosAll()[it.id] || 0;
      if(p > 15 && p < v.duration - 30){ v.currentTime = p; toast("지난번 위치 " + fmtTime(p) + " 부터 이어서 재생합니다"); }
    }, { once:true });
    v.addEventListener("ratechange", function(){
      if(v.playbackRate !== (S.settings.vdRate || 1)){ S.settings.vdRate = v.playbackRate; save(); }
      vdRateMark();
    });
    v.addEventListener("timeupdate", function(){
      if(Math.abs(v.currentTime - last) >= 5){ last = v.currentTime; vdPosSet(it.id, v.currentTime); }
    });
    v.addEventListener("pause", function(){ vdPosSet(it.id, v.currentTime); });
    v.addEventListener("ended", function(){ vdPosSet(it.id, 0); });
    v.src = vdObjUrl;
  }, function(){
    VD_MISS[it.id] = true;
    toast("로컬 폴더에서 강의 파일을 찾지 못했습니다 · 드라이브 플레이어로 엽니다");
    if(view.name === "vdq" && view.id === it.id) render();
  });
}

/* ─────────── 렌더 ─────────── */
function render(){
  regradeByKey();   /* 정답을 바로잡은 문항이 있으면 응시 점수·오답노트를 맞춘다 */
  renderRail();
  var m = $("#main"), h="";
  switch(view.name){
    case "dash": h = viewDash(); break;
    case "chapter": h = viewChapter(view.ch); break;
    case "exams": h = viewExams(); break;
    case "wrong": h = viewWrong(); break;
    case "review": h = viewReview(); break;
    case "marks": h = viewMarks(); break;
    case "search": h = viewSearch(); break;
    case "settings": h = viewSettings(); break;
    case "notes": h = viewNotesHome(); break;
    case "note": h = viewNote(); break;
    case "nsearch": h = viewNoteSearch(); break;
    case "nhl": h = viewNoteMarks(); break;
    case "dm": h = viewDmHome(); break;
    case "dmq": h = viewDmQ(); break;
    case "video": h = viewVdHome(); break;
    case "vdq": if(vdPatch(m)){ hlAfterRender(); return; } h = viewVdQ(); break;
    case "slides": h = viewSoon(view.name); break;
    case "quiz": h = session ? viewQuiz() : viewDash(); break;
    case "result": h = viewResult(); break;
    default: h = viewDash();
  }
  m.innerHTML = h;
  hlAfterRender();
  if(view.name === "vdq") vdAttach();
  if(view.name==="quiz" && session && session.limitSec) startTimer();
  if(view.name==="search"){ var i=$("#q"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
  if(view.name==="nsearch"){ var ni=$("#nq"); if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length,ni.value.length); } }
}
function startTimer(){
  if(timerH) clearInterval(timerH);
  function tick(){
    if(!session) return;
    var spent = Math.round((Date.now()-session.start)/1000);
    session.spent = spent; S.sessions[session.key] = session;
    var left = session.limitSec - spent;
    var el = $("#timer"); if(!el) return;
    el.textContent = fmtTime(Math.abs(left)) + (left<0?" 초과":"");
    el.classList.toggle("warn", left <= 300);
    if(left<=0 && left>-2){ toast("제한 시간이 종료되었습니다"); }
  }
  tick(); timerH = setInterval(tick, 1000);
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-go],[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act"), dest = t.getAttribute("data-go");

  if(dest){
    if(dest==="chapter") return go("chapter", { ch:+t.getAttribute("data-ch") });
    if(dest==="note") return go("note", { ed:t.getAttribute("data-ed") || "", ch:+t.getAttribute("data-ch"), c:+t.getAttribute("data-c"), s:+t.getAttribute("data-s"),
                                          h:t.getAttribute("data-h") || "", topic:t.getAttribute("data-topic") || "" });
    if(dest==="dmq") return go("dmq", { id:t.getAttribute("data-id") });
    if(dest==="vdq") return go("vdq", { id:t.getAttribute("data-id") });
    if(dest==="randomexam"){
      return startSession({ key:"rand", mode:"exam", title:"랜덤 모의고사", ids:randomExamIds(),
                            limitSec:S.settings.timerMin*60, setNo:0 });
    }
    return go(dest);
  }

  switch(act){
    /* ── 내용정리 ── */
    case "mode": {
      var md = t.getAttribute("data-mode");
      if(md === curMode && view.name !== "settings") break;
      var lv = lastView[md];
      go(lv.name, lv);
      break;
    }
    case "cat": {
      var cg = CATS.filter(function(c){ return c.id === t.getAttribute("data-cat"); })[0];
      var cm = catLast[cg.id] || cg.modes[0];
      if(catOf(curMode) === cg && view.name !== "settings") break;
      go(lastView[cm].name, lastView[cm]);
      break;
    }
    /* ── 실기 ── */
    case "dmdone": {
      S.notesRead = S.notesRead || {};
      var dk = dmKey(view.id);
      if(S.notesRead[dk]) delete S.notesRead[dk]; else S.notesRead[dk] = Date.now();
      save(); render();
      break;
    }
    case "dmhide": S.settings.dmHide = !S.settings.dmHide; view.show = false; save(); render(); break;
    case "dmshow": view.show = true; render(); break;
    case "dmzoom": dmzOpen(t.getAttribute("data-img")); break;
    case "dmtoggle": {
      var dl = +t.getAttribute("data-lv");
      DM_OPEN[dl] = !DM_OPEN[dl];
      renderRail();
      break;
    }
    /* ── 동영상 강의 ── */
    case "vddone": {
      S.notesRead = S.notesRead || {};
      var vk = vdKey(view.id);
      if(S.notesRead[vk]) delete S.notesRead[vk]; else S.notesRead[vk] = Date.now();
      save(); render();
      break;
    }
    case "vdrate": {
      var rr = +t.getAttribute("data-rate"), vv = $(".vd-player video");
      S.settings.vdRate = rr; save();
      if(vv){ vv.defaultPlaybackRate = rr; vv.playbackRate = rr; }
      vdRateMark();
      break;
    }
    case "vdpick": vdPick(); break;
    case "vdperm": vdPerm(true, render); break;
    case "vdunlink": vdUnlink(); break;
    case "vdtoggle": {
      var vc = +t.getAttribute("data-ch");
      VD_OPEN[vc] = !VD_OPEN[vc];
      renderRail();
      break;
    }
    case "ntoggle": {
      var nc = nk("", +t.getAttribute("data-ch"));
      NOTE_OPEN[nc] = !NOTE_OPEN[nc];
      renderRail();
      break;
    }
    case "nscroll": {
      scrollToNote(t.getAttribute("data-to"));
      var dm = t.closest("details"); if(dm) dm.open = false;
      break;
    }
    case "noteread": {
      S.notesRead = S.notesRead || {};
      var rk = noteKey(view.ch, view.c, view.s);
      if(S.notesRead[rk]) delete S.notesRead[rk]; else S.notesRead[rk] = Date.now();
      save(); render();
      break;
    }
    case "notequiz": {
      var nb = t.getAttribute("data-bank");
      var rel = noteQuestions(view.ch, view.c, view.s).filter(function(x){ return x.bank.id === nb; })[0];
      if(!rel) break;
      var nh = noteFind(view.ch, view.c, view.s);
      if(nb !== DAP.id){ useBank(nb); S.settings.bank = DAP.id; save(); applyBrand(); }
      startSession({ key:"note:"+noteKey(view.ch, view.c, view.s), mode:"study", seq:true,
                     title:ROMAN[view.ch]+". "+view.c+"장 "+view.s+"절 "+(nh ? nh.S.title : ""), ids:rel.ids.slice() });
      break;
    }
    case "donsearch": go("nsearch", { kw: $("#nq").value }); break;
    /* ── 형광펜 ── */
    case "hlmark": {
      var hsl = window.getSelection();
      if(hsl && !hsl.isCollapsed) break;             /* 칠한 곳 위에서 글자를 고르는 중 */
      var hid = t.getAttribute("data-hl");
      if(S.settings.hlHide && t.tagName === "MARK"){
        $$('mark[data-hl="'+hid+'"]').forEach(function(el){ el.classList.toggle("show"); });
        break;
      }
      hlOpen(hid, t.getBoundingClientRect());
      break;
    }
    case "hlreveal": if(S.settings.hlHide) t.classList.toggle("show"); break;
    case "hlcolor": hlSet(t.getAttribute("data-id"), { c:t.getAttribute("data-c") }); break;
    case "hlsave": { var hm = $("#hlMemo"); hlSet(t.getAttribute("data-id"), { m:hm ? hm.value.trim() : "" }); break; }
    case "hldel": hlSet(t.getAttribute("data-id"), { del:1 }); break;
    case "hlclose": hlHideUi(); break;
    case "hlhide": S.settings.hlHide = !S.settings.hlHide; save(); hlRerender(); break;
    case "hlonly": S.settings.hlOnly = !S.settings.hlOnly; save(); hlRerender(); break;
    case "hlfilter": view.hc = t.getAttribute("data-c") || ""; render(); break;
    case "resume": resumeSession(t.getAttribute("data-key")); break;
    case "dropsession":
      dropSession(t.getAttribute("data-key")); render();
      toast("진행 중이던 세션을 삭제했습니다"); break;
    case "startch": {
      var ch = +t.getAttribute("data-ch"), range = t.getAttribute("data-range");
      var ids = chapterIds(ch, range);
      if(!ids.length){ toast("해당 조건의 문항이 없습니다"); break; }
      var lbl = { all:"전체", unseen:"안 푼 문항", wrong:"오답", rand25:"무작위 "+blockSize(ch)+"문항" }[range];
      startSession({ key:"ch"+ch+":"+range, fresh:!!t.getAttribute("data-fresh"),
                     seq: range==="all" || range==="unseen",

    case "retrywrong": {
      var e = S.exams.filter(function(x){ return x.id===t.getAttribute("data-id"); })[0];
      if(!e) break;
      var ms = Object.keys(e.answers).filter(function(id){ return QMAP[id] && !isRight(QMAP[id], e.answers[id]); });
      if(!ms.length){ toast("틀린 문항이 없습니다"); break; }
      startSession({ key:"retry:"+e.id, mode:"study", title:e.title+" 오답 "+ms.length+"문항", ids:ms });
      break;

    case "openexam": go("result", { examId: t.getAttribute("data-id") }); break;
    case "exampage": examPage = +t.getAttribute("data-p"); render(); break;
    case "rvjump": view.rq = +t.getAttribute("data-i"); render(); break;
    case "rvclose": view.rq = null; render(); break;
    case "rvmissed": {

    case "rvallmissed": {

      var allOpen = rids.length && rids.every(function(id){ return view.rvOpen && view.rvOpen[id]; });

    case "delexam": {
      var xid = t.getAttribute("data-id");

      var undo = rollbackExam(ex);

      toast("응시 기록 삭제 · "+undo.touched+"문항 통계 되돌림"+

    case "unwrong": delete S.wrong[t.getAttribute("data-id")]; save(); render(); break;
    case "clearwrong":

      break;
    case "togglemark": {

    case "reveal": reveal(); break;

    case "prev": if(session.idx>0){ session.idx--; save(); render(); } break;
    case "jump": session.idx = +t.getAttribute("data-i"); save(); render(); break;
    case "mark": {

    case "submit": {

    case "quit": {

    case "makepack":   makeEncryptedPack(); break;
    case "forgetpw":   forgetPw(t.getAttribute("data-id")); break;

/* ─────────── 진도 파일 내보내기 / 가져오기 ─────────── */
/* ═══════════ 진도 파일 ═══════════
   파일은 하나만 쓴다. 처음 저장할 때 위치를 한 번 고르면 그 파일 핸들을
   IndexedDB 에 보관해 두고, 이후 저장은 같은 파일을 조용히 덮어쓴다.
   (File System Access API 미지원 브라우저는 같은 이름으로 내려받기 — 이 경우
    브라우저가 "dap-progress (1).json" 처럼 번호를 붙일 수 있다.) */
var PROGRESS_FILE = "dap-progress.json";
var fileHandle = null;          /* 연결된 저장 위치 */

/* ---- 핸들 보관용 초경량 IndexedDB ---- */
var HDB = "dap750-fs", HSTORE = "handles", HKEY = "progress";
function idb(cb){
  try{
    if(!window.indexedDB) return cb(null);
    var rq = indexedDB.open(HDB, 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore(HSTORE); };
    rq.onsuccess = function(){ cb(rq.result); };
    rq.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
/* key 를 주지 않으면 진도 파일 핸들(HKEY). 동영상 강의 폴더 핸들은 "video" 로 둔다 */
function idbPut(val, key){
  idb(function(db){
    if(!db) return;
    try{ db.transaction(HSTORE, "readwrite").objectStore(HSTORE).put(val, key || HKEY); }catch(e){}
  });
}
function idbGet(cb, key){
  idb(function(db){
    if(!db) return cb(null);
    try{
      var rq = db.transaction(HSTORE, "readonly").objectStore(HSTORE).get(key || HKEY);
      rq.onsuccess = function(){ cb(rq.result || null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function idbDel(key){
  idb(function(db){
    if(!db) return;
    try{ db.transaction(HSTORE, "readwrite").objectStore(HSTORE).delete(key || HKEY); }catch(e){}
  });
}

function fsSupported(){ return typeof window.showSaveFilePicker === "function"; }
function fileLinked(){ return !!fileHandle; }

/* 시작할 때 지난번 저장 위치를 되살린다 */
function restoreFileHandle(){
  if(!fsSupported()) return;
  idbGet(function(h){
    if(!h || typeof h.createWritable !== "function") return;
    fileHandle = h;
    if(view.name === "settings") render();
  });
}

/* 직렬화만 한다. 예전에는 여기서 session.idx 를 firstUnsolved 로 옮겼는데,
   동기화는 퀴즈를 푸는 도중에도 돌기 때문에 화면은 그대로인 채 위치만 바뀌어
   다음 클릭이 엉뚱한 문항에 기록되는 사고가 났다. 위치는 세션에 들어갈 때
   startSession/resumeSession 이 이미 정한다. */
function payloadText(){
  if(session && session.key){ S.sessions[session.key] = session; }
  return JSON.stringify({
    app:"dap750", ver:2, savedAt:Date.now(), savedAtText:fmtDate(Date.now()),
    summary:{ solved:overall().seen, wrong:wrongIds().length,
              bookmarks:bookmarkIds().length, exams:S.exams.length,
              openSessions:liveSessions().length },
    data:S
  }, null, 0);
}

function exportProgress(){
  var text = payloadText();
  if(fsSupported()){ saveViaPicker(text); return; }
  downloadFallback(text);
}

/* 연결된 핸들이 있으면 그대로 덮어쓰고, 없으면 한 번만 위치를 묻는다 */
function saveViaPicker(text){
  if(fileHandle){ writeHandle(fileHandle, text, false); return; }
  var opts = {
    suggestedName: PROGRESS_FILE,
    types:[{ description:"DAP 진도 파일", accept:{ "application/json":[".json"] } }]
  };
  window.showSaveFilePicker(opts).then(function(h){
    fileHandle = h; idbPut(h);
    writeHandle(h, text, true);
  }, function(err){
    if(err && err.name === "AbortError"){ toast("저장을 취소했습니다"); return; }
    downloadFallback(text);
  });
}

function writeHandle(h, text, isNew){
  function run(){
    h.createWritable().then(function(w){
      /* UTF-8 로 기록 — Blob 의 기본 인코딩이 UTF-8 이라 한글이 깨지지 않는다 */
      return w.write(new Blob([text], { type:"application/json;charset=utf-8" }))
              .then(function(){ return w.close(); });
    }).then(function(){
      toast((isNew ? "저장 위치를 연결했습니다 · " : "") + (h.name || PROGRESS_FILE) + " 에 덮어썼습니다");
      if(view.name === "settings") render();
    }, function(){
      fileHandle = null; idbDel();
      toast("저장에 실패했습니다 · 위치를 다시 지정해 주세요");
      downloadFallback(text);
    });
  }
  /* 권한이 끊겼으면 다시 요청 */
  if(typeof h.queryPermission === "function"){
    h.queryPermission({ mode:"readwrite" }).then(function(p){
      if(p === "granted") return run();
      if(typeof h.requestPermission !== "function"){ return run(); }
      h.requestPermission({ mode:"readwrite" }).then(function(p2){
        if(p2 === "granted") run();
        else toast("파일 쓰기 권한이 없습니다");
      }, run);
    }, run);
  }else run();
}

function unlinkFile(){
  fileHandle = null; idbDel();
  toast("저장 위치 연결을 해제했습니다 · 다음 저장 때 다시 고릅니다");
  render();
}

/* File System Access API 가 없을 때: 같은 이름으로 내려받기 */
function downloadFallback(text){
  try{
    var blob = new Blob([text], { type:"application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = PROGRESS_FILE; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast(PROGRESS_FILE + " 저장됨 · 기존 파일을 덮어쓰세요");
  }catch(e){
    var box = $("#ioBox");
    if(box){ box.style.display = "block"; box.value = text; box.select(); }
    toast("파일 저장이 막혀 있습니다 · 아래 내용을 복사해 두세요");
  }
}
/* 파일 선택 → 읽기 → 교체 또는 병합 */
document.addEventListener("input", function(ev){
  if(!ev.target || ev.target.id!=="fsBar") return;
  render_fs(setFontScale(parseFloat(ev.target.value)));
});
document.addEventListener("change", function(ev){
  if(ev.target && ev.target.id==="packIn"){
    var pf = ev.target.files && ev.target.files[0];
    if(pf) handlePackFile(pf);
    return;
  }
  if(ev.target && ev.target.id==="syncAuto"){
    sync.auto = !!ev.target.checked; saveSync();
    toast(sync.auto ? "자동 동기화 켬" : "자동 동기화 끔");
    if(!sync.auto && syncT){ clearTimeout(syncT); syncT = null; }
    return;
  }
  if(!ev.target || ev.target.id!=="fileIn") return;
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onerror = function(){ toast("파일을 읽지 못했습니다"); };
  r.onload = function(){
    var inc;
    try{
      var o = JSON.parse(String(r.result));
      inc = (o && o.data && o.data.stats) ? o.data : o;   /* 래핑 형식과 예전 원본 형식 모두 허용 */
      if(!inc || typeof inc !== "object" || !inc.stats) throw 0;
      inc = normalize(inc);
    }catch(err){ toast("DAP 진도 파일이 아닙니다"); return; }

    var incSolved = Object.keys(inc.stats).length, curSolved = Object.keys(S.stats).length;
    var replace = confirm(
      "불러온 파일: "+incSolved+"문항 기록\n현재 기기: "+curSolved+"문항 기록\n\n"+
      "[확인] 파일 내용으로 전체 교체\n[취소] 현재 기록과 병합");
    S = replace ? inc : mergeState(S, inc);
    session = null; save();
    go("dash");
    toast((replace?"불러왔습니다 · ":"병합했습니다 · ")+Object.keys(S.stats).length+"문항 기록 · 진행 중 "+liveSessions().length+"건");
  };
  r.readAsText(f);
});
/* 전체 초기화는 "지웠다"는 사실 자체를 실어 보내야 한다. 병합은 합집합이라
   한쪽에서 지운 것을 다른 쪽에 남은 기록이 그대로 되살리기 때문이다.
   epoch = 마지막 전체 초기화 시각. 더 최근에 초기화한 쪽이 이기고,
   그 시각보다 오래된 기록은 양쪽에서 버린다. 초기화 뒤에 푼 것은 살아남는다. */
function applyEpoch(o, epoch){
  if(!epoch) return o;
  Object.keys(o.stats).forEach(function(id){
    if((o.stats[id].last||0) < epoch) delete o.stats[id];
  });
  Object.keys(o.wrong).forEach(function(id){ if(!o.stats[id]) delete o.wrong[id]; });
  o.exams = o.exams.filter(function(e){ return e && (e.ts||0) >= epoch; });
  Object.keys(o.sessions).forEach(function(k){
    if((o.sessions[k].ts||0) < epoch) delete o.sessions[k];
  });
  Object.keys(o.notesRead||{}).forEach(function(k){ if((o.notesRead[k]||0) < epoch) delete o.notesRead[k]; });
  Object.keys(o.hl||{}).forEach(function(id){ if(((o.hl[id]||{}).u||0) < epoch) delete o.hl[id]; });
  /* 북마크에는 시각이 없어 초기화 이전 것을 가려낼 수 없다. 통째로 지운다. */
  o.bookmarks = {};
  o.epoch = epoch;
  return o;
}
function clone(o){ return normalize(JSON.parse(JSON.stringify(o))); }

function mergeState(cur, inc){
  var out = clone(cur);
  /* 어느 한쪽이 더 최근에 초기화했다면, 그 시각 이전 기록은 양쪽에서 걷어낸 뒤 병합한다 */
  var epoch = Math.max(out.epoch||0, inc.epoch||0);
  if(epoch > (out.epoch||0)) applyEpoch(out, epoch);
  if(epoch > (inc.epoch||0)) inc = applyEpoch(clone(inc), epoch);
  out.epoch = epoch;
  /* 병합 전 이쪽이 각 문항을 마지막으로 푼 시각. 오답노트를 정리할 때 쓴다. */
  var mineLast = {};
  Object.keys(out.stats).forEach(function(id){ mineLast[id] = out.stats[id].last||0; });
  /* 문항 통계: 시도 횟수가 많은 쪽을 채택하고, 복습 일정은 더 최근 기록을 따른다 */
  Object.keys(inc.stats).forEach(function(id){
    var a = out.stats[id], b = inc.stats[id];
    if(!a){ out.stats[id] = b; return; }
    var newer = (b.last||0) > (a.last||0) ? b : a;
    out.stats[id] = {
      right: Math.max(a.right||0, b.right||0),
      wrong: Math.max(a.wrong||0, b.wrong||0),
      box: newer.box, due: newer.due,
      /* 고른 보기는 더 최근 쪽을 따르되, 한쪽에만 있으면 그것을 살린다 */
      pick: (newer.pick !== undefined ? newer.pick
             : (a.pick !== undefined ? a.pick : b.pick)),
      last: Math.max(a.last||0, b.last||0)
    };
  });
  /* 북마크는 시각이 없어 해제를 알 수 없다. 갈라졌을 때는 합집합으로 둔다.
     평상시(빠른 감기)에는 최신판을 그대로 쓰므로 해제도 정상 전달된다. */
  Object.keys(inc.bookmarks).forEach(function(id){ out.bookmarks[id] = true; });
  /* 오답노트: 한쪽에서 지운 것을 무턱대고 되살리지 않는다. 이쪽이 그 문항을
     더 최근에 풀었다면 오답에서 빠진 것이 이쪽의 최신 판단이므로 그대로 둔다. */
  Object.keys(inc.wrong).forEach(function(id){
    if(id in out.wrong) return;
    if((mineLast[id]||0) > ((inc.stats[id] && inc.stats[id].last)||0)) return;
    out.wrong[id] = inc.wrong[id];
  });
  /* 모의고사 이력: id 기준 중복 제거 후 최신순 */
  var seen = {}, all = out.exams.concat(inc.exams);
  out.exams = all.filter(function(e){ if(!e||!e.id||seen[e.id]) return false; seen[e.id]=1; return true; })
                 .sort(function(a,b){ return b.ts-a.ts; }).slice(0,60);
  /* 내용정리 읽음 표시: 합집합 (시각은 늦은 쪽). 시각이 있어 초기화(epoch) 이전 것은 걸러진다 */
  Object.keys(inc.notesRead||{}).forEach(function(k){
    out.notesRead[k] = Math.max(out.notesRead[k]||0, inc.notesRead[k]||0);
  });
  /* 형광펜: 형광펜마다 늦게 고친 쪽(u). 지운 것도 del 로 남아 있어 지움이 되살아나지 않는다 */
  Object.keys(inc.hl||{}).forEach(function(id){
    var a = out.hl[id], b = inc.hl[id];
    if(b && (!a || (b.u||0) > (a.u||0))) out.hl[id] = b;
  });
  /* 진행 중 세션: 같은 키면 더 최근에 손댄 쪽 */
  Object.keys(inc.sessions).forEach(function(k){
    var a = out.sessions[k], b = inc.sessions[k];
    if(!a || (b.ts||0) > (a.ts||0)) out.sessions[k] = b;
  });
  return out;
}

/* ═══════════ 진도 동기화 (비공개 GitHub Gist) ═══════════
   Gist 하나를 원본으로 삼아 기기마다 가져와 병합하고 다시 올린다.
   충돌 처리는 mergeState() 를 그대로 쓴다 — 문항별 last 타임스탬프 기준.

   토큰은 S 와 분리된 키에 보관한다. S 는 진도 파일로 내보내지므로
   여기에 토큰을 넣으면 파일을 공유할 때 같이 새어 나간다. */
var SYNC_KEY  = "dap750:sync";
var SYNC_FILE = PROGRESS_FILE;            /* Gist 안의 파일 이름 */
var SYNC_WAIT = 20000;                    /* 기록이 바뀐 뒤 올리기까지 대기 */
var syncBusy = false, syncT = null, syncMsg = "";
/* 초기화가 일어나면 올라간다. 이미 시작된 동기화는 자기 세대가 낡았으면 손을 뗀다.
   그러지 않으면 초기화 직전에 읽어 둔 옛 기록이 병합되어 그대로 되살아난다. */
var wipeGen = 0;
/* 기록이 바뀔 때마다 오른다. 올리기를 시작한 시점과 응답이 온 시점을 견주어,
   그 사이에 푼 문항이 있으면 dirty 를 내려놓지 않는다. 내려놓으면 그 답은
   영영 올라가지 않고, 다른 기기가 앞설 때 pull 로 사라진다. */
var changeSeq = 0;

/* base   = 이 기기가 마지막으로 받아오거나 올린 판 번호
   baseBy = 그 판을 쓴 기기
   dirty  = 그 뒤로 이 기기에서 기록이 바뀌었는가
   wid    = 이 기기의 식별자. 판 번호가 같아도 쓴 기기가 다르면 서로 다른 판이다.
            Gist API 에는 조건부 쓰기가 없어 두 기기가 같은 판 위에서 동시에 올리면
            나중 것이 앞 것을 덮는다. 그 사고를 뒤늦게라도 알아채는 표식이다.
   모두 토큰과 같은 키에 둔다. S 에 넣으면 진도 파일로 내보낼 때 따라 나가
   다른 기기에서 불러왔을 때 남의 판 번호를 자기 것으로 착각한다. */
function newWid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function loadSync(){
  try{
    var o = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}");
    return { token:o.token||"", gistId:o.gistId||"", last:o.last||0, auto:o.auto!==false,
             base:o.base||0, baseBy:o.baseBy||"", dirty:!!o.dirty, wid:o.wid||newWid() };
  }catch(e){ return { token:"", gistId:"", last:0, auto:true,
                      base:0, baseBy:"", dirty:false, wid:newWid() }; }
}
var sync = loadSync();
/* 새로 만든 기기 식별자는 곧바로 저장해 둔다. 저장되지 않으면 새로고침마다 바뀌어
   덮어쓰기 감지(baseBy 비교)가 헛돈다. */
try{ var _sv=JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"); if(!_sv.wid){ _sv.wid=sync.wid; localStorage.setItem(SYNC_KEY, JSON.stringify(_sv)); } }catch(e){}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){} }
/* 이 기기에서 기록이 바뀌었다는 표시. 이것이 없으면 동기화가 이쪽을 "받아온 그대로"로
   보고 통째로 덮어써 버린다. save() 안에서 곧바로(디바운스 이전에) 세운다. */
function markDirty(){
  changeSeq++;
  if(typeof sync === "undefined" || sync.dirty) return;
  sync.dirty = true; saveSync();
}
function syncOn(){ return !!(sync.token && sync.gistId); }
function syncStatus(m){
  syncMsg = m || "";
  var el = $("#syncMsg");
  if(el) el.textContent = syncMsg;
}

function ghReq(method, path, body, ok, err){
  var x = new XMLHttpRequest();
  x.open(method, "https://api.github.com" + path, true);
  x.setRequestHeader("Accept", "application/vnd.github+json");
  x.setRequestHeader("Authorization", "Bearer " + sync.token);
  if(body) x.setRequestHeader("Content-Type", "application/json");
  x.onload = function(){
    if(x.status >= 200 && x.status < 300){
      var j = null;
      try{ j = JSON.parse(x.responseText || "{}"); }catch(e){ err("응답을 해석하지 못했습니다"); return; }
      ok(j);
    }
    else if(x.status === 401) err("토큰이 거부되었습니다 (401) · gist 권한을 확인하세요");
    else if(x.status === 403) err("요청이 거부되었습니다 (403) · 잠시 후 다시 시도하세요");
    else if(x.status === 404) err("Gist 를 찾을 수 없습니다 (404) · ID 와 토큰 주인을 확인하세요");
    else err("GitHub 오류 " + x.status);
  };
  x.onerror = function(){ err("네트워크에 연결하지 못했습니다"); };
  x.send(body ? JSON.stringify(body) : null);
}

/* Gist 에서 진도 본문을 읽는다. 아직 비어 있으면 null 을 넘긴다. */
function gistRead(cb, err){
  ghReq("GET", "/gists/" + encodeURIComponent(sync.gistId), null, function(g){
    var f = g.files && g.files[SYNC_FILE];
    if(!f){ cb(null); return; }
    /* 1MB 를 넘으면 content 가 잘려 오므로 원본 URL 로 다시 받는다 */
    if(f.truncated && f.raw_url){
      var x = new XMLHttpRequest();
      x.open("GET", f.raw_url, true);
      x.onload  = function(){ cb(x.status < 300 ? x.responseText : null); };
      x.onerror = function(){ err("Gist 원본을 내려받지 못했습니다"); };
      x.send(null);
      return;
    }
    cb(f.content || null);
  }, err);
}

/* 진도 파일 본문 → 정규화된 상태. 형식이 아니면 null */
function parsePayload(text){
  try{
    var o = JSON.parse(String(text));
    var inc = (o && o.data && o.data.stats) ? o.data : o;
    if(!inc || typeof inc !== "object" || !inc.stats) return null;
    return normalize(inc);
  }catch(e){ return null; }
}

/* 가져오기 → 병합 → 올리기. quiet 면 토스트를 띄우지 않는다. */
function syncNow(quiet){
  if(!syncOn()){ if(!quiet) toast("먼저 GitHub 토큰을 연결하세요"); return; }
  /* 이미 돌고 있으면 버리지 말고 뒤로 미룬다. 그냥 돌아서면 그때 밀린 변경이
     다음 조작이 있을 때까지 올라가지 못한다. */
  if(syncBusy){ syncSchedule(); return; }
  if(syncT){ clearTimeout(syncT); syncT = null; }
  syncBusy = true;
  syncStatus("동기화 중…");

  function fail(m){
    syncBusy = false;
    syncStatus("실패: " + m);
    if(!quiet) toast("동기화 실패 · " + m);
  }

  var gen = wipeGen;
  var seq0 = changeSeq;                 /* 읽기를 시작한 시점 */
  gistRead(function(text){
    if(gen !== wipeGen){ syncBusy = false; syncStatus(""); return; }   /* 그 사이 초기화됨 */
    var inc = text ? parsePayload(text) : null;
    if(text && !inc){ fail("Gist 내용이 DAP 진도 파일 형식이 아닙니다"); return; }

    /* 지금 풀고 있는 세션은 화면이 튀지 않도록 로컬 것을 그대로 둔다. */
    var liveKey = (session && session.key) ? session.key : null;
    var live = liveKey ? session : null;
    if(liveKey){ session.ts = Date.now(); S.sessions[liveKey] = session; }

    /* 어느 경로로 합칠지 정한다. 판 번호(rev)로 이 기기가 최신판 위에서
       작업했는지 알 수 있으므로, 평상시에는 병합하지 않고 최신 것을 그대로 쓴다.
       병합은 양쪽이 실제로 갈라졌을 때만 — 그때만 삭제가 흐려질 수 있다. */
    /* 읽는 동안 이 기기에서 문항을 풀었다면 그것도 바뀐 것으로 친다.
       그러지 않으면 pull 로 통째로 덮어써 그 답이 사라진다. */
    var dirtyNow = sync.dirty || changeSeq !== seq0;
    var mode;
    if(!inc){
      mode = "first";                       /* Gist 가 비어 있다 · 이 기기 것이 원본이 된다 */
    }else if((inc.rev||0) === sync.base && (inc.by||"") !== sync.baseBy){
      /* 판 번호는 같은데 쓴 기기가 다르다 — 두 기기가 같은 판 위에서 동시에 올려
         내 것이 덮였다는 뜻이다. 내 기록은 아직 이쪽에 있으니 합쳐서 되돌린다.
         git 이라면 non-fast-forward 로 거부됐을 자리다. */
      S = mergeState(S, inc); mode = "recover";
    }else if((inc.rev||0) === sync.base){
      mode = dirtyNow ? "push" : "same";    /* 이 기기가 최신판 위에 있다 */
    }else if(!dirtyNow){
      S = inc; mode = "pull";               /* 저쪽이 앞섰고 이쪽은 바뀐 것이 없다 · 통째로 받는다 */
    }else{
      S = mergeState(S, inc); mode = "merge";  /* 갈라졌다 */
    }
    if(liveKey){ S.sessions[liveKey] = live; session = live; }

    function done(msg, seqAt){
      syncBusy = false;
      sync.base = S.rev || 0; sync.baseBy = S.by || "";
      /* 올릴 내용을 만든 뒤에 또 바뀌었다면 아직 올리지 못한 것이 남아 있다.
         dirty 를 그대로 두고 다시 예약한다. */
      sync.dirty = (changeSeq !== seqAt);
      sync.last = Date.now(); saveSync();
      if(sync.dirty) syncSchedule();
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      applyTypography();   /* 받아온 글꼴·글자 크기를 지금 화면에 반영 */
      syncStatus("");
      if(!quiet) toast(msg);
      if(view.name !== "quiz") render();   /* 받아온 진도를 지금 화면에 바로 반영 */
    }

    /* 올릴 것이 없으면 GitHub 를 건드리지 않는다 */
    if(mode === "same" || mode === "pull"){
      done(mode === "pull" ? "받아왔습니다 · " + Object.keys(S.stats).length + "문항 기록"
                           : "이미 최신입니다", changeSeq);
      return;
    }

    S.rev = Math.max(S.rev||0, sync.base||0, inc ? (inc.rev||0) : 0) + 1;
    S.by  = sync.wid;
    var body = { files:{} };
    body.files[SYNC_FILE] = { content: payloadText() };
    var seq1 = changeSeq;               /* 올릴 내용을 만든 시점 */
    ghReq("PATCH", "/gists/" + encodeURIComponent(sync.gistId), body, function(){
      done((mode === "recover" ? "덮어써진 기록을 되살렸습니다 · "
            : mode === "merge" ? "합쳤습니다 · " : "올렸습니다 · ") +
           Object.keys(S.stats).length + "문항 기록", seq1);
    }, fail);
  }, fail);
}

/* 기록이 바뀌면 잠시 뒤 한 번만 올린다 */
function syncSchedule(){
  if(typeof sync === "undefined" || !syncOn() || !sync.auto) return;
  if(syncT) clearTimeout(syncT);
  syncT = setTimeout(function(){ syncT = null; syncNow(true); }, SYNC_WAIT);
}

/* 탭을 덮으면 예약된 것을 바로 올리고, 돌아오면 다른 기기에서 푼 것을 받아온다.
   폰의 탭은 며칠씩 열려 있는 채로 남으므로, 돌아왔을 때 한 번 받아오지 않으면
   화면이 옛 진도를 그대로 보여 준다. 진행 중인 세션은 syncNow 가 지켜 준다. */
var SYNC_GAP = 60000;                     /* 돌아왔을 때 다시 받아올 최소 간격 */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden"){
    if(syncT) syncNow(true);
    return;
  }
  if(syncOn() && sync.auto && !syncBusy && Date.now() - (sync.last||0) > SYNC_GAP) syncNow(true);
});

function syncLink(){
  var tokEl = $("#syncTok"), gidEl = $("#syncGist");
  var tk  = (tokEl ? tokEl.value : "").trim();
  var gid = (gidEl ? gidEl.value : "").trim();
  if(!tk){ toast("GitHub 토큰을 입력하세요"); return; }
  sync.token = tk;

  if(gid){
    /* Gist 주소를 통째로 붙여 넣어도 ID 만 뽑아 쓴다 */
    var m = gid.match(/[0-9a-f]{20,}/i) || gid.match(/[0-9a-f]{7,}/i);
    sync.gistId = m ? m[0] : gid;
    /* 처음 연결할 때는 이 기기가 어느 판 위에 있는지 알 수 없다. dirty 로 두어
       첫 동기화가 병합을 타게 한다 — 이쪽 기록을 통째로 버리는 일이 없도록. */
    sync.last = 0; sync.base = 0; sync.baseBy = ""; sync.dirty = true; saveSync(); render();
    syncNow(false);
    return;
  }

  /* ID 를 비워 두고 연결하면, 무턱대고 새로 만들지 않고 계정에 이미 있는
     진도 Gist 를 먼저 찾는다. 기기마다 새 Gist 가 생겨 서로 다른 곳을
     바라보는 사고를 막기 위한 것이다. */
  syncStatus("이미 있는 Gist 를 찾는 중…");
  ghReq("GET", "/gists?per_page=100", null, function(list){
    var hits = [];
    if(list && list.length){
      for(var i=0;i<list.length;i++){
        var g = list[i];
        if(g && g.files && g.files[SYNC_FILE]) hits.push(g);
      }
    }
    if(hits.length){
      hits.sort(function(a,b){ return (b.updated_at||"") < (a.updated_at||"") ? -1 : 1; });
      sync.gistId = hits[0].id;
      sync.last = 0; sync.base = 0; sync.baseBy = ""; sync.dirty = true; saveSync(); render();
      toast(hits.length > 1
        ? "진도 Gist 가 " + hits.length + "개 있습니다 · 가장 최근 것에 연결했습니다"
        : "이미 있는 Gist 에 연결했습니다");
      syncNow(false);
      return;
    }
    syncCreate();
  }, function(m){
    syncStatus("실패: " + m);
    toast("연결 실패 · " + m);
  });
}

function syncCreate(){
  syncStatus("Gist 를 만드는 중…");
  var body = { description:"DAP 문제은행 진도", public:false, files:{} };
  body.files[SYNC_FILE] = { content: payloadText() };
  ghReq("POST", "/gists", body, function(g){
    sync.gistId = g.id || "";
    sync.last = Date.now(); saveSync();
    syncStatus(""); render();
    toast("Gist 를 새로 만들었습니다 · 다른 기기에 이 ID 를 넣으세요");
  }, function(m){
    syncStatus("실패: " + m);
    toast("연결 실패 · " + m);
  });
}

/* 전체 초기화. 동기화가 연결된 상태에서 로컬만 지우면 다음 동기화 때 Gist 에 남은
   기록이 병합되어 그대로 돌아온다. 그래서 Gist 까지 함께 비운다.
   병합이 아니라 통째로 덮어써야 한다 — mergeState 를 타면 되살아난다. */
function wipeAll(pushEmpty){
  wipeGen++;
  if(syncT){ clearTimeout(syncT); syncT = null; }
  S = blank(); session = null;
  /* 초기화 시각을 남겨야 다른 기기가 "지워졌다"는 것을 알 수 있다.
     이 표시가 없으면 폰에 남은 기록이 병합으로 되살아나 초기화가 무효가 된다. */
  S.epoch = Date.now();
  /* 다음 판으로 올린다. 판 번호가 그대로면 다른 기기가 "내가 최신"이라고 판단해
     자기 기록을 도로 올려 보낸다. */
  S.rev = (sync.base||0) + 1;
  S.by  = sync.wid;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  go("dash");
  if(!pushEmpty){ sync.dirty = true; saveSync(); toast("초기화했습니다"); return; }
  syncStatus("Gist 를 비우는 중…");
  var body = { files:{} };
  body.files[SYNC_FILE] = { content: payloadText() };
  ghReq("PATCH", "/gists/" + encodeURIComponent(sync.gistId), body, function(){
    sync.base = S.rev; sync.baseBy = S.by; sync.dirty = false;
    sync.last = Date.now(); saveSync(); syncStatus("");
    toast("초기화했습니다 · Gist 도 비웠습니다"); render();
  }, function(m){
    sync.dirty = true; saveSync();
    syncStatus("실패: " + m);
    toast("이 기기는 초기화했지만 Gist 를 비우지 못했습니다 · " + m);
    render();
  });
}

function syncUnlink(){
  if(!confirm("이 브라우저에 저장된 토큰과 Gist 연결을 지웁니다.\n" +
              "Gist 자체와 학습 기록은 그대로 남습니다.\n\nGist ID: " + sync.gistId)) return;
  sync = { token:"", gistId:"", last:0, auto:true, base:0, baseBy:"", dirty:true, wid:sync.wid||newWid() };
  saveSync();
  if(syncT){ clearTimeout(syncT); syncT = null; }
  render();
  toast("동기화 연결을 해제했습니다");
}

/* qid = 화면에 그려져 있던 문항. 지금 위치와 다르면 기록하지 않고 화면을 다시 맞춘다.
   답이 엉뚱한 문항에 들어가는 것은 조용히 오답을 만들므로 안전장치를 둔다. */
function pick(i, qid){
  if(!session) return;
  var cur = session.ids[session.idx];
  if(qid && qid !== cur){ render(); return; }
  var q = QMAP[cur];
  if(!q) return;
  if(session.mode==="study" && session.revealed[q.id]) return;
  /* "모두 고르시오" — 누를 때마다 넣고 뺀다. 채점은 따로(Enter / 채점 버튼).
     다 빼면 미응답으로 돌아간다. */
  if(q.m){
    var cur = pickList(session.ans[q.id]).slice(), k = cur.indexOf(i);
    if(k >= 0) cur.splice(k, 1); else cur.push(i);
    cur.sort(function(x, y){ return x - y; });
    if(cur.length) session.ans[q.id] = cur; else delete session.ans[q.id];
    save(); render();
    return;
  }
  session.ans[q.id] = i; save();
  if(session.mode==="study") reveal(); else render();
}
function reveal(){
  var q = QMAP[session.ids[session.idx]];
  if(session.ans[q.id]===undefined || session.revealed[q.id]) return;
  session.revealed[q.id] = true;
  record(q.id, isRight(q, session.ans[q.id]), session.ans[q.id]);
  save(); render();
}
function nextQ(){
  if(session.idx < session.ids.length-1){ session.idx++; save(); render(); }
  else if(session.mode==="exam"){ toast("마지막 문항입니다 · 제출 버튼으로 채점하세요"); }
  else {
    var n = session.ids.filter(function(id){ return session.revealed[id]; }).length;
    var ok = session.ids.filter(function(id){ return session.revealed[id] && isRight(QMAP[id], session.ans[id]); }).length;
    endSession();
    toast("학습 완료 · "+ok+"/"+n+" 정답");
    go("dash");
  }
}

document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target.id==="nq"){ e.preventDefault(); go("nsearch", { kw: e.target.value }); return; }
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.tagName==="SELECT") return;
  /* 실기 문제 화면 — 좌우 화살표로 이전·다음 문제 */
  if(view.name==="dmq" && DM && (e.key==="ArrowLeft" || e.key==="ArrowRight") && !e.altKey && !e.ctrlKey && !e.metaKey){
    var dk = DM.items.indexOf(dmFind(view.id)), dt = dk >= 0 && DM.items[dk + (e.key==="ArrowRight" ? 1 : -1)];
    if(dt){ e.preventDefault(); go("dmq", { id:dt.id }); }
    return;
  }
  /* 내용정리 절 화면 — 좌우 화살표로 이전·다음 절 */
  if(view.name==="note" && (e.key==="ArrowLeft" || e.key==="ArrowRight") && !e.altKey && !e.ctrlKey && !e.metaKey){
    var all = noteFlat(view.ch), k = noteIndex(all, view.c, view.s), to = k >= 0 && all[k + (e.key==="ArrowRight" ? 1 : -1)];
    if(to){ e.preventDefault(); go("note", { ed:view.ed, ch:to.ch, c:to.c, s:to.s }); }
    return;
  }
  /* 리포트의 문항별 검토도 풀이 화면처럼 좌우 화살표로 넘긴다 */
  if(view.name==="result"){
    if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
    var ex = S.exams.filter(function(x){ return x.id===view.examId; })[0];
    if(!ex) return;
    var n = examIds(ex).filter(function(id){ return QMAP[id]; }).length;
    if(!n) return;
    e.preventDefault();
    /* 접혀 있으면 먼저 편다. 펼쳐진 상태(undefined 는 1번)에서는 한 칸 옮긴다. */
    if(view.rq===null) view.rq = 0;
    else view.rq = Math.min(n-1, Math.max(0, (view.rq||0) + (e.key==="ArrowRight" ? 1 : -1)));
    render();
    return;
  }
  if(view.name!=="quiz" || !session) return;
  var q = QMAP[session.ids[session.idx]];
  if(e.key>="1" && e.key<="9" && +e.key<=q.c.length){ e.preventDefault(); pick(+e.key-1); return; }   /* 보기 수만큼 (158번은 다섯) */
  if(e.key==="ArrowRight"){ e.preventDefault(); if(session.idx<session.ids.length-1){session.idx++;save();render();} return; }
  if(e.key==="ArrowLeft"){ e.preventDefault(); if(session.idx>0){session.idx--;save();render();} return; }
  if(e.key==="Enter"){
    e.preventDefault();
    if(session.mode==="study" && session.ans[q.id]!==undefined && !session.revealed[q.id]) reveal();
    else nextQ();
    return;
  }
  if(e.key==="b"||e.key==="B"){ e.preventDefault();
    if(S.bookmarks[q.id]) delete S.bookmarks[q.id]; else S.bookmarks[q.id]=true; save(); render(); return; }
  if(e.key==="e"||e.key==="E"){ e.preventDefault();
    if(session.mode==="study" && session.ans[q.id]!==undefined) reveal(); return; }
});

/* ─────────── 타이포그래피 ─────────── */
function applyTypography(){
  var f = FONT_MAP[S.settings.fontId] || FONTS[0];
  var r = document.documentElement;
  r.style.setProperty("--font-ui", f.stack);
  r.style.setProperty("--fs", String(S.settings.fontScale));
}
function setFont(id){
  var f = FONT_MAP[id]; if(!f) return;
  S.settings.fontId = f.id; S.settings.fontStack = f.stack;
  applyTypography(); save();
}
/* 글자 크기 변경 후 설정 화면만 살짝 갱신 (스크롤 위치 유지) */
function render_fs(v){
  var lbl = $("#fsVal"), bar = $("#fsBar");
  if(lbl) lbl.textContent = Math.round(v*100)+"%";
  if(bar) bar.value = v;
  $$('[data-act="fsup"]').forEach(function(b){ b.disabled = v >= FS_MAX; });
  $$('[data-act="fsdown"]').forEach(function(b){ b.disabled = v <= FS_MIN; });
}
function setFontScale(v){
  v = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, v)) * 100) / 100;
  S.settings.fontScale = v;
  applyTypography(); save();
  return v;
}

/* ─────────── 브랜드 ───────────
   서비스 이름은 DAPath 로 고정이다. 문제은행 규모(문항·세트·과목)는 문제은행 사이드바 머리에 보인다 */
function applyBrand(){ document.title = "DAPath"; }

/* 테마 */
function applyTheme(){
  var t = S.settings.theme;
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
function cycleTheme(){
  var order = ["auto","light","dark"];
  S.settings.theme = order[(order.indexOf(S.settings.theme)+1)%3];
  applyTheme(); save();
  toast("테마: "+({auto:"시스템 설정",light:"라이트",dark:"다크"})[S.settings.theme]);
}
$$(".js-theme").forEach(function(b){ b.addEventListener("click", cycleTheme); });

window.addEventListener("beforeunload", function(){
  if(session && session.key){ session.ts = Date.now(); S.sessions[session.key] = session; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
});

/* 저장해 둔 묶음으로 되돌린다. 잠긴 묶음이면 기억해 둔 암호로 조용히 연다.
   복호화는 비동기라, 먼저 그리면 0문항·0과목인 빈 화면이 보였다가 새로고침을
   해야 제대로 나온다. 그래서 여는 일이 끝난 뒤에 첫 화면을 그린다. */
function bootBank(done){
  var id = S.settings.bank, b = id && bankById(id);
  if(!b){ done(); return; }
  if(!b.locked){ useBank(id); done(); return; }
  var locks = loadLocks(), pw = locks[id];
  if(!pw || !cryptoOK()){ useBank(id); done(); return; }
  unlockBank(b, pw, function(){ useBank(id); done(); },
    function(){ delete locks[id]; saveLocks(locks); useBank(id); done(); });
}

applyTheme();
applyTypography();
bootBank(function(){
  applyBrand();
  restoreFileHandle();
  vdRestoreDir();
  var hv = viewFromHash();          /* #/2020/… · #/2013/… · #/dm/… 로 열었으면 그 화면부터 */
  if(hv){ view = hv; curMode = modeOf(hv); catLast[catOf(curMode).id] = curMode; }
  render();
  if(syncOn() && sync.auto) syncNow(true);
});
};
